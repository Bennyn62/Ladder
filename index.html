/* ============================================================
   מחולל QR עצמאי בג'אווהסקריפט טהור — בלי ספריות חיצוניות.
   תומך ב-Byte mode בלבד, גרסאות 1-5, תיקון שגיאות L או M,
   בלוק יחיד (אין צורך בפיצול Reed-Solomon למספר בלוקים בגדלים האלה).
   מטרת הפיתוח: להטמיע בתוך Ladder בלי לפנות לרשת כדי להציג QR.
   ============================================================ */

/* --- שדה גלואה GF(256), פולינום פרימיטיבי 0x11D (התקן ל-QR) --- */
const GF_EXP = new Array(512);
const GF_LOG = new Array(256);
(function initGF(){
  let x = 1;
  for(let i=0;i<255;i++){
    GF_EXP[i]=x; GF_LOG[x]=i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(let i=255;i<512;i++) GF_EXP[i]=GF_EXP[i-255];
})();
const gfMul=(a,b)=> (a===0||b===0)?0:GF_EXP[GF_LOG[a]+GF_LOG[b]];

/* פולינום יוצר Reed-Solomon למספר נתון של קודוורדים לתיקון שגיאות */
function rsGenPoly(ec){
  let poly=[1];
  for(let i=0;i<ec;i++){
    const next=new Array(poly.length+1).fill(0);
    for(let j=0;j<poly.length;j++){
      next[j]   ^= poly[j];
      next[j+1] ^= gfMul(poly[j], GF_EXP[i]);
    }
    poly=next;
  }
  return poly; // מדרגה גבוהה לנמוכה
}
function rsEncode(data, ec){
  const gen=rsGenPoly(ec);
  const res=new Array(data.length+ec).fill(0);
  for(let i=0;i<data.length;i++) res[i]=data[i];
  for(let i=0;i<data.length;i++){
    const coef=res[i];
    if(coef===0) continue;
    for(let j=0;j<gen.length;j++) res[i+j] ^= gfMul(gen[j], coef);
  }
  return res.slice(data.length);
}

/* --- טבלאות קיבולת: גרסאות 1-5, בלוק יחיד בלבד --- */
const VER = {
  1:{size:21, total:26, remBits:0},
  2:{size:25, total:44, remBits:7},
  3:{size:29, total:70, remBits:7},
  4:{size:33, total:100,remBits:7},
  5:{size:37, total:134,remBits:7},
};
const EC_CODEWORDS = { // [level][version] -> כמה קודוורדים מתוך total מיועדים לתיקון שגיאות
  L:{1:7, 2:10, 3:15, 4:20, 5:26},
  M:{1:10,2:16, 3:26, 4:36, 5:48},
};
const ALIGN_POS = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30]};
const FORMAT_BITS = {L:0b01, M:0b00, Q:0b11, H:0b10}; // שני הביטים הראשונים של format info

function bestVersion(byteLen, level){
  for(const v of [1,2,3,4,5]){
    const total=VER[v].total, ec=EC_CODEWORDS[level][v], dataCw=total-ec;
    const capacity = dataCw - 2; // מוד(4 סיביות)+מונה(8 סיביות)=12 סיביות≈2 בתים, מעוגל למטה
    if(byteLen<=capacity) return v;
  }
  return null; // אין גרסה מתאימה עד 5 — הקורא יטפל בזה בעדינות
}

/* --- בניית זרם הנתונים (מוד בתים) --- */
function buildDataCodewords(bytes, version, level){
  const total=VER[version].total, ec=EC_CODEWORDS[level][version], dataCw=total-ec;
  const bits=[];
  const push=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  push(0b0100, 4);          // מציין מוד: Byte
  push(bytes.length, 8);    // מונה תווים (8 סיביות בגרסאות 1-9)
  for(const b of bytes) push(b, 8);
  // מסיים (עד 4 אפסים), רק אם יש מקום
  const maxBits=dataCw*8;
  for(let i=0;i<4 && bits.length<maxBits;i++) bits.push(0);
  while(bits.length%8!==0) bits.push(0);
  const codewords=[];
  for(let i=0;i<bits.length;i+=8){
    let byte=0; for(let j=0;j<8;j++) byte=(byte<<1)|bits[i+j];
    codewords.push(byte);
  }
  const pad=[0xEC,0x11];
  let pi=0;
  while(codewords.length<dataCw){ codewords.push(pad[pi%2]); pi++; }
  return {data:codewords.slice(0,dataCw), ec, dataCw};
}

/* --- מטריצת המודולים --- */
function makeMatrix(version){
  const size=VER[version].size;
  const m=Array.from({length:size},()=>new Array(size).fill(null));
  const reserved=Array.from({length:size},()=>new Array(size).fill(false));
  const setFinder=(r0,c0)=>{
    for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){
      const rr=r0+r, cc=c0+c; if(rr<0||cc<0||rr>=size||cc>=size) continue;
      reserved[rr][cc]=true;
      const inBorder = r===-1||r===7||c===-1||c===7;
      const inRing   = r>=0&&r<=6&&c>=0&&c<=6&&(r===0||r===6||c===0||c===6);
      const inCore   = r>=2&&r<=4&&c>=2&&c<=4;
      m[rr][cc] = !inBorder && (inRing||inCore) ? true : (!inBorder && !inRing && !inCore ? false : false);
    }
  };
  setFinder(0,0); setFinder(0,size-7); setFinder(size-7,0);
  // תזמון (טיימינג)
  for(let i=8;i<size-8;i++){ if(m[6][i]===null){ m[6][i]=(i%2===0); reserved[6][i]=true; }
                              if(m[i][6]===null){ m[i][6]=(i%2===0); reserved[i][6]=true; } }
  // יישור
  const pos=ALIGN_POS[version];
  const nearFinder=(r,c)=> (r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8);
  for(const r of pos) for(const c of pos){
    if(nearFinder(r,c)) continue;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
      const rr=r+dr, cc=c+dc;
      reserved[rr][cc]=true;
      const ring = Math.max(Math.abs(dr),Math.abs(dc));
      m[rr][cc] = ring!==1;
    }
  }
  // מודול כהה קבוע
  m[size-8][8]=true; reserved[size-8][8]=true;
  // שמירת מקום למידע העיצוב (format info) — יתמלא בסוף
  for(let i=0;i<9;i++){ if(m[8][i]===null){ m[8][i]=false; reserved[8][i]=true; }
                         if(m[i][8]===null){ m[i][8]=false; reserved[i][8]=true; } }
  for(let i=0;i<8;i++){ m[8][size-1-i]=false; reserved[8][size-1-i]=true;
                         m[size-1-i][8]=false; reserved[size-1-i][8]=true; }
  return {m, reserved, size};
}

function placeData(mat, allBits){
  const {m, reserved, size} = mat;
  let bitIdx=0;
  let dir=-1; // עולים למעלה קודם
  let col=size-1;
  while(col>0){
    if(col===6) col--; // דילוג על עמודת התזמון
    for(let i=0;i<size;i++){
      const row = dir===-1 ? size-1-i : i;
      for(const c of [col, col-1]){
        if(reserved[row][c]) continue;
        const bit = bitIdx<allBits.length ? allBits[bitIdx] : 0;
        m[row][c] = !!bit;
        bitIdx++;
      }
    }
    dir=-dir; col-=2;
  }
}

/* מסכה 0 — פשוטה, תקנית וחוקית; לא מיישמים כאן את כל שמונה המסכות עם ניקוד */
function applyMask(mat){
  const {m, reserved, size}=mat;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    if(reserved[r][c]) continue;
    if((r+c)%2===0) m[r][c]=!m[r][c];
  }
}

function bchFormat(data5){ // BCH(15,5), פולינום 0x537, XOR עם 0x5412 — לפי תקן QR
  let g=data5<<10;
  for(let i=4;i>=0;i--){
    if(g & (1<<(i+10))) g ^= (0x537<<i);
  }
  return ((data5<<10)|g) ^ 0x5412;
}
function placeFormat(mat, level, maskId){
  const {m, size}=mat;
  const data5 = (FORMAT_BITS[level]<<3) | maskId;
  const f = bchFormat(data5);
  const bit=i=>(f>>i)&1;
  // עותק 1 — עוטף את הפינדר הימני-עליון בצורת L, לאורך שורה8 ואז עמודה8
  for(let i=0;i<=5;i++) m[8][i]=!!bit(i);
  m[8][7]=!!bit(6); m[8][8]=!!bit(7); m[7][8]=!!bit(8);
  for(let i=9;i<15;i++) m[14-i][8]=!!bit(i);
  // עותק 2 — כפול ליתירות: ביטים 0-7 לאורך שורה8 ליד הפינדר הימני,
  // ביטים 8-14 לאורך עמודה8 ליד הפינדר התחתון
  for(let i=0;i<8;i++) m[8][size-1-i]=!!bit(i);
  for(let i=8;i<15;i++) m[size-15+i][8]=!!bit(i);
  m[size-8][8]=true;
}

function encodeQR(text, level){
  level = level||'L';
  const bytes=[...unescape(encodeURIComponent(text))].map(c=>c.charCodeAt(0));
  const version=bestVersion(bytes.length, level);
  if(!version) return null;
  const {data, ec, dataCw}=buildDataCodewords(bytes, version, level);
  const ecCw=rsEncode(data, ec);
  const allCw=[...data, ...ecCw];
  const bits=[];
  for(const b of allCw) for(let i=7;i>=0;i--) bits.push((b>>i)&1);
  for(let i=0;i<VER[version].remBits;i++) bits.push(0);
  const mat=makeMatrix(version);
  placeData(mat, bits);
  applyMask(mat);
  placeFormat(mat, level, 0);
  return {size:mat.size, matrix:mat.m, version};
}



/* ---------- ציור ה-QR כ-SVG והצגתו ----------
   רקע לבן קבוע בכוונה, גם במצב כהה — סורק מצלמה צריך ניגודיות
   אמיתית של שחור-על-לבן, לא תלוי בערכת הנושא של האפליקציה.        */
function qrSVG(text, boxPx){
  const res=encodeQR(text,'L');
  if(!res) return '';
  const {size:n, matrix}=res, quiet=4, N=n+quiet*2;
  const px=(boxPx||280)/N;
  let rects='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(matrix[r][c]) rects+=`<rect x="${((c+quiet)*px).toFixed(2)}" y="${((r+quiet)*px).toFixed(2)}" width="${px.toFixed(2)}" height="${px.toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 ${N*px} ${N*px}" style="width:100%;height:auto;display:block;border-radius:12px">
    <rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* כתובת ההצטרפות: הדף הנוכחי בדיוק כפי שהוא באמת מתארח, בלי query string קיים */

    <div class="card" style="padding:16px;margin-top:12px">${svg||'<p class="sub">לא ניתן ליצור קוד QR — הקוד ארוך מדי.</p>'}</div>

const FIREBASE_PROJECT = 'ladder-app-74f7a';
const FIREBASE_KEY     = 'AIzaSyAq_sF_qVHDcgt9WE_8feDTN77zibm53fc';

   כך שגרסה קודמת שנשמרה עם ערכים ריקים תבריא לבד ברגע שהם נוספים כאן. */

const newFamilyCode = ()=>{
  const a='abcdefghjkmnpqrstuvwxyz23456789';
  const g=n=>[...Array(n)].map(()=>a[Math.floor(Math.random()*a.length)]).join('');
  return `${g(4)}-${g(4)}-${g(4)}-${g(4)}`;
};
const docURL = id =>
  `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CFG.project)}/databases/(default)/documents/`+
  `ladder/${encodeURIComponent(CFG.family)}/members`+(id?'/'+encodeURIComponent(id):'')+`?key=${encodeURIComponent(CFG.key)}`;

/* ---------- מיזוג בטוח ----------
   שני מכשירים יכולים לתרגל במקביל. אנחנו לא דורסים — מאחדים:
   לכל כרטיס חזרה נבחר זה שתורגל יותר, וללוג נבחר היום העמוס יותר. */
function mergeUser(local, remote){
  if(!remote) return local;
  if(!local)  return remote;
  const out = Object.assign({}, remote, local);
  out.lv      = Math.max(local.lv||0, remote.lv||0);
  out.xp      = Math.max(local.xp||0, remote.xp||0);
  out.streak  = Math.max(local.streak||0, remote.streak||0);
  out.lastDay = [local.lastDay, remote.lastDay].filter(Boolean).sort().pop() || null;

  out.srs={};
  new Set([...Object.keys(local.srs||{}), ...Object.keys(remote.srs||{})]).forEach(id=>{
    const a=(local.srs||{})[id], b=(remote.srs||{})[id];
    out.srs[id] = !a ? b : !b ? a : ((a.seen||0) >= (b.seen||0) ? a : b);
  });

  out.seenTypes = Object.assign({}, remote.seenTypes||{}, local.seenTypes||{});

  out.mastered={};
  new Set([...Object.keys(local.mastered||{}), ...Object.keys(remote.mastered||{})]).forEach(k=>
    out.mastered[k]=Math.max((local.mastered||{})[k]||0, (remote.mastered||{})[k]||0));

  const byDay={};
  [...(remote.log||[]), ...(local.log||[])].forEach(e=>{
    const p=byDay[e.d]; byDay[e.d] = (!p || (e.n||0)>=(p.n||0)) ? e : p; });
  out.log = Object.values(byDay).sort((a,b)=>a.d<b.d?-1:1).slice(-400);

  /* בקרת הורים ומשימה: מה שעודכן לאחרונה גובר */
  if((remote.ctrlAt||0) > (local.ctrlAt||0)){ out.ctrl=remote.ctrl; out.task=remote.task; out.ctrlAt=remote.ctrlAt; }
  return normalise(out);
}

/* ---------- קריאה וכתיבה ---------- */
/* מצבה: מסמך זעיר שמסמן "הפרופיל הזה נמחק בכוונה".
   בלי זה, מחיקה במכשיר אחד מתבטלת ברגע שמכשיר אחר מסנכרן.  */
async function cloudTombstone(id){
  const body={fields:{
    deleted:{booleanValue:true},
    at:{stringValue:new Date().toISOString()}
  }};
  const r=await fetch(docURL(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('מחיקה בענן נכשלה ('+r.status+')');
  return true;
}

/* מוחק פרופיל מקומית ובענן, ורושם מצבה כדי שלא יחזור */
async function deleteProfile(id){
  USERS = USERS.filter(u=>u.id!==id);
  delete UNLOCKED[id];
  delete CFG.hashes[id];
  if(!Array.isArray(CFG.tombs)) CFG.tombs=[];
  if(!CFG.tombs.includes(id)) CFG.tombs.push(id);
  if(CUR===id){ CUR = USERS[0] ? USERS[0].id : null; Store.set(K_CUR,CUR); }
  saveCfg(); saveUsers();
  if(cloudReady()){
    try{ await cloudTombstone(id); }
    catch(e){ toast('נמחק במכשיר. הסנכרון לענן ייכשל עד שתהיה רשת.'); }
  }
  return true;
}

async function cloudPush(u){
  const body={fields:{
    data:{stringValue:JSON.stringify(u)},
    updated:{stringValue:new Date().toISOString()},
    name:{stringValue:u.name||''}
  }};
  const r=await fetch(docURL(u.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('כתיבה נכשלה ('+r.status+')');
  return true;
}
async function cloudList(){
  const r=await fetch(docURL(''));
  if(r.status===404) return {users:[], tombs:[]};
  if(!r.ok) throw new Error('קריאה נכשלה ('+r.status+')');
  const j=await r.json();
  const users=[], tombs=[];
  (j.documents||[]).forEach(d=>{
    const f=d.fields||{};
    if(f.deleted && f.deleted.booleanValue){
      /* שם המסמך הוא ה-id — משם לוקחים את מי שנמחק */
      const id=(d.name||'').split('/').pop();
      if(id) tombs.push(id);
      return;
    }
    if(!f.data) return;
    try{ users.push(JSON.parse(f.data.stringValue)); }catch(e){}
  });
  return {users, tombs};
}

/* ---------- סנכרון מלא ---------- */
let SYNCING=false;
async function cloudSync(silent){
  if(!cloudReady() || SYNCING) return false;
  SYNCING=true;
  try{
    const {users:remote, tombs:remoteTombs} = await cloudList();
    /* קונפיג שנשמר לפני שהמצבות נוספו לא יכיל את המערך — משלימים */
    if(!Array.isArray(CFG.tombs)) CFG.tombs=[];
    /* מאחדים מצבות: מה שנמחק כאן ומה שנמחק במכשיר אחר */
    remoteTombs.forEach(id=>{ if(!CFG.tombs.includes(id)) CFG.tombs.push(id); });
    const dead = new Set(CFG.tombs);

    /* מחיקה שהגיעה ממכשיר אחר — מיישמים אותה גם כאן */
    USERS = USERS.filter(u=>!dead.has(u.id));
    if(CUR && dead.has(CUR)){ CUR = USERS[0] ? USERS[0].id : null; Store.set(K_CUR,CUR); }

    const byId={}; remote.forEach(r=>{ if(!dead.has(r.id)) byId[r.id]=r; });
    /* מיזוג נכנס */
    USERS = USERS.map(l => byId[l.id] ? mergeUser(l, byId[l.id]) : l);
    /* פרופילים שקיימים רק בענן — ולא נמחקו */
    remote.forEach(r=>{ if(!dead.has(r.id) && !USERS.some(l=>l.id===r.id)) USERS.push(normalise(r)); });
    saveUsers(); saveCfg();

    /* מוודאים שכל מחיקה מקומית באמת נרשמה בענן */
    for(const id of CFG.tombs){
      if(remoteTombs.includes(id)) continue;
      try{ await cloudTombstone(id); }catch(e){}
    }

    /* דחיפה החוצה — רק פרופילים שהשתנו מאז הסנכרון האחרון */
    let pushed=0;
    for(const u of USERS){
      if(dead.has(u.id)) continue;
      const h=hashCode(JSON.stringify(u));
      if(CFG.hashes[u.id]===h) continue;
      await cloudPush(u); CFG.hashes[u.id]=h; pushed++;
    }
    CFG.last=new Date().toISOString(); saveCfg();
    if(!silent) toast(pushed?`סונכרן · ${pushed} פרופילים`:'הכול מעודכן');
    return true;
  }catch(e){
    if(!silent) toast('הסנכרון נכשל: '+e.message);
    return false;
  }finally{ SYNCING=false; }
}

/* ============================================================
   קול ענן — Google Cloud Text-to-Speech
   ------------------------------------------------------------
   למה זה נחוץ: ספארי ב-iOS חושף לדפי אינטרנט רק את קולות המערכת
   הדחוסים. הם נשמעים מתכתיים, וזו מגבלת דפדפן — אי אפשר לתקן
   אותה בקוד. TTS ענן מייצר אודיו נוירוני אמיתי בצד השרת.

   למה זה זול/פשוט כאן: פרויקט Firebase הוא פרויקט Google Cloud,
   ולכן אותו Project ID ואותו API key שכבר בקובץ יכולים לשמש גם
   כאן — צריך רק להפעיל את ה-API בקונסולה.

   שלוש שכבות הגנה מפני עלות ואיטיות:
   1. מטמון IndexedDB — כל מילה נשלפת פעם אחת בחיים ואז מנוגנת מקומית
   2. מטמון זיכרון לסשן הנוכחי
   3. נפילה חיננית לקול המכשיר אם הענן כבוי, נכשל, או אין רשת
   ============================================================ */

const K_TTS='ladder.tts';
let TTS = Store.get(K_TTS, {on:false, voice:'', rate:1.0});

const saveTTS = ()=> Store.set(K_TTS, TTS);
const ttsReady = ()=> !!(TTS.on && TTS.voice && FIREBASE_PROJECT && FIREBASE_KEY);

/* ---------- מטמון IndexedDB ---------- */
const TTS_DB='ladder-tts', TTS_STORE='clips';
let _ttsDB=null;
function ttsDB(){
  return new Promise((res,rej)=>{
    if(_ttsDB) return res(_ttsDB);
    if(!window.indexedDB) return rej(new Error('no indexedDB'));
    const r=indexedDB.open(TTS_DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(TTS_STORE)) r.result.createObjectStore(TTS_STORE); };
    r.onsuccess=()=>{ _ttsDB=r.result; res(_ttsDB); };
    r.onerror=()=>rej(r.error);
  });
}
async function clipGet(k){
  try{
    const db=await ttsDB();
    return await new Promise((res,rej)=>{
      const q=db.transaction(TTS_STORE,'readonly').objectStore(TTS_STORE).get(k);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error);
    });
  }catch(e){ return null; }
}
async function clipSet(k,v){
  try{
    const db=await ttsDB();
    await new Promise((res,rej)=>{
      const q=db.transaction(TTS_STORE,'readwrite').objectStore(TTS_STORE).put(v,k);
      q.onsuccess=()=>res(); q.onerror=()=>rej(q.error);
    });
  }catch(e){}
}
async function clipCount(){
  try{
    const db=await ttsDB();
    return await new Promise((res,rej)=>{
      const q=db.transaction(TTS_STORE,'readonly').objectStore(TTS_STORE).count();
      q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
    });
  }catch(e){ return 0; }
}
async function clipClear(){
  try{
    const db=await ttsDB();
    await new Promise((res,rej)=>{
      const q=db.transaction(TTS_STORE,'readwrite').objectStore(TTS_STORE).clear();
      q.onsuccess=()=>res(); q.onerror=()=>rej(q.error);
    });
  }catch(e){}
}

/* ---------- שליפת רשימת הקולות מה-API ----------
   לא מקודדים שמות קולות בקוד — שואלים את ה-API מה באמת זמין,
   כדי שלא נצביע על קול שלא קיים או שהוחלף.                    */
let CLOUD_VOICES=null;
/* שומרים את האבחון האחרון כדי שאפשר יהיה להציג אותו למשתמש.
   הודעת השגיאה של Google היא המידע השימושי ביותר כאן — היא אומרת
   במפורש מה חסר ולרוב כוללת קישור ישיר להפעלת ה-API.            */
let TTS_DIAG = null;

async function ttsRequest(url, opt){
  let r, bodyText='';
  try{ r = await fetch(url, opt); }
  catch(netErr){
    TTS_DIAG={step:url.includes('/voices')?'voices':'synthesize', status:0,
      msg:'הבקשה לא יצאה בכלל — אין רשת, או שהדפדפן חסם אותה (CORS).', raw:String(netErr)};
    throw new Error(TTS_DIAG.msg);
  }
  try{ bodyText = await r.text(); }catch(e){}
  if(!r.ok){
    let gmsg='', gstatus='';
    try{ const j=JSON.parse(bodyText); gmsg=j.error?.message||''; gstatus=j.error?.status||''; }catch(e){}
    TTS_DIAG={ step:url.includes('/voices')?'voices':'synthesize', status:r.status,
               gstatus, msg:gmsg||('HTTP '+r.status), raw:bodyText.slice(0,900) };
    throw new Error(TTS_DIAG.msg);
  }
  TTS_DIAG={step:url.includes('/voices')?'voices':'synthesize', status:r.status, msg:'תקין', raw:''};
  try{ return JSON.parse(bodyText); }catch(e){ throw new Error('תשובה לא תקינה מהשרת'); }
}

async function fetchCloudVoices(){
  const url=`https://texttospeech.googleapis.com/v1/voices?languageCode=en-US&key=${encodeURIComponent(FIREBASE_KEY)}`;
  const j=await ttsRequest(url);
  /* דירוג: Studio ו-Chirp הם האיכותיים ביותר, אחריהם Neural2, אחריהם
     Wavenet, ולבסוף Standard (שהוא הדחוס והפחות טבעי).            */
  const tier = n => /studio/i.test(n)?5 : /chirp/i.test(n)?4 : /neural/i.test(n)?3 : /wavenet/i.test(n)?2 : 1;
  CLOUD_VOICES=(j.voices||[])
    .filter(v=>/^en-US/i.test(v.name))
    .map(v=>({name:v.name, gender:v.ssmlGender, tier:tier(v.name)}))
    .sort((a,b)=>b.tier-a.tier || a.name.localeCompare(b.name));
  /* בוחרים אוטומטית את הקול המדורג ראשון, כדי שלא יידרש צעד נוסף
     שקל לפספס (בחירה באותו ערך בתפריט לא מפעילה onchange).       */
  if(CLOUD_VOICES.length && !CLOUD_VOICES.some(v=>v.name===TTS.voice)){
    TTS.voice=CLOUD_VOICES[0].name; TTS.on=true; saveTTS();
  }
  return CLOUD_VOICES;
}
const TIER_HE = {5:'Studio · הטבעי ביותר',4:'Chirp · טבעי מאוד',3:'Neural2 · טבעי',2:'WaveNet · טוב',1:'Standard · בסיסי'};

/* ---------- סינתזה ---------- */
const MEM_CLIPS={};
let ttsFails=0;

async function ttsSynth(text, voice){
  const key=voice+'|'+text;
  if(MEM_CLIPS[key]) return MEM_CLIPS[key];
  const cached=await clipGet(key);
  if(cached){ MEM_CLIPS[key]=cached; return cached; }

  const url=`https://texttospeech.googleapis.com/v1/text:synthesize?key=${encodeURIComponent(FIREBASE_KEY)}`;
  const body={
    input:{text:String(text)},
    voice:{languageCode:'en-US', name:voice},
    audioConfig:{audioEncoding:'MP3', speakingRate: TTS.rate || 1.0}
  };
  const j=await ttsRequest(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!j.audioContent) throw new Error('השרת החזיר תשובה בלי אודיו');
  const dataURL='data:audio/mp3;base64,'+j.audioContent;
  MEM_CLIPS[key]=dataURL;
  clipSet(key,dataURL);   /* לא ממתינים — הכתיבה למטמון לא צריכה לעכב נגינה */
  return dataURL;
}

let curAudio=null;
function stopAudio(){ if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio=null; } }

async function sayCloud(text, rate){
  const clip=await ttsSynth(text, TTS.voice);
  stopAudio();
  const a=new Audio(clip);
  /* rate כאן הוא כיוונון עדין מעל הקצב שנקבע בסינתזה — כך שהאטה
     בתרגיל האזנה עדיין עובדת בלי לבקש קליפ חדש מהשרת.          */
  a.playbackRate = Math.max(.5, Math.min(2, (rate||1)/( .95 )));
  curAudio=a;
  await a.play();
  return true;
}

/* ---------- שחרור אודיו ב-iOS ----------
   אותה מגבלה כמו speechSynthesis: הנגינה הראשונה חייבת לבוא
   מתוך מחווה של המשתמש. משחררים בשקט במגע הראשון.            */
let AUDIO_UNLOCKED=false;
function unlockAudio(){
  if(AUDIO_UNLOCKED) return;
  AUDIO_UNLOCKED=true;
  try{
    const a=new Audio('data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA');
    a.volume=0; a.play().catch(()=>{});
  }catch(e){}
}
addEventListener('touchstart', unlockAudio, {once:true, passive:true});
addEventListener('mousedown',  unlockAudio, {once:true});

        : d && d.status===429 ? 'עברתם את המכסה. בדקו חיוב ומכסות בקונסולה.'
        : d && d.status===0   ? 'הבקשה לא יצאה כלל — אין רשת, או שהדפדפן חסם אותה.'
        : 'ראו את ההודעה המקורית למטה.';

      out.innerHTML = `<div class="card" style="padding:12px">${lines.join('')}</div>
        <p class="sub" style="margin-top:10px">${esc(advice)}</p>
        ${d && d.msg && d.msg!=='תקין' ? `<div class="sec-title">ההודעה של Google</div>
          <div class="ruleblk"><span class="ex" style="white-space:pre-wrap;font-size:.76rem;line-height:1.6;direction:ltr;text-align:left">${esc(d.msg)}</span></div>

    };

    sh.querySelector('#clr').onclick=async()=>{
      await clipClear();
      for(const k in MEM_CLIPS) delete MEM_CLIPS[k];
      closeSheet(); toast('המטמון נוקה');
    };
  });
}
/* ---------------- התקדמות וניתוח ----------------
   progressBlock בונה את כל בלוק הניתוח — משמש גם למסך "ההתקדמות שלי"
   וגם ללוח הבקרה של ההורה, כדי שההורה יראה בדיוק את אותו עומק נתונים
   שהלומד רואה על עצמו, בלי לשכפל את הלוגיקה פעמיים.
   opts.self=true מוסיף כפתור "תרגול חולשות" שמפעיל סשן על המשתמש
   הפעיל כרגע — ולכן הוא מוצג רק כשמסתכלים על עצמך, לא כשהורה צופה
   בפרופיל של הילד מהמכשיר שלו (שם startSession() היה מפעיל סשן
   בטעות על ההורה עצמו, לא על הילד).                                 */
function progressBlock(u, opts={}){
  const a=analyse(u);
  const days=[...Array(14)].map((_,i)=>{
    const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);
    return u.log.find(x=>x.d===d)||{d,n:0,ok:0,ms:0};
  });
  const mx=Math.max(1,...days.map(d=>d.n));
  return `
   <div class="grid2" style="margin-top:14px">
     <div class="stat"><div class="n">${a.vocab}</div><div class="l">מילים בשליטה מלאה</div></div>
     <div class="stat"><div class="n">${a.learning}</div><div class="l">בתהליך למידה</div></div>
     <div class="stat"><div class="n">${Math.round(a.accAll*100)||0}%</div><div class="l">דיוק כולל</div></div>
     <div class="stat"><div class="n">${a.avgMs?(a.avgMs/1000).toFixed(1)+'s':'—'}</div><div class="l">זמן שליפה ממוצע</div></div>
   </div>
   <div class="sec-title">פעילות ב־14 הימים האחרונים</div>
   <div class="card"><div class="bars">${days.map(d=>
      `<div class="${d.n?'hot':''}" style="height:${Math.max(3,d.n/mx*100)}%" title="${d.d}: ${d.n}"></div>`).join('')}</div>
     <div class="legend"><span>${days[0].d.slice(5)}</span><span>${days[13].d.slice(5)}</span></div>
     <p class="muted" style="margin:10px 0 0">סה"כ ${days.reduce((x,d)=>x+d.n,0)} תרגילים בשבועיים · רצף ${u.streak} ימים</p></div>
   ${a.weakTypes.length?`<div class="sec-title">איפה כדאי להתמקד</div><div class="card">${
     a.weakTypes.map(w=>`<div class="wordrow"><span class="dot" style="background:${w.acc<.6?'var(--bad)':'var(--gold)'}"></span>
       <span style="flex:1">${TYPE_HE[w.t]||w.t}</span><span class="badge">${Math.round(w.acc*100)}%</span></div>`).join('')}
     ${opts.self?'<button class="btn sm" style="margin-top:12px;width:100%" onclick="startSession(\'weak\',12)">תרגול ממוקד חולשות</button>':''}</div>`:''}
   ${a.weakWords.length?`<div class="sec-title">מילים שעדיין לא יושבות</div><div class="card">${
     a.weakWords.map(x=>{const w=WORDS.find(y=>y.en===x.w)||{he:''};
       return `<div class="wordrow"><span class="dot" style="background:var(--bad)"></span>
       <span class="w">${esc(x.w)}</span><span class="h">${esc(w.he)}</span>
       <span class="badge">${x.c.ok}/${x.c.seen}</span></div>`}).join('')}</div>`:''}
   <div class="sec-title">שליטה לפי רמה</div><div class="card">${
     LEVELS.filter(l=>l.id<=u.lv).map(l=>{const p=l.id<u.lv?(u.mastered[l.id]||100):levelPct(u,l.id);
       return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600">
         <span>${l.id} · ${l.nm}</span><span class="badge">${p}%</span></div>
         <div class="progline" style="margin-top:5px"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
   <p class="muted" style="margin-top:14px">${a.dueNow} פריטים ממתינים לחזרה. אלגוריתם החזרות מציג כל פריט בדיוק לפני שהוא נשכח — לכן חשוב יותר לתרגל כל יום מעט, מאשר הרבה פעם בשבוע.</p>`;
}

      <div class="stat"><div class="n">${a.vocab}</div><div class="l">מילים בשליטה</div></div>
      <div class="stat"><div class="n">${Math.round(a.accAll*100)||0}%</div><div class="l">דיוק</div></div>
      <div class="stat"><div class="n">${a.avgMs?(a.avgMs/1000).toFixed(1)+'s':'—'}</div><div class="l">זמן שליפה</div></div>

      `<div class="wordrow"><span style="flex:1">${TYPE_HE[w.t]||w.t}</span><span class="badge">${Math.round(w.acc*100)}%</span></div>`).join('')}</div>`:''}

    ${x.ctrl.lockData?'':'<button class="btn ghost" style="margin-top:8px" id="rm">מחיקת הלומד</button>'}`, sh=>{
    sh.querySelector('#ct').onclick=()=>{ closeSheet(); askParent(()=>ctrlSheet(x)); };

function exportData(){
  const blob=new Blob([JSON.stringify({v:1,users:USERS},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ladder-backup-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.users) throw 0;
      if(!confirm('הייבוא יחליף את כל הנתונים הקיימים. להמשיך?')) return;
      USERS=d.users; USERS.forEach(normalise); CUR=USERS[0]?.id||null; saveUsers(); Store.set(K_CUR,CUR); toast('יובא'); render();
    }catch(e){ toast('הקובץ לא תקין'); } };
    r.readAsText(f); };
  i.click();
}

  setTimeout(()=>joinSheet(p.trim()), 250);
})();
/* רשימת הקולות מגיעה מהדפדפן באיחור — מרעננים את מסך ההגדרות כשהיא נטענת */
if(window.speechSynthesis){
  let once=false;
  speechSynthesis.addEventListener('voiceschanged', ()=>{
    loadVoices();
    if(!once && TAB==='family'){ once=true; render(); }
  });
}


/* ---------- אבחון קולות ----------
   מציג בדיוק מה הדפדפן מדווח, כולל שפות אחרות. שימושי כשקול שהותקן
   במכשיר לא מופיע ברשימה — ואז רואים אם הוא בכלל נחשף לדפדפן.        */
function voiceDiag(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const en  = all.filter(v=>/^en/i.test(v.lang));
  const row = v=>`<div class="wordrow">
    <span class="dot" style="background:${voiceTier(v)==='premium'?'var(--good)':voiceTier(v)==='junk'?'var(--bad)':'var(--gold)'}"></span>
    <span class="w">${esc(v.name)}</span>
    <span class="h">${esc(v.lang)} · ${v.localService===false?'רשת':'מקומי'}${v.default?' · ברירת מחדל':''}</span>
    <span class="badge">${voiceScore(v)}</span></div>`;
  sheet(`<h2>אבחון קולות</h2>
    <div class="grid3" style="margin-top:14px">
      <div class="stat"><div class="n">${all.length}</div><div class="l">סה"כ קולות</div></div>
      <div class="stat"><div class="n">${en.length}</div><div class="l">אנגלית</div></div>
      <div class="stat"><div class="n">${all.filter(v=>/premium|enhanced|neural/i.test(v.name)).length}</div><div class="l">משודרגים</div></div>
    </div>
    ${all.some(v=>/\bava\b/i.test(v.name))
      ? '<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)"><b>Ava נמצאה</b><div class="sub" style="margin-top:3px">אפשר לבחור אותה ברשימת הקולות.</div></div>'
      : `<div class="card" style="margin-top:12px;border-color:var(--gold)"><b>Ava לא נחשפת לדפדפן</b>
         <div class="sub" style="margin-top:4px">היא כנראה מותקנת במכשיר, אבל ספארי לא מעביר קולות Premium ו‑Enhanced לדפי אינטרנט — רק לאפליקציות מקוריות ול‑VoiceOver. זו מגבלה של הדפדפן ולא של האפליקציה, ואין דרך לעקוף אותה מהקוד.</div></div>`}
    <div class="sec-title">כל הקולות שהמכשיר מדווח</div>
    <div class="card">${all.length?all.slice().sort((a,b)=>voiceScore(b)-voiceScore(a)).map(row).join('')
      :'<p class="sub">הדפדפן לא מדווח על אף קול. נסו לרענן, או לפתוח את האפליקציה מהאתר עצמו ולא מתוך תצוגה מוטמעת.</p>'}</div>
    <p class="muted" style="margin-top:12px">אם הרשימה נראית שונה כשפותחים ישירות בספארי לעומת אפליקציה אחרת — זה סימן שהתצוגה המוטמעת מגבילה את הקולות.</p>`);
}

</script>

</html>
