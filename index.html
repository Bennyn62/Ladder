    <div class="card">
      <div class="field" style="margin-bottom:0"><label>קפיצה ידנית לרמה</label>
        <select id="lv">${LEVELS.map(l=>`<option value="${l.id}" ${l.id===u.lv?'selected':''}>${l.id} · ${l.nm}</option>`).join('')}</select>
        <p class="muted" style="margin-top:7px">בדרך כלל לא צריך לגעת בזה — הרמה עולה מעצמה ב‑${LEVELS[u.lv].need}% שליטה. שימושי אם התחלתם נמוך מדי.</p></div>
      <button class="btn sm" style="width:100%;margin-top:12px" id="sv">שמירה</button>
    </div>`}
    <div class="sec-title">ענן</div>
    ${cloudCard()}

    ${u.ctrl.lockData?'':`<div class="sec-title">גיבוי מקומי</div>
    <div class="card"><p class="sub">כל הנתונים נשמרים במכשיר בלבד. ייצאו קובץ לפני החלפת מכשיר.</p>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" style="width:100%" onclick="exportData()">ייצוא</button>
        <button class="btn ghost sm" style="width:100%" onclick="importData()">ייבוא</button>
      </div></div>`}
    <button class="btn ghost" style="margin-top:12px" onclick="UNLOCKED={};CUR=null;Store.set(K_CUR,null);TAB='users';render()">החלפת לומד</button>
    ${Store.persistent?'':'<p class="muted" style="margin-top:16px">תצוגה מקדימה — הנתונים לא נשמרים בין רענונים. אחרי העלאה לאתר השמירה תעבוד.</p>'}`;
  const ul=$('#ul');
  USERS.forEach(x=>{
    const a=analyse(x);
    const b=el(`<button class="usercard ${x.id===CUR?'on':''}"><div class="av">${x.emoji}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(x.name)} ${x.id===CUR?'<span class="pill">פעיל</span>':''}</div>
      <div class="muted">רמה ${x.lv} · ${a.vocab} מילים · ${Math.round(a.accAll*100)||0}% דיוק · 🔥 ${x.streak}</div></div></button>`);
    b.onclick=()=>userSheet(x);
    ul.appendChild(b);
  });
  const segs=(id,key)=>sh=>0;
  ['th','sz'].forEach(id=>{
    const key = id==='th'?'theme':'size';
    document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); u.settings[key]=b.dataset.v; saveUsers(); applyTheme();
    });
  });
  const apply=()=>{
    u.settings.voice=$('#vc').value||null;
    u.settings.speed=+$('#sp').value;
    u.settings.pitch=+$('#pt').value;
    u.settings.autoSpeak=$('#au').value==='1';
  };
  if($('#useava')) $('#useava').onclick=()=>{
    const a=findAva(); if(!a) return;
    u.settings.voice=a.name; saveUsers();
    say('Hi, I am Ava. This is how I will sound.'); render();
  };
  $('#vc').onchange=()=>{ apply(); say('This is how I will sound. Listen and repeat.'); };
  $('#tv').onclick =()=>{ apply(); say('This is how I will sound. Listen and repeat.'); };
  $('#sp').onchange=()=>{ apply(); say('Listen and repeat.'); };
  $('#pt').onchange=()=>{ apply(); say('Listen and repeat.'); };
  $('#sv').onclick =()=>{ apply(); u.lv=+$('#lv').value; saveUsers(); toast('נשמר'); render(); };
}

function userSheet(x){
  const a=analyse(x);
  sheet(`<div style="display:flex;align-items:center;gap:12px"><div class="av" style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:var(--brand-soft)">${x.emoji}</div>
    <div><h2 style="margin:0">${esc(x.name)}</h2><div class="muted">רמה ${x.lv} · ${LEVELS[x.lv].nm}</div></div></div>
    <div class="grid2" style="margin-top:14px">
      <div class="stat"><div class="n">${a.vocab}</div><div class="l">מילים בשליטה</div></div>
      <div class="stat"><div class="n">${Math.round(a.accAll*100)||0}%</div><div class="l">דיוק</div></div>
      <div class="stat"><div class="n">${a.avgMs?(a.avgMs/1000).toFixed(1)+'s':'—'}</div><div class="l">זמן שליפה</div></div>
      <div class="stat"><div class="n">${x.streak}</div><div class="l">רצף ימים</div></div>
    </div>
    ${a.weakTypes.length?`<div class="sec-title">חולשות</div><div class="card">${a.weakTypes.map(w=>
      `<div class="wordrow"><span style="flex:1">${TYPE_HE[w.t]||w.t}</span><span class="badge">${Math.round(w.acc*100)}%</span></div>`).join('')}</div>`:''}
    <button class="btn" style="margin-top:14px" id="sw">מעבר ללומד הזה</button>
    <button class="btn ghost" style="margin-top:8px" id="ct">בקרה והרשאות</button>
    ${x.ctrl.lockData?'':'<button class="btn ghost" style="margin-top:8px" id="rm">מחיקת הלומד</button>'}`, sh=>{
    sh.querySelector('#ct').onclick=()=>{ closeSheet(); askParent(()=>ctrlSheet(x)); };
    sh.querySelector('#sw').onclick=()=>{ CUR=x.id; Store.set(K_CUR,CUR); closeSheet(); TAB='home'; render(); };
    /* מחיקה תמיד עוברת דרך שער הורה, גם אם לפרופיל הזה עצמו אין קוד —
       lockData קובע אם הכפתור בכלל מוצג, אבל לא סומך רק על זה: מי
       שרוצה למחוק בפועל חייב להקליד את קוד ההורה שלו.               */
    if(sh.querySelector('#rm')) sh.querySelector('#rm').onclick=()=>{
      closeSheet();
      askParent(()=>{
        if(!confirm(`למחוק את ${x.name} ואת כל ההתקדמות? אי אפשר לבטל.`)) return;
        USERS=USERS.filter(y=>y.id!==x.id); delete UNLOCKED[x.id];
        if(CUR===x.id){CUR=USERS[0]?.id||null;Store.set(K_CUR,CUR);}
        saveUsers(); render();
      });
    };
  });
}

function exportData(){
  const blob=new Blob([JSON.stringify({v:1,users:USERS},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ladder-backup-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.users) throw 0;
      if(!confirm('הייבוא יחליף את כל הנתונים הקיימים. להמשיך?')) return;
      USERS=d.users; USERS.forEach(normalise); CUR=USERS[0]?.id||null; saveUsers(); Store.set(K_CUR,CUR); toast('יובא'); render();
    }catch(e){ toast('הקובץ לא תקין'); } };
    r.readAsText(f); };
  i.click();
}

/* ---------------- גיליון תחתון ---------------- */
function sheet(html, after){
  closeSheet();
  const bg=el(`<div class="sheet-bg"><div class="sheet"><div class="grab"></div>${html}</div></div>`);
  bg.onclick=e=>{ if(e.target===bg) closeSheet(); };
  document.body.appendChild(bg);
  if(after) after(bg.querySelector('.sheet'));
}
function closeSheet(){ document.querySelector('.sheet-bg')?.remove(); }

/* ---------------- הפעלה ---------------- */
if(CUR && !me()) CUR=null;
applyTheme();
render();
pinFixedBars();
if(CFG.auto && cloudReady()) cloudSync(true);

/* קישור הצטרפות שנפתח מסריקת QR: ?join=קוד-המשפחה.
   מנקים את הפרמטר מהכתובת מיד, כדי שלא יישאר בהיסטוריה/סימניה
   ולא יפעיל שוב את אותה בקשת הצטרפות ברענון הבא.                */
(function(){
  const p=new URLSearchParams(location.search).get('join');
  if(!p || !cloudConfigured()) return;
  history.replaceState(null,'',location.pathname);
  setTimeout(()=>joinSheet(p.trim()), 250);
})();
/* רשימת הקולות מגיעה מהדפדפן באיחור — מרעננים את מסך ההגדרות כשהיא נטענת */
if(window.speechSynthesis){
  let once=false;
  speechSynthesis.addEventListener('voiceschanged', ()=>{
    loadVoices();
    if(!once && TAB==='family'){ once=true; render(); }
  });
}


/* ---------- אבחון קולות ----------
   מציג בדיוק מה הדפדפן מדווח, כולל שפות אחרות. שימושי כשקול שהותקן
   במכשיר לא מופיע ברשימה — ואז רואים אם הוא בכלל נחשף לדפדפן.        */
function voiceDiag(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const en  = all.filter(v=>/^en/i.test(v.lang));
  const row = v=>`<div class="wordrow">
    <span class="dot" style="background:${voiceTier(v)==='premium'?'var(--good)':voiceTier(v)==='junk'?'var(--bad)':'var(--gold)'}"></span>
    <span class="w">${esc(v.name)}</span>
    <span class="h">${esc(v.lang)} · ${v.localService===false?'רשת':'מקומי'}${v.default?' · ברירת מחדל':''}</span>
    <span class="badge">${voiceScore(v)}</span></div>`;
  sheet(`<h2>אבחון קולות</h2>
    <div class="grid3" style="margin-top:14px">
      <div class="stat"><div class="n">${all.length}</div><div class="l">סה"כ קולות</div></div>
      <div class="stat"><div class="n">${en.length}</div><div class="l">אנגלית</div></div>
      <div class="stat"><div class="n">${all.filter(v=>/premium|enhanced|neural/i.test(v.name)).length}</div><div class="l">משודרגים</div></div>
    </div>
    ${all.some(v=>/\bava\b/i.test(v.name))
      ? '<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)"><b>Ava נמצאה</b><div class="sub" style="margin-top:3px">אפשר לבחור אותה ברשימת הקולות.</div></div>'
      : `<div class="card" style="margin-top:12px;border-color:var(--gold)"><b>Ava לא נחשפת לדפדפן</b>
         <div class="sub" style="margin-top:4px">היא כנראה מותקנת במכשיר, אבל ספארי לא מעביר קולות Premium ו‑Enhanced לדפי אינטרנט — רק לאפליקציות מקוריות ול‑VoiceOver. זו מגבלה של הדפדפן ולא של האפליקציה, ואין דרך לעקוף אותה מהקוד.</div></div>`}
    <div class="sec-title">כל הקולות שהמכשיר מדווח</div>
    <div class="card">${all.length?all.slice().sort((a,b)=>voiceScore(b)-voiceScore(a)).map(row).join('')
      :'<p class="sub">הדפדפן לא מדווח על אף קול. נסו לרענן, או לפתוח את האפליקציה מהאתר עצמו ולא מתוך תצוגה מוטמעת.</p>'}</div>
    <p class="muted" style="margin-top:12px">אם הרשימה נראית שונה כשפותחים ישירות בספארי לעומת אפליקציה אחרת — זה סימן שהתצוגה המוטמעת מגבילה את הקולות.</p>`);
}
