<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="auto" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="#eceeed">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ladder · לימוד אנגלית למשפחה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Ladder — מערכת עיצוב
   הרעיון: מכשיר מדידה. האפליקציה מודדת את הפער בין "לדעת" ל"לשלוף",
   ולכן הנתונים מוצגים בדיוק של ציוד בדיקה — והתוכן עצמו גדול וחם.
   שתי מערכות כתב, שני כיווני קריאה, שלוש משפחות גופנים.
   ============================================================ */
:root{
  color-scheme: light dark;
  --he:'Assistant',system-ui,sans-serif;
  --en:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;

  --ink:#0f1b21; --ink2:#43585f; --ink3:#7d9099; --ink4:#a9b8be;
  --paper:#eceeed; --card:#ffffff; --line:#dbe0e0; --line2:#eaeeed;
  --brand:#0e7c86; --brand2:#0a5d66; --brand-soft:#dbeef0;
  --live:#ff5a36; --live-soft:#ffe7e0;
  --good:#2f9e6a; --good-soft:#dff2e8;
  --bad:#d94a2b; --bad-soft:#fce6df;
  --gold:#d9922b; --gold-soft:#fbeed6;

  --r:14px; --r-lg:20px; --r-xl:28px;
  --sh:0 1px 1px rgba(15,27,33,.04), 0 4px 14px rgba(15,27,33,.06);
  --sh-lift:0 2px 4px rgba(15,27,33,.07), 0 18px 44px rgba(15,27,33,.16);
  --bar:78px;
  --fs:16px;
}
[data-theme="dark"]{
  color-scheme: dark;
  --ink:#e8edee; --ink2:#a7bcc2; --ink3:#7b9199; --ink4:#546a72;
  --paper:#0c1418; --card:#141f24; --line:#243239; --line2:#1b272c;
  --brand:#2bb3bd; --brand2:#1d8b95; --brand-soft:#123239;
  --live:#ff7051; --live-soft:#3a1c14;
  --good:#43c088; --good-soft:#123024;
  --bad:#f0704f; --bad-soft:#3a1811;
  --gold:#e8ab4d; --gold-soft:#332512;
  --sh:0 1px 1px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  --sh-lift:0 2px 4px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
}
[data-theme="light"]{ color-scheme: light; }
@media (prefers-color-scheme:dark){
  [data-theme="auto"]{
    color-scheme: dark;
    --ink:#e8edee; --ink2:#a7bcc2; --ink3:#7b9199; --ink4:#546a72;
    --paper:#0c1418; --card:#141f24; --line:#243239; --line2:#1b272c;
    --brand:#2bb3bd; --brand2:#1d8b95; --brand-soft:#123239;
    --live:#ff7051; --live-soft:#3a1c14;
    --good:#43c088; --good-soft:#123024;
    --bad:#f0704f; --bad-soft:#3a1811;
    --gold:#e8ab4d; --gold-soft:#332512;
    --sh:0 1px 1px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    --sh-lift:0 2px 4px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.5);
  }
}
[data-size="l"]{--fs:18.5px}
[data-size="xl"]{--fs:21px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--he);background:var(--paper);color:var(--ink);
  font-size:var(--fs);line-height:1.5;overscroll-behavior-y:none;
  transition:background .25s, color .25s;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-variation-settings:'opsz' 20}
.ipa{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;color:var(--ink3);font-size:.8em;letter-spacing:-.03em;font-weight:400}
.hide{display:none !important}
.spacer{flex:1}

/* ---------- shell ---------- */
#app{max-width:600px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;padding:0 18px calc(var(--bar) + env(safe-area-inset-bottom) + 26px)}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
  display:flex;align-items:center;gap:9px;
  border-bottom:1px solid transparent;transition:border-color .2s
}
.topbar.scrolled{border-bottom-color:var(--line)}
.wordmark{
  font-family:var(--en);font-weight:800;letter-spacing:-.045em;font-size:21px;
  direction:ltr;font-variation-settings:'opsz' 40;line-height:1
}
.wordmark i{font-style:normal;color:var(--brand)}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 10px;
  font-size:12.5px;font-weight:700;white-space:nowrap;font-family:var(--mono)
}
.chip.flame{color:var(--live);border-color:var(--live);background:var(--live-soft)}
.avatar{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  font-size:19px;background:var(--card);border:1px solid var(--line);flex:none
}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);padding:5px 8px calc(env(safe-area-inset-bottom) + 5px);
  transition:transform .15s ease-out
}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;
  border-radius:11px;font-size:11px;font-weight:700;color:var(--ink3);transition:.15s
}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--brand)}
.nav button.on svg{stroke-width:2.2}

/* ---------- typography ---------- */
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 3px;line-height:1.15}
h2{font-size:1.18rem;font-weight:700;margin:0 0 5px;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:.87rem;margin:0;line-height:1.55}
.muted{color:var(--ink3);font-size:.8rem;line-height:1.5}
.sec-title{
  font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink3);
  margin:26px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:9px
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#fff;border-radius:13px;padding:15px 18px;
  font-weight:700;font-size:1rem;width:100%;transition:transform .09s, filter .15s;
  letter-spacing:-.01em
}
.btn:active{transform:scale(.977);filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:active{background:var(--line2)}
.btn.live{background:var(--live)}
.btn.sm{padding:10px 14px;font-size:.87rem;width:auto;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}.row>*{flex:1}

/* ============================================================
   הסולם — עמוד השדרה
   ============================================================ */
.ladder{position:relative;padding-inline-start:26px}
.ladder::before{
  content:'';position:absolute;inset-block:14px;inset-inline-start:12px;width:2px;
  background:linear-gradient(var(--brand) 0 var(--climb,0%), var(--line) var(--climb,0%) 100%)
}
.rung{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:8px;overflow:hidden;transition:.18s
}
.rung::before{
  content:'';position:absolute;inset-inline-start:-20px;top:50%;width:14px;height:2px;background:var(--line)
}
.rung:not(.locked)::before{background:var(--brand)}
.rung:not(.locked):active{transform:scale(.985)}
.rung.locked{opacity:.42}
.rung.cur{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.rung .fillbar{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--brand-soft);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.rung>*{position:relative;z-index:1}
.rung .lv{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-weight:700;font-size:15px;background:var(--paper);
  border:1px solid var(--line);color:var(--ink2)
}
.rung.done .lv{background:var(--good);color:#fff;border-color:var(--good)}
.rung.cur .lv{background:var(--brand);color:#fff;border-color:var(--brand)}
.rung .nm{font-weight:700;font-size:.97rem;line-height:1.25;letter-spacing:-.01em}
.rung .dsc{font-size:.76rem;color:var(--ink3);margin-top:2px;line-height:1.35}
.rung .pct{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:none;font-weight:500}

/* ============================================================
   הסיגנצ'ר: פס הקריאה — מד זמן שליפה עם רצועת סובלנות
   ============================================================ */
.readout{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px 12px;margin-bottom:14px;box-shadow:var(--sh)
}
.readout .hdr{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
.readout .hdr b{color:var(--ink);font-weight:700}
.readout .tag{
  font-family:var(--he);font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;
  background:var(--paper);color:var(--ink2);letter-spacing:0
}
.readout .tag.new{background:var(--brand-soft);color:var(--brand)}
.readout .live{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:12px;min-width:44px;text-align:end}
.band{
  position:relative;height:9px;margin-top:9px;border-radius:3px;direction:ltr;
  background:linear-gradient(90deg,
    var(--good-soft) 0%, var(--good-soft) 45%,
    var(--gold-soft) 45%, var(--gold-soft) 82%,
    var(--bad-soft)  82%, var(--bad-soft) 100%)
}
.needle{
  position:absolute;top:-3px;bottom:-3px;width:2.5px;border-radius:2px;background:var(--good);
  left:0;transition:left .1s linear
}
.needle.mid{background:var(--gold)} .needle.slow{background:var(--bad)}
.readout .ticks{
  display:flex;justify-content:space-between;direction:ltr;font-family:var(--mono);
  font-size:9.5px;color:var(--ink4);margin-top:4px;letter-spacing:-.02em
}

/* ---------- stage ---------- */
.prompt{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:30px 20px;text-align:center;box-shadow:var(--sh);min-height:158px;
  display:flex;flex-direction:column;justify-content:center;gap:9px
}
.prompt .kicker{
  font-size:10.5px;font-weight:800;letter-spacing:.13em;color:var(--brand);
  text-transform:uppercase;margin-bottom:2px
}
.prompt .big{
  font-family:var(--en);font-size:3.1rem;font-weight:700;letter-spacing:-.035em;
  line-height:1.02;direction:ltr;font-variation-settings:'opsz' 72
}
.prompt .big.he{font-family:var(--he);font-size:2rem;direction:rtl;letter-spacing:-.02em;font-weight:700}
.prompt .med{font-family:var(--en);font-size:1.42rem;font-weight:600;direction:ltr;line-height:1.35;font-variation-settings:'opsz' 32}
.prompt .med.he{font-family:var(--he);direction:rtl;font-weight:700}
.prompt .small{font-size:.85rem;color:var(--ink2)}
.prompt .letterpair{display:flex;gap:16px;justify-content:center;align-items:baseline;font-family:var(--en);direction:ltr}
.prompt .letterpair b{font-size:4.4rem;font-weight:800;line-height:.95;font-variation-settings:'opsz' 96;letter-spacing:-.04em}
.prompt .letterpair span{font-size:2.7rem;font-weight:500;color:var(--ink3);line-height:.95}

.opts{display:grid;gap:8px;margin-top:12px}
.opt{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:15px 16px;text-align:start;font-weight:600;font-size:1.03rem;transition:.12s;width:100%
}
.opt:active{transform:scale(.984)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt .hint{display:block;font-size:.76rem;font-weight:400;color:var(--ink3);margin-top:3px}

.answerbox{display:flex;gap:8px;margin-top:12px}
.answerbox input{
  flex:1;padding:16px 15px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--card);font-family:var(--en);direction:ltr;text-align:left;
  font-size:1.15rem;font-weight:600;outline:none;min-width:0
}
.answerbox input::placeholder{color:var(--ink4);font-weight:400}
.answerbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.answerbox input.ok{border-color:var(--good);background:var(--good-soft)}
.answerbox input.no{border-color:var(--bad);background:var(--bad-soft)}

.tiles{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center}
.tile{
  font-family:var(--en);direction:ltr;background:var(--card);border:1.5px solid var(--line);
  border-radius:10px;padding:10px 13px;font-size:1.05rem;font-weight:600;transition:.11s
}
.tile:active{transform:scale(.93)}
.tile.used{opacity:.22;pointer-events:none}
.slot{
  min-height:60px;background:var(--brand-soft);border:1.5px dashed var(--brand);border-radius:12px;
  padding:9px;display:flex;flex-wrap:wrap;gap:7px;direction:ltr;align-items:center;margin-top:12px
}
.slot .tile{background:var(--card);border-color:var(--brand)}
.slot.ok{background:var(--good-soft);border-color:var(--good);border-style:solid}
.slot.no{background:var(--bad-soft);border-color:var(--bad);border-style:solid}
.slot:empty::after{content:'סדרו כאן את המילים';direction:rtl;font-family:var(--he);color:var(--brand);font-size:.83rem;padding:6px;opacity:.75}

.cloze{font-family:var(--en);direction:ltr;font-size:1.4rem;font-weight:600;line-height:1.65}
.cloze u{color:var(--brand);text-decoration:none;border-bottom:2.5px solid var(--brand);padding:0 24px}
.proof{font-family:var(--en);direction:ltr;font-size:1.3rem;font-weight:600;line-height:1.8;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.pw{padding:3px 6px;border-radius:7px;border:1.5px solid transparent;transition:.11s}
.pw.ok{border-color:var(--good);background:var(--good-soft)}
.pw.no{border-color:var(--bad);background:var(--bad-soft)}

.fb{border-radius:var(--r);padding:15px;margin-top:12px;border:1px solid;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .hd{font-weight:800;font-size:.93rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb.ok .hd{color:var(--good)} .fb.no .hd{color:var(--bad)}
.fb .bd{font-size:.87rem;color:var(--ink2);line-height:1.6}
.fb .bd b{color:var(--ink)}

.speakbtn{
  width:60px;height:60px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;margin:0 auto;border:1.5px solid var(--brand);flex:none;transition:.12s
}
.speakbtn:active{transform:scale(.92)}
.speakbtn svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.speakbtn.rec{background:var(--live);color:#fff;border-color:var(--live);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,54,.5)}70%{box-shadow:0 0 0 16px rgba(255,90,54,0)}}

/* ============================================================
   סרגל הפעולה — הפעולה הראשית תמיד מתחת לאגודל
   ============================================================ */
.actionbar{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--card);
  border-top:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 10px);
  transition:transform .15s ease-out
}
.actionbar-in{max-width:600px;margin:0 auto;display:flex;gap:9px;align-items:center}
.actionbar-in>.btn{
  /* חשוב: .btn כולל width:100%. עם flex-basis:auto זה נהיה 100% מרוחב הסרגל
     והכפתור השני נדחף אל מחוץ למסך. אפס בסיס + אפשרות לכיווץ פותר את זה. */
  flex:1 1 0; width:auto; min-width:0; white-space:nowrap;
  padding-inline:12px; font-size:.95rem
}

/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.stat .n{font-family:var(--mono);font-size:1.5rem;font-weight:700;letter-spacing:-.045em;line-height:1.1}
.stat .l{font-size:.72rem;color:var(--ink3);margin-top:4px;font-weight:600;line-height:1.3}
.bars{display:flex;align-items:flex-end;gap:3px;height:76px;margin-top:8px}
.bars>div{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:3px}
.bars>div.hot{background:var(--brand)}
.legend{display:flex;justify-content:space-between;font-size:10px;color:var(--ink4);margin-top:6px;font-family:var(--mono)}
.wordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.wordrow:last-child{border-bottom:0}
.wordrow .w{font-family:var(--en);direction:ltr;font-weight:600;flex:1;min-width:0;font-size:.95rem}
.wordrow .h{color:var(--ink3);font-size:.83rem;flex:1;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--paper);color:var(--ink2);flex:none;font-weight:500}
.progline{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.progline>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}

/* ---------- users ---------- */
.userpick{display:grid;gap:9px}
.usercard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:start;width:100%;transition:.14s}
.usercard:active{transform:scale(.985)}
.usercard.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.usercard .av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--paper);flex:none}
.emojipick{display:flex;flex-wrap:wrap;gap:7px}
.emojipick button{width:44px;height:44px;border-radius:12px;background:var(--paper);border:1.5px solid transparent;font-size:23px}
.emojipick button.on{border-color:var(--brand);background:var(--brand-soft)}
.field{margin-bottom:13px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);outline:none}
.field input:focus,.field select:focus{border-color:var(--brand)}
.seg{display:flex;gap:4px;background:var(--paper);border-radius:11px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:.83rem;font-weight:700;color:var(--ink3);transition:.13s}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(6,14,17,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;backdrop-filter:blur(3px);transition:transform .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:600px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:90dvh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--brand-soft);color:var(--brand)}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.ruleblk{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;font-size:.87rem;line-height:1.65}
.ruleblk .ex{font-family:var(--en);direction:ltr;font-weight:600;margin-top:7px;display:block;font-size:.97rem}
.toast{position:fixed;bottom:calc(var(--bar) + 22px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:11px;font-size:.87rem;font-weight:700;z-index:200;animation:pop .2s;box-shadow:var(--sh-lift)}

/* ---------- מסך נעילה ומקלדת קוד ---------- */
.lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 24px calc(env(safe-area-inset-bottom) + 30px);max-width:600px;margin:0 auto}
.lock .who{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;font-size:38px;
  background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.dots{display:flex;gap:13px;justify-content:center;margin:20px 0 26px;direction:ltr}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line);transition:.15s}
.dots i.on{background:var(--brand);transform:scale(1.15)}
.dots.err i{background:var(--bad)}
.dots.err{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
/* מקלדת המספרים תמיד LTR — כמו כל מקלדת חיוג, גם בתוך ממשק עברי.
   ב-RTL כללי, גריד ממלא מימין לשמאל וההגרלה 1-2-3 הייתה יוצאת הפוכה. */
.keypad{display:grid;direction:ltr;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;max-width:270px}
.keypad button{aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line);
  font-family:var(--mono);font-size:1.45rem;font-weight:700;transition:.1s;display:grid;place-items:center}
.keypad button:active{background:var(--brand-soft);transform:scale(.93)}
.keypad button.blank{background:none;border:0;pointer-events:none}
.keypad button.act{font-family:var(--he);font-size:.85rem;font-weight:700;color:var(--ink3);border:0;background:none}

/* ---------- מתגים ורשימות בקרה ---------- */
.ctrl{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.ctrl:last-of-type{border-bottom:0}
.ctrl .tx{flex:1;min-width:0}
.ctrl .tx b{display:block;font-size:.92rem;font-weight:700}
.ctrl .tx span{font-size:.76rem;color:var(--ink3);line-height:1.45;display:block;margin-top:2px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.18s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--brand)}
.sw.on::after{inset-inline-start:23px}
.stepper{display:flex;align-items:center;gap:9px;flex:none}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-size:1.1rem;font-weight:700;display:grid;place-items:center}
.stepper span{font-family:var(--mono);font-weight:700;min-width:34px;text-align:center;font-size:.95rem}
.task{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r);padding:15px}
.task .lbl{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--brand);text-transform:uppercase}
.goalring{display:flex;align-items:center;gap:12px}
.goalring .ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.goalring circle{fill:none;stroke-width:5;stroke-linecap:round}

/* ---------- הסבר על סוג תרגיל ---------- */
.intro{
  background:var(--card);border:1px solid var(--brand);border-radius:var(--r-lg);
  padding:24px 18px;text-align:center;box-shadow:var(--sh-lift)
}
.intro .ic{font-size:2.6rem;line-height:1;margin-bottom:12px}
.intro h2{color:var(--brand)}
.intro p{font-size:.9rem;color:var(--ink2);line-height:1.65;margin:0}

/* ---------- מסך פתיחה ---------- */
.welcome{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(env(safe-area-inset-bottom) + 32px);max-width:600px;margin:0 auto}
.welcome .mark{font-family:var(--en);font-weight:800;font-size:3.4rem;letter-spacing:-.05em;direction:ltr;line-height:1;font-variation-settings:'opsz' 96}
.welcome .mark i{font-style:normal;color:var(--brand)}
.welcome .tagline{font-size:1.05rem;color:var(--ink2);margin:14px 0 0;line-height:1.6;max-width:32ch}
.steps{margin:30px 0 0;display:grid}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .k{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--brand);padding-top:3px;flex:none;width:22px}
.step b{display:block;font-size:.97rem;margin-bottom:3px}
.step span{font-size:.83rem;color:var(--ink3);line-height:1.55}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
</style>

/* --- SM-2 עם משקל שטף --- */
/* q: 0-5. אנחנו מחשבים אותו משילוב של נכונות + זמן תגובה. */
function grade(correct, ms, target){
  if(!correct) return ms<1500?2:1;          // טעות מהירה = כמעט ידע, טעות איטית = לא יודע
  const r = ms/target;
  if(r<=.6) return 5;                        // שליפה מיידית
  if(r<=1)  return 4;                        // בטווח היעד
  if(r<=1.8)return 3;                        // נכון אבל עם היסוס
  return 3;
}

function review(u, itemId, correct, ms, target){
  const q = grade(correct, ms, target);
  let c = u.srs[itemId] || {ef:2.5, iv:0, rep:0, due:dayNum(), seen:0, ok:0, ms:0};
  c.seen++; if(correct) c.ok++;
  c.ms = c.ms ? Math.round(c.ms*.65 + ms*.35) : ms;   // ממוצע נע של זמן שליפה
  if(q<3){ c.rep=0; c.iv=0; }                        // נפילה — חוזרים לאותו יום
  else{
    c.rep++;
    c.iv = c.rep===1?1 : c.rep===2?3 : Math.round(c.iv*c.ef);
    c.ef = Math.max(1.3, c.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
  }
  c.due = dayNum() + c.iv;
  c.last = dayNum();
  u.srs[itemId] = c;
  return {q, card:c};
}

/* מיומנות פריט: 0-1 */
const strength = c => !c ? 0 : Math.min(1, Math.min(1,c.rep/3)*.55 + (c.ok/Math.max(1,c.seen))*.45);

/* --- מאגר פריטים לפי רמה --- */
function poolFor(lv){
  const p = [];
  if(lv<=1) LETTERS.forEach(x=>p.push({t:'letter', id:'L:'+x.u, d:x, lv:0}));
  if(lv>=1 && lv<=3) PHONICS.forEach(x=>p.push({t:'phonics',id:'P:'+x.w, d:x, lv:1}));
  WORDS.filter(w=>w.lv<=lv).forEach(w=>{
    p.push({t:'w-recog', id:w.id+'#r', d:w, lv:w.lv});
    p.push({t:'w-recall',id:w.id+'#p', d:w, lv:w.lv});
    if(w.core){ if(w.lv<=5) p.push({t:'w-listen',id:w.id+'#l', d:w, lv:w.lv}); return; }
    if(w.lv>=2) p.push({t:'w-listen',id:w.id+'#l', d:w, lv:w.lv});
    if(w.lv>=3) p.push({t:'w-speak', id:w.id+'#s', d:w, lv:w.lv});
  });
  IRREG.filter(v=>v.lv<=lv).forEach(v=>{
    p.push({t:'irr-past', id:'V:'+v.base+'#p', d:v, lv:v.lv});
    p.push({t:'irr-pp',   id:'V:'+v.base+'#3', d:v, lv:v.lv});
  });
  const key = s => s.slice(0,28);
  SENTS.filter(s=>s.lv<=lv).forEach(s=>{
    p.push({t:'build',  id:'S:'+key(s.en)+'#b', d:s, lv:s.lv});
    p.push({t:'dictate',id:'S:'+key(s.en)+'#d', d:s, lv:s.lv});
  });
  CLOZE.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'cloze', id:'C:'+key(c.s), d:c, lv:c.lv}));
  PROOF.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'proof', id:'F:'+key(c.s), d:c, lv:c.lv}));
  GRAMMAR.filter(g=>g.lv<=lv).forEach(g=>p.push({t:'rule', id:'G:'+key(g.ti), d:g, lv:g.lv}));
  TALK.filter(t=>t.lv<=lv).forEach(t=>p.push({t:'talk', id:'T:'+key(t.q), d:t, lv:t.lv}));
  MINPAIRS.filter(m=>m.lv<=lv).forEach(m=>{
    p.push({t:'mp-hear', id:'M:'+m.a+'-'+m.b+'#h', d:m, lv:m.lv});
    if(lv>=3) p.push({t:'mp-say', id:'M:'+m.a+'-'+m.b+'#s', d:m, lv:m.lv});
  });
  CONTRACT.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'contract', id:'K:'+key(c.full), d:c, lv:c.lv}));
  SPOKEN.filter(s=>s.lv<=lv).forEach(s=>p.push({t:'spoken', id:'R:'+s.sp, d:s, lv:s.lv}));
  return p;
}

/* יעד זמן שליפה לפי סוג התרגיל (מילישניות) */
const TARGET = {letter:2500,phonics:3500,'w-recog':3000,'w-recall':5000,'w-listen':6000,
                'w-speak':6000,build:15000,dictate:14000,cloze:6000,proof:9000,rule:8000,talk:20000,
                'mp-hear':4000,'mp-say':7000,contract:5000,spoken:6000,'irr-past':5000,'irr-pp':5000};

/* --- בניית סשן: חזרות שנדרשות קודם, ואז חומר חדש, בשילוב מסוגים שונים --- */
function buildSession(u, size, mode){
  const pool = poolFor(u.lv);
  const d = dayNum();
  let due=[], fresh=[], weak=[];
  pool.forEach(it=>{
    const c=u.srs[it.id];
    if(!c) fresh.push(it);
    else if(c.due<=d) (strength(c)<.35?weak:due).push(it);
  });
  // מילוי: אם אין מספיק פריטים שהגיע זמנם, מקדימים את החלשים ביותר
  const fill = (list, sub) => {
    if(list.length>=size) return list.slice(0,size);
    const extra = shuffle(sub.filter(x=>!list.includes(x)))
      .sort((a,b)=>strength(u.srs[a.id])-strength(u.srs[b.id]));
    return [...list, ...extra].slice(0,size);
  };

  if(mode==='weak'){
    const s=[...weak,...due].sort((a,b)=>strength(u.srs[a.id])-strength(u.srs[b.id]));
    return interleave(fill(s, pool));
  }
  if(mode==='irregular'){
    const v=pool.filter(x=>x.t==='irr-past'||x.t==='irr-pp');
    return v.length? interleave(shuffle(v).slice(0,size)) : buildSession(u,size,'mix');
  }
  if(mode==='sound'){
    const s=pool.filter(x=>['mp-hear','mp-say','spoken','phonics','w-listen','w-speak','dictate'].includes(x.t));
    return s.length? interleave(capTypes(shuffle(s),size)) : buildSession(u,size,'mix');
  }
  if(mode==='talk'){
    const t=pool.filter(x=>x.t==='talk');
    return t.length? shuffle(t).slice(0,size) : buildSession(u,size,'mix');
  }
  if(mode==='rules'){
    const g=pool.filter(x=>['rule','cloze','proof','build','contract'].includes(x.t));
    return g.length? interleave(capTypes(shuffle(g),size)) : buildSession(u,size,'mix');
  }

  shuffle(due); shuffle(fresh); shuffle(weak);
  // מיקס: ~40% חלשים, ~40% לחזרה, ~30% חדש — ומה שחסר מושלם מהמאגר
  const want = [...weak.slice(0,Math.ceil(size*.4)), ...due.slice(0,Math.ceil(size*.4)), ...fresh.slice(0,Math.ceil(size*.3))];
  const rest = shuffle([...fresh, ...due, ...weak]).filter(x=>!want.includes(x));
  return interleave(capTypes([...want, ...rest, ...shuffle(pool)], size));

/* אף סוג תרגיל לא תופס יותר מ־35% מהסשן — כדי שלא ייצא סשן של מילים בלבד */
}
function capTypes(cands, size){
  const cap=Math.max(2,Math.ceil(size*.35)), cnt={}, out=[], seen=new Set();
  for(const x of cands){
    if(out.length>=size) break;
    if(seen.has(x.id)) continue;
    if((cnt[x.t]||0)>=cap) continue;
    cnt[x.t]=(cnt[x.t]||0)+1; seen.add(x.id); out.push(x);
  }
  for(const x of cands){ if(out.length>=size) break; if(seen.has(x.id)) continue; seen.add(x.id); out.push(x); }
  return out;
}

/* שזירה — לא שני תרגילים מאותו סוג ברצף (Interleaving) */
function interleave(arr){
  const out=[]; const rem=[...arr];
  while(rem.length){
    let i = rem.findIndex(x=>!out.length || x.t!==out[out.length-1].t);
    if(i<0) i=0;
    out.push(rem.splice(i,1)[0]);
  }
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n,not){ return shuffle(arr.filter(x=>x!==not)).slice(0,n); }

/* מסיחים ייחודיים: אף אפשרות לא תוצג עם אותו טקסט כמו התשובה הנכונה,
   ואף שתי אפשרויות לא יהיו זהות זו לזו. בלי זה, שתי מילים שחולקות תרגום
   (boy/child = "ילד") יוצרות שאלה שאי אפשר לענות עליה נכון.            */
function distractors(pool, correct, textOf, n){
  const seen=new Set([textOf(correct)]), out=[];
  for(const x of shuffle([...pool])){
    if(x===correct) continue;
    const t=textOf(x);
    if(!t || seen.has(t)) continue;
    seen.add(t); out.push(x);
    if(out.length>=n) break;
  }
  return out;
}

/* --- שליטה ברמה --- */
function levelPct(u, lv){
  const all = poolFor(lv);
  const own = all.filter(x=>x.lv===lv);
  const set = own.length?own:all;
  if(!set.length) return 0;
  const s = set.reduce((a,x)=>a+strength(u.srs[x.id]),0);
  return Math.round(100*s/set.length);
}
function checkPromote(u){
  const pct = levelPct(u, u.lv);
  u.mastered[u.lv]=pct;
  if(pct>=LEVELS[u.lv].need && u.lv<LEVELS.length-1){ u.lv++; return true; }
  return false;
}

/* --- רצף ימים ולוג --- */
function touchDay(u, correct, ms){
  const t=today();
  if(u.lastDay!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    u.streak = (u.lastDay===y)?u.streak+1:1;
    u.lastDay=t;
  }
  let e = u.log.find(x=>x.d===t);
  if(!e){ e={d:t,n:0,ok:0,ms:0}; u.log.push(e); if(u.log.length>400) u.log.shift(); }
  e.n++; if(correct) e.ok++; e.ms = Math.round((e.ms*(e.n-1)+ms)/e.n);
}

/* --- ניתוח לדשבורד --- */
function analyse(u){
  const items = Object.entries(u.srs);
  const known = items.filter(([,c])=>strength(c)>=.7).length;
  const learning = items.filter(([,c])=>strength(c)>0 && strength(c)<.7).length;
  const accAll = items.reduce((a,[,c])=>a+c.ok,0) / Math.max(1, items.reduce((a,[,c])=>a+c.seen,0));
  const msArr = items.filter(([,c])=>c.ms).map(([,c])=>c.ms);
  const avgMs = msArr.length? Math.round(msArr.reduce((a,b)=>a+b,0)/msArr.length) : 0;
  const wordCards = items.filter(([k])=>k.startsWith('w:'));
  const vocab = new Set(wordCards.filter(([,c])=>strength(c)>=.7).map(([k])=>k.split('#')[0])).size;
  // נקודות חולשה לפי סוג תרגיל
  const byType={};
  poolFor(u.lv).forEach(it=>{ const c=u.srs[it.id]; if(!c)return;
    byType[it.t]=byType[it.t]||{ok:0,n:0}; byType[it.t].ok+=c.ok; byType[it.t].n+=c.seen; });
  const weakTypes = Object.entries(byType).filter(([,v])=>v.n>=4)
      .map(([t,v])=>({t, acc:v.ok/v.n})).sort((a,b)=>a.acc-b.acc).slice(0,3);
  // מילים בעייתיות
  const weakWords = items.filter(([k,c])=>k.startsWith('w:') && c.seen>=2 && strength(c)<.45)
      .map(([k,c])=>({w:k.split(':')[1].split('#')[0], c}))
      .sort((a,b)=>strength(a.c)-strength(b.c)).slice(0,12);
  const dueNow = poolFor(u.lv).filter(it=>{const c=u.srs[it.id];return c&&c.due<=dayNum()}).length;
  return {known, learning, accAll, avgMs, vocab, weakTypes, weakWords, dueNow, total:items.length};
}

 proof:'הגהה',rule:'חוקי דקדוק',talk:'שיחה','mp-hear':'אבחנת צלילים','mp-say':'הגייה מדויקת',

/* --- דיבור --- */
/* דירוג קולות: הדפדפן מחזיר גם קולות דחוסים ("compact") שנשמעים מתכתיים.
   אנחנו מדרגים ובוחרים את הטבעי ביותר שזמין במכשיר.                      */
let VOICES=[], WARM=false;

/* סדר העדפה שמי. Ava היא הקול הטבעי ביותר של Apple לאנגלית אמריקאית,
   ולכן היא ראשונה. iOS לא תמיד מוסיף את הסיומת (Premium) לשם, ולכן
   ההתאמה נעשית לפי השם עצמו ולא רק לפי המילה "premium".               */
const PREF_NAMES = ['ava','allison','samantha','zoe','susan','evan','nathan',
                    'joelle','tom','aria','jenny','sonia','libby','emma'];
const JUNK = /compact|eloquence|espeak|pico|novelty|whisper|zarvox|albert|bad news|bells|organ|cellos|trinoids|boing|bubbles|jester|superstar|wobble|bahh/;

function voiceScore(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase();
  let s=0;
  if(/premium/.test(n))                 s+=70;
  if(/enhanced|neural|natural/.test(n)) s+=55;
  if(/siri/.test(n))                    s+=45;
  if(/google/.test(n))                  s+=35;
  const pi = PREF_NAMES.findIndex(p=>new RegExp('\\b'+p+'\\b').test(n));
  if(pi>=0) s += 60 - pi*4;
  if(JUNK.test(n))                      s-=90;
  if(l.startsWith('en-us')) s+=12; else if(l.startsWith('en-gb')) s+=8;
  if(v.localService===false) s+=6;
  if(v.default)              s+=3;
  return s;
}
const voiceTier = v => { const s=voiceScore(v); return s>=110?'premium' : s>=55?'good' : s<0?'junk' : 'plain'; };

/* iOS לפעמים מחזיר רשימה ריקה או חלקית עד שהקולות נטענים. מנסים שוב. */
let voiceTries=0;
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  if(!VOICES.length && voiceTries++ < 14) setTimeout(loadVoices, 400);
}
function pickVoice(){
  const want = me()&&me().settings ? me().settings.voice : null;
  if(want){
    const exact = VOICES.find(v=>v.name===want);
    if(exact) return exact;
    /* אם המערכת שינתה את שם הקול (למשל Ava (Premium) → Ava), מתאימים לפי השם הפרטי */
    const tok = want.toLowerCase().split(/[\s(]/)[0];
    const nearby = VOICES.find(v=>v.name.toLowerCase().startsWith(tok));
    if(nearby) return nearby;
  }
  return VOICES[0] || null;
}
const findAva = () => VOICES.find(v=>/\bava\b/i.test(v.name));

if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }

/* iOS/Safari חוסמים דיבור עד למגע ראשון. משחררים בשקט. */
function warmUp(){
  if(WARM || !window.speechSynthesis) return;
  WARM=true;
  try{ const w=new SpeechSynthesisUtterance(' '); w.volume=0; speechSynthesis.speak(w); }catch(e){}
  if(!VOICES.length) loadVoices();
}
addEventListener('touchstart', warmUp, {once:true, passive:true});
addEventListener('mousedown',  warmUp, {once:true});

function say(text, rate){
  if(!window.speechSynthesis || !text) return false;
  try{
    warmUp();
    speechSynthesis.cancel();
    const s=me()?.settings||{};
    const u2=new SpeechSynthesisUtterance(String(text));
    const v=pickVoice();
    if(v){ u2.voice=v; u2.lang=v.lang; } else u2.lang='en-US';
    u2.rate  = rate || s.speed || .95;
    u2.pitch = s.pitch != null ? s.pitch : 1;
    u2.volume= 1;
    speechSynthesis.speak(u2);
    return true;
  }catch(e){ return false; }
}

/* --- קודי כניסה ובקרת הורים --- */
/* חשוב: זה שער, לא מנעול. הכול רץ בדפדפן, ומי שיודע לפתוח כלי מפתחים
   יעקוף את זה. המטרה היא למנוע מאח קטן להיכנס לפרופיל של אחיו או לקפוץ רמה,
   לא להגן מפני תוקף.                                                        */
const hashCode = s => { let h=5381; for(const c of String(s)) h=(((h*33)^c.charCodeAt(0))>>>0); return h.toString(36); };
const codeOk   = (u,c) => !!u.code && u.code===hashCode(c);
const parents  = () => USERS.filter(u=>u.role==='parent' && u.code);

/* ספירת פריטים שנעשו היום — לצורך יעד ומגבלה */
function doneToday(u){ const e=u.log.find(x=>x.d===today()); return e?e.n:0; }
function capLeft(u){ return u.ctrl.cap ? Math.max(0, u.ctrl.cap - doneToday(u)) : Infinity; }
function modeAllowed(u,m){ return !u.ctrl.modes || u.ctrl.modes.includes(m); }

/* --- זיהוי דיבור --- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(onResult, onEnd){
  if(!SR) return null;
  const r=new SR();
  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
  r.onresult=e=>{ onResult([...e.results[0]].map(a=>a.transcript)); };
  r.onerror=()=>onEnd&&onEnd();
  r.onend =()=>onEnd&&onEnd();
  try{ r.start(); }catch(e){ return null; }
  return r;
}

/* --- השוואת טקסט סלחנית --- */
/* iOS ממיר גרש ישר לגרש מסולסל, מקף למקף ארוך ורווח לרווח לא שובר.
   בלי הנרמול הזה תשובה שנראית זהה לחלוטין נדחית.                      */
const norm = s => (s||'')
  .replace(/[\u2018\u2019\u02BC\u00B4]/g,"'")
  .replace(/[\u201C\u201D]/g,'"')
  .replace(/[\u2010-\u2015]/g,'-')
  .replace(/[\u00A0\u202F\u2007]/g,' ')
  .toLowerCase()
  .replace(/[.,!?;:'"()\-]/g,'')
  .replace(/\s+/g,' ').trim();
function near(a,b){
  /* בלי שום סובלנות לטעויות — התאמה מדויקת בלבד, אחרי נורמליזציה.
     norm() רק מנטרל הבדלים טכניים שהם לא באמת טעות: אותיות גדולות/קטנות,
     גרשיים חכמים של iOS, מקף ארוך, רווח לא שובר, רווחים כפולים, וסימני
     פיסוק בסוף. כל הבדל אחר במילה — נדחה.                              */
  return norm(a)===norm(b) && !!norm(a);
}

/* ---------- ערכת נושא וגודל טקסט ----------
   שני חלקים: (1) data-theme על ה-html, שה-CSS מגיב אליו — כולל
   [data-theme="auto"] שמאזין ל-prefers-color-scheme של עצמו.
   (2) meta[theme-color], שצובעת את שורת הסטטוס/הכרום של הדפדפן.
   הדפדפן לא מעדכן את השורה הזו לבד — היא נשארת קבועה עד שמישהו
   כותב לה ערך חדש, ולכן צריך לחשב את הצבע הנכון בכל קריאה.        */
const PAPER = { light:'#eceeed', dark:'#0c1418' };
const sysDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

function applyTheme(){
  const s = me()?.settings || {};
  const mode = s.theme || 'auto';
  document.documentElement.dataset.theme = mode;
  document.documentElement.dataset.size  = s.size || 'm';
  const effective = mode==='dark' ? 'dark' : mode==='light' ? 'light' : (sysDark()?'dark':'light');
  const meta=document.querySelector('#themeColorMeta');
  if(meta) meta.setAttribute('content', PAPER[effective]);
}
/* אם ההגדרה היא "לפי המכשיר" והמכשיר עצמו עובר בין בהיר לכהה
   (למשל Night Shift מתוזמן) בזמן שהאפליקציה פתוחה — ה-CSS כבר
   מגיב לבד, אבל שורת הסטטוס לא; מאזין הזה מסנכרן אותה. */
if(window.matchMedia){
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if((me()?.settings?.theme||'auto')==='auto') applyTheme();
  });
}

/* ---------- תיקון מקלדת ל-iOS: position:fixed מול המקלדת ----------
   ספארי ב-iOS ממקם position:fixed:bottom ביחס לגובה המלא של הדף,
   כאילו אין מקלדת פתוחה — כך שסרגל תחתון קבוע עלול להיעלם מתחתיה,
   באופן לא עקבי (תלוי גלילה, תלוי מסך). VisualViewport מדווח את
   הגובה שבאמת נראה למשתמש; מזיזים את האלמנטים הקבועים בדיוק בכמות
   שהמקלדת מכסה, כדי שיישארו צמודים מעל המקלדת תמיד.                */
function pinFixedBars(){
  if(!window.visualViewport) return;
  const vv=window.visualViewport;
  const update=()=>{
    const covered=Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    const shift=covered>1 ? `translateY(-${covered}px)` : '';
    const ab=document.querySelector('#actionbar'); if(ab) ab.style.transform=shift;
    const nv=document.querySelector('#nav'); if(nv) nv.style.transform=shift;
    const sb=document.querySelector('.sheet-bg'); if(sb) sb.style.transform=shift;
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  update();
}

function addUser(asParent){
  let em=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  sheet(`<h2>${asParent?'פרופיל הורה או מורה':'לומד חדש'}</h2>
    <div class="field"><label>שם</label><input id="nm" placeholder="${asParent?'למשל: אבא':'למשל: יעל'}"></div>
    <div class="field"><label>תפקיד</label><div class="seg" id="rl">
      <button data-v="learner" class="${asParent?'':'on'}">לומד</button>
      <button data-v="parent" class="${asParent?'on':''}">הורה או מורה</button></div></div>
    <div class="field"><label>אווטאר</label><div class="emojipick" id="ep"></div></div>
    <div class="field"><label>גודל טקסט</label><div class="seg" id="sz">
      <button data-v="m" class="on">רגיל</button><button data-v="l">גדול</button><button data-v="xl">ענק</button></div></div>
    <div class="field"><label>רמת פתיחה</label><select id="lv">${LEVELS.map(l=>`<option value="${l.id}">${l.id} · ${l.nm}</option>`).join('')}</select>
      <p class="muted" style="margin-top:6px">לא בטוחים? התחילו מ‑0. אפשר לשנות בכל רגע.</p></div>
    <div class="ctrl" style="border:0"><div class="tx"><b>קוד כניסה</b>
      <span>ארבע ספרות. נדרש בכניסה לפרופיל ולפתיחת בקרת ההורים.</span></div>
      <button class="sw ${asParent?'on':''}" id="wantcode"></button></div>
    <button class="btn" id="ok">יצירה</button>`, sh=>{
    const ep=sh.querySelector('#ep');
    EMOJIS.forEach(e=>{const b=el(`<button class="${e===em?'on':''}">${e}</button>`);
      b.onclick=()=>{ep.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');em=e;};ep.appendChild(b);});
    let role = asParent?'parent':'learner', wantCode = !!asParent;
    sh.querySelectorAll('#rl button').forEach(b=>b.onclick=()=>{
      sh.querySelectorAll('#rl button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); role=b.dataset.v; });
    sh.querySelector('#wantcode').onclick=function(){ wantCode=!wantCode; this.classList.toggle('on',wantCode); };
    let size='m';
    sh.querySelectorAll('#sz button').forEach(b=>b.onclick=()=>{
      sh.querySelectorAll('#sz button').forEach(x=>x.classList.remove('on'));b.classList.add('on');size=b.dataset.v;
      document.documentElement.dataset.size=size; });
    sh.querySelector('#ok').onclick=()=>{
      const n=sh.querySelector('#nm').value.trim(); if(!n){toast('צריך שם');return;}
      const u=newUser(n,em,role,+sh.querySelector('#lv').value);
      u.settings.size=size; saveUsers();
      CUR=u.id; UNLOCKED[u.id]=1; Store.set(K_CUR,CUR); closeSheet(); TAB='home';
      $('#screen').style.padding=''; $('#topbar').classList.remove('hide');
      if(wantCode) setCode(u); else render();
    };
  });
}

function goalCard(u){
  if(!u.ctrl.daily) return '';
  const dn=doneToday(u), p=Math.min(1, dn/u.ctrl.daily), C=2*Math.PI*20;
  return `<div class="card" style="margin-top:14px"><div class="goalring">
    <svg class="ring" viewBox="0 0 46 46">
      <circle cx="23" cy="23" r="20" stroke="var(--line)"/>
      <circle cx="23" cy="23" r="20" stroke="var(--${p>=1?'good':'brand'})" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/>
    </svg>
    <div style="flex:1;min-width:0"><b>${p>=1?'היעד היומי הושלם':'היעד היומי'}</b>
      <div class="muted">${dn} מתוך ${u.ctrl.daily} פריטים${u.ctrl.cap?` · מגבלה: ${u.ctrl.cap}`:''}</div></div>
  </div></div>`;
}
function taskCard(u){
  if(!u.task || u.task.done) return '';
  const t=u.task, p=Math.min(100,(t.prog/t.size)*100);
  return `<div class="card" style="margin-top:14px;padding:0;border:0;box-shadow:none"><div class="task">
    <div class="lbl">משימה</div>
    <b style="display:block;margin-top:2px">${esc(t.note||t.label)}</b>
    <div class="sub" style="margin-top:2px">${t.prog}/${t.size} פריטים · ${esc(t.label)}</div>
    <div class="progline" style="margin-top:9px"><i style="width:${p}%"></i></div>
    <button class="btn sm" style="width:100%;margin-top:11px" onclick="startSession('${t.mode}',${Math.max(4,t.size-t.prog)},null,1)">המשך המשימה</button>
  </div></div>`;
}

/* ---------- הסשן ---------- */
function startSession(mode, size, lv, fromTask){
  const u=me(), oldLv=u.lv;
  if(!fromTask && !modeAllowed(u,mode)) return toast('המצב הזה נעול על ידי ההורה');
  const left=capLeft(u);
  if(left<=0) return sheet(`<h2>הגעת למגבלה היומית</h2>
    <p class="sub">נקבעה מגבלה של ${u.ctrl.cap} פריטים ליום, וסיימת אותם. התרגול ייפתח שוב מחר.</p>
    <button class="btn" style="margin-top:16px" onclick="closeSheet()">הבנתי</button>`);
  size=Math.min(size,left);
  if(lv!=null) u.lv=lv;
  const items=buildSession(u,size,mode);
  u.lv=oldLv;
  if(!items.length){ toast('אין פריטים זמינים'); return; }
  S={items,i:0,ok:0,msSum:0,mode,size,answered:false,t0:0,hardIds:[],finished:false};
  TAB='practice'; render();
}

function drawQ(s){
  const u=me(), it=S.items[S.i];
  if(!it) return drawDone(s);
  if(!u.seenTypes[it.t]) return showIntro(s, it);

  const target=TARGET[it.t]||6000;
  const card=u.srs[it.id];
  const isNew=!card;
  S.reveal=null; S.primary=null; S.answered=false;

  s.innerHTML=`<div style="padding-top:calc(env(safe-area-inset-top) + 10px)">
    <div class="readout">
      <div class="hdr">
        <button id="quit" aria-label="יציאה" style="color:var(--ink3);display:grid;place-items:center">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round">${ICONS.x}</svg></button>
        <b>${String(S.i+1).padStart(2,'0')}</b>/${String(S.items.length).padStart(2,'0')}
        <span class="tag ${isNew?'new':''}">${isNew?'חדש':'חזרה'}</span>
        <span class="tag">${TYPE_HE[it.t]||it.t}</span>
        <span class="spacer"></span><span class="live" id="fv">0.0s</span>
      </div>
      <div class="band"><div class="needle" id="ndl"></div></div>
      <div class="ticks"><span>0s</span><span>${(target/1000).toFixed(0)}s · יעד</span><span>${(target*2.2/1000).toFixed(0)}s</span></div>
    </div>
    <div id="q"></div></div>`;
  $('#quit').onclick=()=>askQuit(()=>{ S=null; TAB='home'; render(); });

  S.t0=performance.now();
  clearInterval(TICK);
  TICK=setInterval(()=>{
    if(!S||S.answered) return;
    const ms=performance.now()-S.t0, r=ms/target;
    const n=$('#ndl'); if(!n) return clearInterval(TICK);
    n.style.left=Math.min(100, ms/(target*2.2)*100)+'%';
    n.className='needle '+(r<1?'':r<1.8?'mid':'slow');
    $('#fv').textContent=(ms/1000).toFixed(1)+'s';
  },100);

  RENDER[it.t]($('#q'), it, u, target);
  buildBar();
}

function buildBar(){
  const p=S.primary;
  const dk = S.reveal ? `<button class="btn ghost" id="dk" ${p?'':'style="flex:1"'}>לא יודע</button>` : '';
  setAction(dk + (p?`<button class="btn" id="pri">${esc(p.label)}</button>`:''));
  if($('#dk')) $('#dk').onclick=()=>S.reveal&&S.reveal();
  if($('#pri')) $('#pri').onclick=()=>p.fn();
}

/* סיום שאלה */
function answer(it, correct, target, extraHtml){
  if(S.answered) return; S.answered=true; clearInterval(TICK);
  const u=me(), ms=Math.round(performance.now()-S.t0);
  const {q}=review(u,it.id,correct,ms,target);
  touchDay(u,correct,ms); u.xp += correct?(q>=5?12:q>=4?9:6):2;
  if(u.task && !u.task.done){ u.task.prog=(u.task.prog||0)+1;
    if(u.task.prog>=u.task.size) u.task.done=1; }
  if(correct) S.ok++; else S.hardIds.push(it.id);
  S.msSum+=ms; saveUsers();
  const n=$('#ndl'); if(n) n.style.left=Math.min(100, ms/(target*2.2)*100)+'%';
  const fast = correct && ms<=target*.6;
  $('#q').appendChild(el(`<div class="fb ${correct?'ok':'no'}">
    <div class="hd">${correct?(fast?'שליפה מיידית':'נכון'):'לא מדויק'}<span class="spacer"></span><span class="badge">${(ms/1000).toFixed(1)}s</span></div>
    <div class="bd">${extraHtml||''}</div></div>`));
  const last = S.i+1>=S.items.length;
  setAction(`<button class="btn" id="nx">${last?'סיום הסשן':'הבא'}</button>`);
  $('#nx').onclick=next;
  $('#q').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){ S.i++; render(); }
addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!S||TAB!=='practice') return;
  if(S.answered){ e.preventDefault(); next(); }
});

/* ---------- סיום ---------- */
function drawDone(s){
  const u=me(), n=S.items.length, acc=Math.round(S.ok/n*100), avg=(S.msSum/n/1000).toFixed(1);
  const promoted=checkPromote(u); saveUsers();
  const note = avg<3.5?'שליפה מהירה. זה בדיוק מה שמונע גמגום בדיבור.'
    : avg<6?'קצב סביר. כדאי לחתור לשליפה מתחת לשלוש שניות.'
    : 'השליפה עדיין איטית. סשנים קצרים ויומיים עובדים טוב יותר מארוכים ונדירים.';
  s.innerHTML=`<div style="padding-top:calc(env(safe-area-inset-top) + 18px)">
    <h1>${acc>=80?'סשן מצוין':'סיימת'}</h1><p class="sub">${note}</p>
    <div class="grid3" style="margin-top:16px">
      <div class="stat"><div class="n">${acc}<span style="font-size:.6em">%</span></div><div class="l">דיוק</div></div>
      <div class="stat"><div class="n">${avg}<span style="font-size:.6em">s</span></div><div class="l">זמן ממוצע</div></div>
      <div class="stat"><div class="n">${S.ok}/${n}</div><div class="l">נכונות</div></div>
    </div>
    ${u.task&&u.task.done===1?`<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)">
      <b>המשימה הושלמה</b><div class="sub" style="margin-top:3px">${esc(u.task.note||u.task.label)}</div></div>`:''}
    ${promoted?`<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)">
      <b>עלית לרמה ${u.lv} · ${LEVELS[u.lv].nm}</b><div class="sub" style="margin-top:3px">${LEVELS[u.lv].dsc}</div></div>`:''}
    ${S.hardIds.length?`<div class="sec-title">לחזרה קרובה</div><div class="card">${
      S.items.filter(x=>S.hardIds.includes(x.id)).map(x=>{
        const lbl = x.t.startsWith('w-')?`${x.d.en} — ${x.d.he}` : x.t==='rule'?x.d.ti
          : (x.d.en||x.d.s||x.d.q||x.d.w||x.d.u||x.d.full||x.d.sp||(x.d.a?x.d.a+' / '+x.d.b:'')||'');
        return `<div class="wordrow"><span class="dot" style="background:var(--bad)"></span>
          <span class="w">${esc(lbl)}</span><span class="badge">${TYPE_HE[x.t]}</span></div>`;
      }).join('')}</div>`:''}</div>`;
  if(u.task && u.task.done===1){ u.task.done=2; saveUsers(); }
  cloudSoon();
  S.finished=true;
  const m=S.mode, sz=S.size;
  setAction(`<button class="btn ghost" id="hm">בית</button><button class="btn" id="ag">עוד סשן</button>`);
  $('#hm').onclick=()=>{ S=null; go('home'); };
  $('#ag').onclick=()=>{ S=null; startSession(m,sz); };
}

  const chosen=[];

  const paint=()=>{ $('#slot').innerHTML=chosen.map(c=>`<span class="tile">${esc(c.w)}</span>`).join(''); };
  $('#undo').onclick=()=>{ const c=chosen.pop(); if(c)c.b.classList.remove('used'); paint(); };
  const chk=()=>{
    const ans=chosen.map(c=>c.w).join(' '); const ok=near(ans,d.en.replace(/\.$/,''));
    $('#slot').classList.add(ok?'ok':'no'); say(d.en);

  const d=it.d;
  q.innerHTML=`<div class="prompt"><div class="kicker">שיחה</div>

    answer(it,good,tg,`${txt?`<span class="muted">התשובה שלכם: </span><span class="en">${esc(txt)}</span><br>`:''}
      <span class="muted">תשובת מודל: </span><b class="en">${esc(d.ans)}</b>

  };
  $('#in').onkeydown=e=>{if(e.key==='Enter')finish(e.target.value.trim())};
  S.primary={label:'שליחה',fn:()=>finish($('#in').value.trim())};
  S.reveal=()=>answer(it,false,tg,
    `<span class="muted">תשובת מודל: </span><b class="en">${esc(d.ans)}</b><br><span class="muted">קראו אותה בקול פעמיים.</span>`);

           ()=>{ m.classList.remove('rec'); if(!S.answered)$('#st').textContent='לא נקלט. נסו שוב או כתבו.'; });
  };

/* ---------------- זוגות מינימליים: הגייה ---------------- */
RENDER['mp-say']=(q,it,u,tg)=>{
  const d=it.d, tgt = Math.random()<.5 ? d.a : d.b;
  const twin = tgt===d.a ? d.b : d.a;
  const ipaT = tgt===d.a ? d.ipaA : d.ipaB, heT = tgt===d.a ? d.heA : d.heB;
  q.innerHTML=`<div class="prompt"><div class="kicker">הגייה מדויקת</div>
    <div class="med">${tgt}</div><div class="ipa">/${ipaT}/</div><div class="small">${heT}</div>
    <div class="muted" style="font-size:12.5px">ולא <span class="en">${twin}</span></div>
    <button class="btn ghost sm" style="margin:0 auto" onclick="say('${jq(tgt)}',.7)">שמיעת דוגמה</button></div>
    <div class="ruleblk" style="margin-top:12px"><b>${esc(d.contrast)}</b><br>${esc(d.tip)}</div>
    <div style="text-align:center;margin-top:14px"><button class="speakbtn" id="mic">${svg('mic')}</button>
      <p class="muted" id="st" style="margin-top:8px">${(SR&&u.ctrl.mic)?'לחצו והגו את המילה':'זיהוי דיבור לא נתמך כאן'}</p></div>
`;
  say(tgt,.75);
  S.primary={label:'תרגלתי',fn:()=>answer(it,true,tg,`<b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span><br>${esc(d.tip)}`)};
  S.reveal=()=>{ say(tgt,.65); answer(it,false,tg,
    `<b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span> — ${heT}<br><b>${esc(d.contrast)}</b> — ${esc(d.tip)}`); };
  $('#mic').onclick=()=>{
    if(!SR||!u.ctrl.mic) return toast(u.ctrl.mic?'אין תמיכה בזיהוי דיבור':'המיקרופון כבוי בהגדרות ההורים');
    const m=$('#mic'); m.classList.add('rec'); $('#st').textContent='מקשיב…';
    listen(alts=>{
      m.classList.remove('rec');
      const hitT = alts.some(a=>near(a,tgt));
      const hitW = !hitT && alts.some(a=>near(a,twin));
      answer(it,hitT,tg, hitT
        ? `מדויק: <b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span>`
        : hitW
          ? `נשמע כמו <b class="en">${twin}</b>, לא <b class="en">${tgt}</b>.<br><b>${esc(d.contrast)}</b> — ${esc(d.tip)}`
          : `שמעתי: <b class="en">${esc(alts[0]||'—')}</b><br>המטרה: <b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span><br>${esc(d.tip)}`);
    },()=>{ m.classList.remove('rec'); if(!S.answered)$('#st').textContent='לא נקלט. נסו שוב או המשיכו.'; });
  };
};

/* ---------------- פעלים חריגים ---------------- */
function irrRender(q,it,u,tg,which){
  const d=it.d;
  const want = which==='past' ? d.past : d.pp;
  const label= which==='past' ? 'צורת העבר' : 'הצורה השלישית';
  const help = which==='past' ? 'Past Simple — "אתמול הוא ___"' : 'Past Participle — הצורה שאחרי have / has / was';
  q.innerHTML=`<div class="prompt"><div class="kicker">פועל חריג · ${label}</div>
    <div class="big">${d.base}</div><div class="ipa">/${d.ipa}/</div>
    <div class="small">${d.he}</div>
    <div class="muted" style="font-size:.78rem">${help}</div></div>
    <div class="answerbox"><input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${which==='past'?'past':'participle'}"></div>`;
  const inp=$('#in'); focusInput(inp);
  const table = `<b class="en">${d.base} · ${d.past} · ${d.pp}</b><br>${esc(d.he)}
    <br><span class="muted">תבנית: ${esc(IRR_GROUPS[d.grp]||'')}</span>`;
  const done=ok=>{ inp.classList.add(ok?'ok':'no'); say(`${d.base}, ${d.past}, ${d.pp}`,.8);
    answer(it,ok,tg,table); };
  /* התאמה מדויקת בלבד — לא near(). זו בדיוק התכלית של התרגיל: להבחין
     בין spoke ל‑spoken, בין became ל‑become. סובלנות לטעות הקלדה הייתה
     סותרת את המטרה ומקבלת בטעות צורה לא נכונה של אותו פועל.            */
  const chk=()=>done(want.split(' / ').some(x=>norm(inp.value)===norm(x)));
  inp.onkeydown=e=>{if(e.key==='Enter')chk()};
  S.primary={label:'בדיקה',fn:chk};
  S.reveal=()=>done(false);
}
RENDER['irr-past']=(q,it,u,tg)=>irrRender(q,it,u,tg,'past');
RENDER['irr-pp']  =(q,it,u,tg)=>irrRender(q,it,u,tg,'pp');

let UNLOCKED = {};   // מי כבר הזין קוד בהפעלה הנוכחית של האפליקציה

/* ---------- מקלדת קוד ---------- */
/* מציירת מקלדת ספרות לתוך אלמנט. onDone מקבל את הקוד כשמגיעים לאורך המבוקש. */
function keypad(host, len, onDone, opts={}){
  let buf='';
  host.innerHTML=`
    <div class="dots" id="dots">${'<i></i>'.repeat(len)}</div>
    <div class="keypad" id="kp" dir="ltr">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}
      <button class="act" data-a="cancel">${opts.cancel||'ביטול'}</button>
      <button data-n="0">0</button>
      <button class="act" data-a="del">מחיקה</button>
    </div>`;
  const dots=host.querySelector('#dots');
  const paint=()=>dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i<buf.length));
  const shake=()=>{ dots.classList.add('err'); setTimeout(()=>{dots.classList.remove('err');buf='';paint();},420); };
  host.querySelectorAll('#kp button').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='del'){ buf=buf.slice(0,-1); return paint(); }
    if(b.dataset.a==='cancel'){ return opts.onCancel?opts.onCancel():closeSheet(); }
    if(buf.length>=len) return;
    buf+=b.dataset.n; paint();
    if(buf.length===len) setTimeout(()=>{ if(onDone(buf)===false) shake(); },140);
  });
  return {reset:()=>{buf='';paint()}};
}

/* ============================================================
   מחולל QR עצמאי בג'אווהסקריפט טהור — בלי ספריות חיצוניות.
   תומך ב-Byte mode בלבד, גרסאות 1-5, תיקון שגיאות L או M,
   בלוק יחיד (אין צורך בפיצול Reed-Solomon למספר בלוקים בגדלים האלה).
   מטרת הפיתוח: להטמיע בתוך Ladder בלי לפנות לרשת כדי להציג QR.
   ============================================================ */

/* --- שדה גלואה GF(256), פולינום פרימיטיבי 0x11D (התקן ל-QR) --- */
const GF_EXP = new Array(512);
const GF_LOG = new Array(256);
(function initGF(){
  let x = 1;
  for(let i=0;i<255;i++){
    GF_EXP[i]=x; GF_LOG[x]=i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(let i=255;i<512;i++) GF_EXP[i]=GF_EXP[i-255];
})();
const gfMul=(a,b)=> (a===0||b===0)?0:GF_EXP[GF_LOG[a]+GF_LOG[b]];

/* פולינום יוצר Reed-Solomon למספר נתון של קודוורדים לתיקון שגיאות */
function rsGenPoly(ec){
  let poly=[1];
  for(let i=0;i<ec;i++){
    const next=new Array(poly.length+1).fill(0);
    for(let j=0;j<poly.length;j++){
      next[j]   ^= poly[j];
      next[j+1] ^= gfMul(poly[j], GF_EXP[i]);
    }
    poly=next;
  }
  return poly; // מדרגה גבוהה לנמוכה
}
function rsEncode(data, ec){
  const gen=rsGenPoly(ec);
  const res=new Array(data.length+ec).fill(0);
  for(let i=0;i<data.length;i++) res[i]=data[i];
  for(let i=0;i<data.length;i++){
    const coef=res[i];
    if(coef===0) continue;
    for(let j=0;j<gen.length;j++) res[i+j] ^= gfMul(gen[j], coef);
  }
  return res.slice(data.length);
}

/* --- טבלאות קיבולת: גרסאות 1-5, בלוק יחיד בלבד --- */
const VER = {
  1:{size:21, total:26, remBits:0},
  2:{size:25, total:44, remBits:7},
  3:{size:29, total:70, remBits:7},
  4:{size:33, total:100,remBits:7},
  5:{size:37, total:134,remBits:7},
};
const EC_CODEWORDS = { // [level][version] -> כמה קודוורדים מתוך total מיועדים לתיקון שגיאות
  L:{1:7, 2:10, 3:15, 4:20, 5:26},
  M:{1:10,2:16, 3:26, 4:36, 5:48},
};
const ALIGN_POS = {1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30]};
const FORMAT_BITS = {L:0b01, M:0b00, Q:0b11, H:0b10}; // שני הביטים הראשונים של format info

function bestVersion(byteLen, level){
  for(const v of [1,2,3,4,5]){
    const total=VER[v].total, ec=EC_CODEWORDS[level][v], dataCw=total-ec;
    const capacity = dataCw - 2; // מוד(4 סיביות)+מונה(8 סיביות)=12 סיביות≈2 בתים, מעוגל למטה
    if(byteLen<=capacity) return v;
  }
  return null; // אין גרסה מתאימה עד 5 — הקורא יטפל בזה בעדינות
}

/* --- בניית זרם הנתונים (מוד בתים) --- */
function buildDataCodewords(bytes, version, level){
  const total=VER[version].total, ec=EC_CODEWORDS[level][version], dataCw=total-ec;
  const bits=[];
  const push=(val,len)=>{ for(let i=len-1;i>=0;i--) bits.push((val>>i)&1); };
  push(0b0100, 4);          // מציין מוד: Byte
  push(bytes.length, 8);    // מונה תווים (8 סיביות בגרסאות 1-9)
  for(const b of bytes) push(b, 8);
  // מסיים (עד 4 אפסים), רק אם יש מקום
  const maxBits=dataCw*8;
  for(let i=0;i<4 && bits.length<maxBits;i++) bits.push(0);
  while(bits.length%8!==0) bits.push(0);
  const codewords=[];
  for(let i=0;i<bits.length;i+=8){
    let byte=0; for(let j=0;j<8;j++) byte=(byte<<1)|bits[i+j];
    codewords.push(byte);
  }
  const pad=[0xEC,0x11];
  let pi=0;
  while(codewords.length<dataCw){ codewords.push(pad[pi%2]); pi++; }
  return {data:codewords.slice(0,dataCw), ec, dataCw};
}

/* --- מטריצת המודולים --- */
function makeMatrix(version){
  const size=VER[version].size;
  const m=Array.from({length:size},()=>new Array(size).fill(null));
  const reserved=Array.from({length:size},()=>new Array(size).fill(false));
  const setFinder=(r0,c0)=>{
    for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){
      const rr=r0+r, cc=c0+c; if(rr<0||cc<0||rr>=size||cc>=size) continue;
      reserved[rr][cc]=true;
      const inBorder = r===-1||r===7||c===-1||c===7;
      const inRing   = r>=0&&r<=6&&c>=0&&c<=6&&(r===0||r===6||c===0||c===6);
      const inCore   = r>=2&&r<=4&&c>=2&&c<=4;
      m[rr][cc] = !inBorder && (inRing||inCore) ? true : (!inBorder && !inRing && !inCore ? false : false);
    }
  };
  setFinder(0,0); setFinder(0,size-7); setFinder(size-7,0);
  // תזמון (טיימינג)
  for(let i=8;i<size-8;i++){ if(m[6][i]===null){ m[6][i]=(i%2===0); reserved[6][i]=true; }
                              if(m[i][6]===null){ m[i][6]=(i%2===0); reserved[i][6]=true; } }
  // יישור
  const pos=ALIGN_POS[version];
  const nearFinder=(r,c)=> (r<=8&&c<=8)||(r<=8&&c>=size-9)||(r>=size-9&&c<=8);
  for(const r of pos) for(const c of pos){
    if(nearFinder(r,c)) continue;
    for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
      const rr=r+dr, cc=c+dc;
      reserved[rr][cc]=true;
      const ring = Math.max(Math.abs(dr),Math.abs(dc));
      m[rr][cc] = ring!==1;
    }
  }
  // מודול כהה קבוע
  m[size-8][8]=true; reserved[size-8][8]=true;
  // שמירת מקום למידע העיצוב (format info) — יתמלא בסוף
  for(let i=0;i<9;i++){ if(m[8][i]===null){ m[8][i]=false; reserved[8][i]=true; }
                         if(m[i][8]===null){ m[i][8]=false; reserved[i][8]=true; } }
  for(let i=0;i<8;i++){ m[8][size-1-i]=false; reserved[8][size-1-i]=true;
                         m[size-1-i][8]=false; reserved[size-1-i][8]=true; }
  return {m, reserved, size};
}

function placeData(mat, allBits){
  const {m, reserved, size} = mat;
  let bitIdx=0;
  let dir=-1; // עולים למעלה קודם
  let col=size-1;
  while(col>0){
    if(col===6) col--; // דילוג על עמודת התזמון
    for(let i=0;i<size;i++){
      const row = dir===-1 ? size-1-i : i;
      for(const c of [col, col-1]){
        if(reserved[row][c]) continue;
        const bit = bitIdx<allBits.length ? allBits[bitIdx] : 0;
        m[row][c] = !!bit;
        bitIdx++;
      }
    }
    dir=-dir; col-=2;
  }
}

/* מסכה 0 — פשוטה, תקנית וחוקית; לא מיישמים כאן את כל שמונה המסכות עם ניקוד */
function applyMask(mat){
  const {m, reserved, size}=mat;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    if(reserved[r][c]) continue;
    if((r+c)%2===0) m[r][c]=!m[r][c];
  }
}

function bchFormat(data5){ // BCH(15,5), פולינום 0x537, XOR עם 0x5412 — לפי תקן QR
  let g=data5<<10;
  for(let i=4;i>=0;i--){
    if(g & (1<<(i+10))) g ^= (0x537<<i);
  }
  return ((data5<<10)|g) ^ 0x5412;
}
function placeFormat(mat, level, maskId){
  const {m, size}=mat;
  const data5 = (FORMAT_BITS[level]<<3) | maskId;
  const f = bchFormat(data5);
  const bit=i=>(f>>i)&1;
  // עותק 1 — עוטף את הפינדר הימני-עליון בצורת L, לאורך שורה8 ואז עמודה8
  for(let i=0;i<=5;i++) m[8][i]=!!bit(i);
  m[8][7]=!!bit(6); m[8][8]=!!bit(7); m[7][8]=!!bit(8);
  for(let i=9;i<15;i++) m[14-i][8]=!!bit(i);
  // עותק 2 — כפול ליתירות: ביטים 0-7 לאורך שורה8 ליד הפינדר הימני,
  // ביטים 8-14 לאורך עמודה8 ליד הפינדר התחתון
  for(let i=0;i<8;i++) m[8][size-1-i]=!!bit(i);
  for(let i=8;i<15;i++) m[size-15+i][8]=!!bit(i);
  m[size-8][8]=true;
}

function encodeQR(text, level){
  level = level||'L';
  const bytes=[...unescape(encodeURIComponent(text))].map(c=>c.charCodeAt(0));
  const version=bestVersion(bytes.length, level);
  if(!version) return null;
  const {data, ec, dataCw}=buildDataCodewords(bytes, version, level);
  const ecCw=rsEncode(data, ec);
  const allCw=[...data, ...ecCw];
  const bits=[];
  for(const b of allCw) for(let i=7;i>=0;i--) bits.push((b>>i)&1);
  for(let i=0;i<VER[version].remBits;i++) bits.push(0);
  const mat=makeMatrix(version);
  placeData(mat, bits);
  applyMask(mat);
  placeFormat(mat, level, 0);
  return {size:mat.size, matrix:mat.m, version};
}



/* ---------- ציור ה-QR כ-SVG והצגתו ----------
   רקע לבן קבוע בכוונה, גם במצב כהה — סורק מצלמה צריך ניגודיות
   אמיתית של שחור-על-לבן, לא תלוי בערכת הנושא של האפליקציה.        */
function qrSVG(text, boxPx){
  const res=encodeQR(text,'L');
  if(!res) return '';
  const {size:n, matrix}=res, quiet=4, N=n+quiet*2;
  const px=(boxPx||280)/N;
  let rects='';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(matrix[r][c]) rects+=`<rect x="${((c+quiet)*px).toFixed(2)}" y="${((r+quiet)*px).toFixed(2)}" width="${px.toFixed(2)}" height="${px.toFixed(2)}"/>`;
  }
  return `<svg viewBox="0 0 ${N*px} ${N*px}" style="width:100%;height:auto;display:block;border-radius:12px">
    <rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

function mergeUser(local, remote){
  if(!remote) return local;
  if(!local)  return remote;
  const out = Object.assign({}, remote, local);
  out.lv      = Math.max(local.lv||0, remote.lv||0);
  out.xp      = Math.max(local.xp||0, remote.xp||0);
  out.streak  = Math.max(local.streak||0, remote.streak||0);
  out.lastDay = [local.lastDay, remote.lastDay].filter(Boolean).sort().pop() || null;

  out.srs={};
  new Set([...Object.keys(local.srs||{}), ...Object.keys(remote.srs||{})]).forEach(id=>{
    const a=(local.srs||{})[id], b=(remote.srs||{})[id];
    out.srs[id] = !a ? b : !b ? a : ((a.seen||0) >= (b.seen||0) ? a : b);
  });

  out.seenTypes = Object.assign({}, remote.seenTypes||{}, local.seenTypes||{});

  out.mastered={};
  new Set([...Object.keys(local.mastered||{}), ...Object.keys(remote.mastered||{})]).forEach(k=>
    out.mastered[k]=Math.max((local.mastered||{})[k]||0, (remote.mastered||{})[k]||0));

  const byDay={};
  [...(remote.log||[]), ...(local.log||[])].forEach(e=>{
    const p=byDay[e.d]; byDay[e.d] = (!p || (e.n||0)>=(p.n||0)) ? e : p; });
  out.log = Object.values(byDay).sort((a,b)=>a.d<b.d?-1:1).slice(-400);

  /* בקרת הורים ומשימה: מה שעודכן לאחרונה גובר */
  if((remote.ctrlAt||0) > (local.ctrlAt||0)){ out.ctrl=remote.ctrl; out.task=remote.task; out.ctrlAt=remote.ctrlAt; }
  return normalise(out);
}

async function cloudList(){

}

  try{
    const remote=await cloudList();
    const byId={}; remote.forEach(r=>byId[r.id]=r);
    /* מיזוג נכנס */
    USERS = USERS.map(l => byId[l.id] ? mergeUser(l, byId[l.id]) : l);
    /* פרופילים שקיימים רק בענן */
    remote.forEach(r=>{ if(!USERS.some(l=>l.id===r.id)) USERS.push(normalise(r)); });
    saveUsers();
    /* דחיפה החוצה — רק פרופילים שהשתנו מאז הסנכרון האחרון */
    let pushed=0;
    for(const u of USERS){
      const h=hashCode(JSON.stringify(u));
      if(CFG.hashes[u.id]===h) continue;
      await cloudPush(u); CFG.hashes[u.id]=h; pushed++;
    }
    CFG.last=new Date().toISOString(); saveCfg();
    if(!silent) toast(pushed?`סונכרן · ${pushed} פרופילים`:'הכול מעודכן');
    return true;
  }catch(e){
    if(!silent) toast('הסנכרון נכשל: '+e.message);
    return false;
  }finally{ SYNCING=false; }
}

       בטעות בלחיצה אחת. לא נשענים על ה-sh של המסך הזה בתוך ה-callback,

/* ---------------- התקדמות וניתוח ----------------
   progressBlock בונה את כל בלוק הניתוח — משמש גם למסך "ההתקדמות שלי"
   וגם ללוח הבקרה של ההורה, כדי שההורה יראה בדיוק את אותו עומק נתונים
   שהלומד רואה על עצמו, בלי לשכפל את הלוגיקה פעמיים.
   opts.self=true מוסיף כפתור "תרגול חולשות" שמפעיל סשן על המשתמש
   הפעיל כרגע — ולכן הוא מוצג רק כשמסתכלים על עצמך, לא כשהורה צופה
   בפרופיל של הילד מהמכשיר שלו (שם startSession() היה מפעיל סשן
   בטעות על ההורה עצמו, לא על הילד).                                 */
function progressBlock(u, opts={}){
  const a=analyse(u);
  const days=[...Array(14)].map((_,i)=>{
    const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);
    return u.log.find(x=>x.d===d)||{d,n:0,ok:0,ms:0};
  });
  const mx=Math.max(1,...days.map(d=>d.n));
  return `
   <div class="grid2" style="margin-top:14px">
     <div class="stat"><div class="n">${a.vocab}</div><div class="l">מילים בשליטה מלאה</div></div>
     <div class="stat"><div class="n">${a.learning}</div><div class="l">בתהליך למידה</div></div>
     <div class="stat"><div class="n">${Math.round(a.accAll*100)||0}%</div><div class="l">דיוק כולל</div></div>
     <div class="stat"><div class="n">${a.avgMs?(a.avgMs/1000).toFixed(1)+'s':'—'}</div><div class="l">זמן שליפה ממוצע</div></div>
   </div>
   <div class="sec-title">פעילות ב־14 הימים האחרונים</div>
   <div class="card"><div class="bars">${days.map(d=>
      `<div class="${d.n?'hot':''}" style="height:${Math.max(3,d.n/mx*100)}%" title="${d.d}: ${d.n}"></div>`).join('')}</div>
     <div class="legend"><span>${days[0].d.slice(5)}</span><span>${days[13].d.slice(5)}</span></div>
     <p class="muted" style="margin:10px 0 0">סה"כ ${days.reduce((x,d)=>x+d.n,0)} תרגילים בשבועיים · רצף ${u.streak} ימים</p></div>
   ${a.weakTypes.length?`<div class="sec-title">איפה כדאי להתמקד</div><div class="card">${
     a.weakTypes.map(w=>`<div class="wordrow"><span class="dot" style="background:${w.acc<.6?'var(--bad)':'var(--gold)'}"></span>
       <span style="flex:1">${TYPE_HE[w.t]||w.t}</span><span class="badge">${Math.round(w.acc*100)}%</span></div>`).join('')}
     ${opts.self?'<button class="btn sm" style="margin-top:12px;width:100%" onclick="startSession(\'weak\',12)">תרגול ממוקד חולשות</button>':''}</div>`:''}
   ${a.weakWords.length?`<div class="sec-title">מילים שעדיין לא יושבות</div><div class="card">${
     a.weakWords.map(x=>{const w=WORDS.find(y=>y.en===x.w)||{he:''};
       return `<div class="wordrow"><span class="dot" style="background:var(--bad)"></span>
       <span class="w">${esc(x.w)}</span><span class="h">${esc(w.he)}</span>
       <span class="badge">${x.c.ok}/${x.c.seen}</span></div>`}).join('')}</div>`:''}
   <div class="sec-title">שליטה לפי רמה</div><div class="card">${
     LEVELS.filter(l=>l.id<=u.lv).map(l=>{const p=l.id<u.lv?(u.mastered[l.id]||100):levelPct(u,l.id);
       return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600">
         <span>${l.id} · ${l.nm}</span><span class="badge">${p}%</span></div>
         <div class="progline" style="margin-top:5px"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
   <p class="muted" style="margin-top:14px">${a.dueNow} פריטים ממתינים לחזרה. אלגוריתם החזרות מציג כל פריט בדיוק לפני שהוא נשכח — לכן חשוב יותר לתרגל כל יום מעט, מאשר הרבה פעם בשבוע.</p>`;
}
