<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Ladder · לימוד אנגלית למשפחה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --ink2:#43537a; --ink3:#8b98b8;
  --paper:#eef1f8; --card:#ffffff; --line:#dde3ef;
  --brand:#3d5af1; --brand-soft:#e7ebff; --brand-dark:#2b41c4;
  --accent:#ff8a3d; --accent-soft:#fff0e4;
  --good:#12a37a; --good-soft:#e2f6f0;
  --bad:#e4572e; --bad-soft:#fdeae4;
  --gold:#f6b93b;
  --r:16px; --r-lg:24px;
  --sh:0 1px 2px rgba(20,33,61,.06), 0 8px 24px rgba(20,33,61,.07);
  --sh-lift:0 2px 4px rgba(20,33,61,.08), 0 16px 40px rgba(20,33,61,.14);
  --he:'Assistant',system-ui,sans-serif;
  --en:'Space Grotesk',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--he); background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
.ipa{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;color:var(--ink3);font-size:.82em;letter-spacing:-.02em}
.hide{display:none !important}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;padding:0 16px 96px}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(238,241,248,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.wordmark{font-family:var(--en);font-weight:700;letter-spacing:-.03em;font-size:19px;direction:ltr}
.wordmark i{font-style:normal;color:var(--brand)}
.spacer{flex:1}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:13px;font-weight:600;white-space:nowrap
}
.chip.flame{color:var(--accent);border-color:#ffd9bd;background:var(--accent-soft)}
.avatar{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  font-size:18px;background:var(--brand-soft);border:1px solid var(--line);flex:none
}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);
}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
  border-radius:12px;font-size:11px;font-weight:600;color:var(--ink3);transition:.15s
}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--brand);background:var(--brand-soft)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink3);margin:22px 0 10px;text-transform:uppercase}
h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
h2{font-size:19px;font-weight:700;margin:0 0 6px}
.sub{color:var(--ink2);font-size:14px;margin:0}
.muted{color:var(--ink3);font-size:13px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#fff;border-radius:14px;padding:14px 18px;
  font-weight:700;font-size:16px;width:100%;transition:transform .1s, box-shadow .2s;
  box-shadow:0 4px 0 var(--brand-dark)
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-dark)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:none;background:var(--paper)}
.btn.warm{background:var(--accent);box-shadow:0 4px 0 #d96a1f}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:11px;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px}
.row>*{flex:1}

/* ---------- the ladder (signature) ---------- */
.ladder{position:relative;padding:6px 0 2px}
.rung{
  position:relative;display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:8px;text-align:right;width:100%;
  transition:.18s;overflow:hidden
}
.rung:not(.locked):active{transform:scale(.985)}
.rung.locked{opacity:.5}
.rung.cur{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.rung .fillbar{position:absolute;inset:0 auto 0 0;width:0;background:var(--brand-soft);opacity:.6;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rung>*{position:relative;z-index:1}
.rung .lv{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  font-family:var(--en);font-weight:700;font-size:17px;background:var(--paper);
  border:1px solid var(--line);color:var(--ink2)
}
.rung.done .lv{background:var(--good);color:#fff;border-color:var(--good)}
.rung.cur .lv{background:var(--brand);color:#fff;border-color:var(--brand)}
.rung .nm{font-weight:700;font-size:15.5px;line-height:1.25}
.rung .dsc{font-size:12.5px;color:var(--ink3);margin-top:2px}
.rung .pct{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:none}

/* ---------- practice stage ---------- */
.stage{padding-top:8px}
.progline{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 4px}
.progline>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.qbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);margin-bottom:14px}

/* fluency meter */
.flow{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.flow .track{width:52px;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.flow .track>i{display:block;height:100%;width:100%;background:var(--good);transition:width .1s linear,background .3s}
.flow.mid .track>i{background:var(--gold)} .flow.slow .track>i{background:var(--bad)}

.prompt{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:26px 18px;text-align:center;box-shadow:var(--sh);min-height:150px;
  display:flex;flex-direction:column;justify-content:center;gap:8px
}
.prompt .kicker{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--brand);text-transform:uppercase}
.prompt .big{font-family:var(--en);font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.05;direction:ltr}
.prompt .big.he{font-family:var(--he);font-size:34px;direction:rtl;letter-spacing:0}
.prompt .med{font-family:var(--en);font-size:24px;font-weight:600;direction:ltr;line-height:1.35}
.prompt .med.he{font-family:var(--he);direction:rtl;font-weight:700}
.prompt .small{font-size:14px;color:var(--ink2)}
.prompt .letterpair{display:flex;gap:14px;justify-content:center;align-items:baseline;font-family:var(--en)}
.prompt .letterpair b{font-size:64px;font-weight:700;line-height:1}
.prompt .letterpair span{font-size:40px;font-weight:500;color:var(--ink3);line-height:1}

.opts{display:grid;gap:8px;margin-top:14px}
.opt{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 15px;text-align:right;font-weight:600;font-size:16.5px;transition:.13s;width:100%
}
.opt:active{transform:scale(.985)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:#0b6e52}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:#a33418}
.opt .hint{display:block;font-size:12px;font-weight:400;color:var(--ink3);margin-top:2px}

.answerbox{display:flex;gap:8px;margin-top:14px}
.answerbox input{
  flex:1;padding:15px 14px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--card);font-family:var(--en);direction:ltr;text-align:left;
  font-size:19px;font-weight:600;outline:none;min-width:0
}
.answerbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.answerbox input.ok{border-color:var(--good);background:var(--good-soft)}
.answerbox input.no{border-color:var(--bad);background:var(--bad-soft)}
.answerbox .btn{width:auto;flex:none;padding:0 20px;border-radius:14px}

/* word tiles for sentence building */
.tiles{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center}
.tile{
  font-family:var(--en);direction:ltr;background:var(--card);border:1.5px solid var(--line);
  border-radius:11px;padding:9px 13px;font-size:17px;font-weight:600;transition:.12s
}
.tile:active{transform:scale(.94)}
.tile.used{opacity:.28;pointer-events:none}
.slot{
  min-height:56px;background:var(--brand-soft);border:1.5px dashed #b9c4ff;border-radius:14px;
  padding:9px;display:flex;flex-wrap:wrap;gap:7px;direction:ltr;align-items:center;margin-top:12px
}
.slot .tile{background:#fff;border-color:#b9c4ff}
.slot.ok{background:var(--good-soft);border-color:var(--good);border-style:solid}
.slot.no{background:var(--bad-soft);border-color:var(--bad);border-style:solid}
.slot:empty::after{content:'סדר כאן את המילים';direction:rtl;font-family:var(--he);color:#8c99cc;font-size:13.5px;padding:6px}

/* cloze */
.cloze{font-family:var(--en);direction:ltr;font-size:22px;font-weight:600;line-height:1.6}
.cloze u{color:var(--brand);text-decoration:none;border-bottom:2.5px solid var(--brand);padding:0 22px}

/* proofread */
.proof{font-family:var(--en);direction:ltr;font-size:21px;font-weight:600;line-height:1.75;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pw{padding:3px 6px;border-radius:8px;border:1.5px solid transparent;transition:.12s}
.pw.sel{border-color:var(--brand);background:var(--brand-soft)}
.pw.ok{border-color:var(--good);background:var(--good-soft)}
.pw.no{border-color:var(--bad);background:var(--bad-soft)}

/* feedback */
.fb{border-radius:var(--r);padding:14px;margin-top:12px;border:1px solid;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--good-soft);border-color:#a9e3d1}
.fb.no{background:var(--bad-soft);border-color:#f3c0ae}
.fb .hd{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;margin-bottom:5px}
.fb.ok .hd{color:#0b6e52} .fb.no .hd{color:#a33418}
.fb .bd{font-size:14px;color:var(--ink2);line-height:1.55}
.fb .bd b{color:var(--ink)}

.speakbtn{
  width:56px;height:56px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;margin:0 auto;border:1px solid #c9d3ff;flex:none
}
.speakbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.speakbtn.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,87,46,.5)}70%{box-shadow:0 0 0 14px rgba(228,87,46,0)}}

/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.stat .n{font-family:var(--en);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink3);margin-top:3px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:74px;margin-top:8px}
.bars>div{flex:1;background:var(--brand-soft);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars>div.hot{background:var(--brand)}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:5px;font-family:var(--mono)}
.wordrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.wordrow:last-child{border-bottom:0}
.wordrow .w{font-family:var(--en);direction:ltr;font-weight:600;flex:1;min-width:0}
.wordrow .h{color:var(--ink3);font-size:13px;flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:99px;background:var(--paper);color:var(--ink2);flex:none}

/* ---------- users ---------- */
.userpick{display:grid;gap:10px}
.usercard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:right;width:100%;transition:.15s}
.usercard:active{transform:scale(.985)}
.usercard.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.usercard .av{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:var(--brand-soft);flex:none}
.emojipick{display:flex;flex-wrap:wrap;gap:7px}
.emojipick button{width:42px;height:42px;border-radius:12px;background:var(--paper);border:1.5px solid transparent;font-size:22px}
.emojipick button.on{border-color:var(--brand);background:var(--brand-soft)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.field input:focus,.field select:focus{border-color:var(--brand)}

.sheet-bg{position:fixed;inset:0;background:rgba(20,33,61,.42);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto;animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}

.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark)}
.pill.g{background:var(--good-soft);color:#0b6e52}
.pill.o{background:var(--accent-soft);color:#b95a12}
.pill.r{background:var(--bad-soft);color:#a33418}

.ruleblk{background:var(--brand-soft);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.6}
.ruleblk .ex{font-family:var(--en);direction:ltr;font-weight:600;margin-top:6px;display:block}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:200;animation:pop .2s}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="screen" id="screen"></div>
</div>
<div class="nav" id="nav"></div>
<script>
/* ============================================================
   DATA — מאגר התוכן. הכל כאן, קל להרחבה.
   פורמט מילה:  en|he|ipa|pos|משפט דוגמה|תרגום המשפט
   ============================================================ */

const LEVELS = [
 {id:0,nm:'האותיות',   dsc:'שמות האותיות, צורה גדולה וקטנה',            need:0},
 {id:1,nm:'הצלילים',   dsc:'פונטיקה — לחבר אותיות למילה',                need:75},
 {id:2,nm:'מילים ראשונות',dsc:'מילות הליבה + הצלילים שאין בעברית',       need:75},
 {id:3,nm:'משפט ראשון',dsc:'to be, הווה פשוט, סדר המילים',              need:75},
 {id:4,nm:'שאלות ושלילה',dsc:'שאלות, שלילה, הווה ממושך',                need:75},
 {id:5,nm:'עבר ועתיד', dsc:'זמנים בסיסיים ופעלים חריגים',               need:75},
 {id:6,nm:'קישור והרחבה',dsc:'מילות יחס, קישור, השוואה',                need:75},
 {id:7,nm:'זמנים מורכבים',dsc:'Perfect, תנאי, סביל, דיבור עקיף',        need:75},
 {id:8,nm:'שטף ילידי',  dsc:'Phrasal verbs, ניבים, דיבור מהיר ושיחה',   need:75}
];

const LETTERS = 'A,eɪ,apple,תפוח,æ|B,biː,ball,כדור,b|C,siː,cat,חתול,k|D,diː,dog,כלב,d|E,iː,egg,ביצה,ɛ|F,ɛf,fish,דג,f|G,dʒiː,goat,עז,ɡ|H,eɪtʃ,hat,כובע,h|I,aɪ,ink,דיו,ɪ|J,dʒeɪ,jam,ריבה,dʒ|K,keɪ,key,מפתח,k|L,ɛl,lion,אריה,l|M,ɛm,moon,ירח,m|N,ɛn,nose,אף,n|O,oʊ,orange,תפוז,ɒ|P,piː,pen,עט,p|Q,kjuː,queen,מלכה,kw|R,ɑːr,rain,גשם,r|S,ɛs,sun,שמש,s|T,tiː,tree,עץ,t|U,juː,umbrella,מטריה,ʌ|V,viː,van,טנדר,v|W,ˈdʌbəljuː,water,מים,w|X,ɛks,box,קופסה,ks|Y,waɪ,yellow,צהוב,j|Z,ziː,zebra,זברה,z'
 .split('|').map(s=>{const[u,ipa,ex,he,snd]=s.split(',');return{u,l:u.toLowerCase(),ipa,ex,he,snd}});

/* פונטיקה: מילת CVC | הברות | תרגום */
const PHONICS = `cat,c-a-t,חתול|bat,b-a-t,עטלף|hat,h-a-t,כובע|map,m-a-p,מפה|bag,b-a-g,תיק|dad,d-a-d,אבא|man,m-a-n,איש|ran,r-a-n,רץ|bed,b-e-d,מיטה|red,r-e-d,אדום|pen,p-e-n,עט|ten,t-e-n,עשר|leg,l-e-g,רגל|net,n-e-t,רשת|big,b-i-g,גדול|pig,p-i-g,חזיר|sit,s-i-t,לשבת|six,s-i-x,שש|win,w-i-n,לנצח|lip,l-i-p,שפה|dog,d-o-g,כלב|box,b-o-x,קופסה|top,t-o-p,ראש|hot,h-o-t,חם|mom,m-o-m,אמא|pot,p-o-t,סיר|sun,s-u-n,שמש|bus,b-u-s,אוטובוס|cup,c-u-p,כוס|run,r-u-n,לרוץ|nut,n-u-t,אגוז|hug,h-u-g,חיבוק|ship,sh-i-p,ספינה|fish,f-i-sh,דג|chin,ch-i-n,סנטר|that,th-a-t,זה|when,wh-e-n,מתי|tree,t-r-ee,עץ|blue,b-l-ue,כחול|stop,s-t-o-p,עצור`
 .split('|').map(s=>{const[w,sp,he]=s.split(',');return{w,sp,he}});

/* --- אחסון: localStorage אם זמין, אחרת בזיכרון (לתצוגה מקדימה) --- */
const Store = (()=>{
  let ok=true, mem={};
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  return {
    persistent: ok,
    get(k,d){ try{ const v = ok?localStorage.getItem(k):mem[k]; return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ const s=JSON.stringify(v); if(ok){try{localStorage.setItem(k,s)}catch(e){mem[k]=s}} else mem[k]=s; }
  };
})();

const K_USERS='ladder.users', K_CUR='ladder.current';
const today = ()=> new Date().toISOString().slice(0,10);
const dayNum = ()=> Math.floor(Date.now()/864e5);
const uid = ()=> Math.random().toString(36).slice(2,9);

let USERS = Store.get(K_USERS, []);
/* השלמת שדות חסרים בפרופילים ישנים או מיובאים */
function normalise(u){
  u.srs=u.srs||{}; u.log=u.log||[]; u.mastered=u.mastered||{};
  u.lv=u.lv||0; u.xp=u.xp||0; u.streak=u.streak||0;
  u.settings=Object.assign({tts:true,autoSpeak:true,speed:.95,pitch:1,voice:null}, u.settings||{});
  return u;
}
USERS.forEach(normalise);
let CUR   = Store.get(K_CUR, null);
const saveUsers = ()=> Store.set(K_USERS, USERS);
const me = ()=> USERS.find(u=>u.id===CUR);

function newUser(name, emoji, role, lv){
  const u = {
    id:uid(), name, emoji, role, created:today(),
    lv: lv||0,                 // רמה נוכחית
    xp:0, streak:0, lastDay:null,
    srs:{},                    // itemId -> {ef,iv,rep,due,seen,ok,ms}
    log:[],                    // {d, n, ok, ms, min}
    mastered:{},               // lvId -> אחוז
    settings:{tts:true, autoSpeak:true, speed:.95, pitch:1, voice:null}
  };
  USERS.push(normalise(u)); saveUsers(); return u;
}

/* --- SM-2 עם משקל שטף --- */
/* q: 0-5. אנחנו מחשבים אותו משילוב של נכונות + זמן תגובה. */
function grade(correct, ms, target){
  if(!correct) return ms<1500?2:1;          // טעות מהירה = כמעט ידע, טעות איטית = לא יודע
  const r = ms/target;
  if(r<=.6) return 5;                        // שליפה מיידית
  if(r<=1)  return 4;                        // בטווח היעד
  if(r<=1.8)return 3;                        // נכון אבל עם היסוס
  return 3;
}

function review(u, itemId, correct, ms, target){
  const q = grade(correct, ms, target);
  let c = u.srs[itemId] || {ef:2.5, iv:0, rep:0, due:dayNum(), seen:0, ok:0, ms:0};
  c.seen++; if(correct) c.ok++;
  c.ms = c.ms ? Math.round(c.ms*.65 + ms*.35) : ms;   // ממוצע נע של זמן שליפה
  if(q<3){ c.rep=0; c.iv=0; }                        // נפילה — חוזרים לאותו יום
  else{
    c.rep++;
    c.iv = c.rep===1?1 : c.rep===2?3 : Math.round(c.iv*c.ef);
    c.ef = Math.max(1.3, c.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
  }
  c.due = dayNum() + c.iv;
  c.last = dayNum();
  u.srs[itemId] = c;
  return {q, card:c};
}

/* מיומנות פריט: 0-1 */
const strength = c => !c ? 0 : Math.min(1, Math.min(1,c.rep/3)*.55 + (c.ok/Math.max(1,c.seen))*.45);

function poolFor(lv){
  const p = [];
  if(lv<=1) LETTERS.forEach(x=>p.push({t:'letter', id:'L:'+x.u, d:x, lv:0}));
  if(lv>=1 && lv<=3) PHONICS.forEach(x=>p.push({t:'phonics',id:'P:'+x.w, d:x, lv:1}));
  WORDS.filter(w=>w.lv<=lv).forEach(w=>{
    p.push({t:'w-recog', id:w.id+'#r', d:w, lv:w.lv});
    p.push({t:'w-recall',id:w.id+'#p', d:w, lv:w.lv});
    if(w.lv>=2) p.push({t:'w-listen',id:w.id+'#l', d:w, lv:w.lv});
    if(w.lv>=3) p.push({t:'w-speak', id:w.id+'#s', d:w, lv:w.lv});
  });
  const key = s => s.slice(0,28);
  SENTS.filter(s=>s.lv<=lv).forEach(s=>{
    p.push({t:'build',  id:'S:'+key(s.en)+'#b', d:s, lv:s.lv});
    p.push({t:'dictate',id:'S:'+key(s.en)+'#d', d:s, lv:s.lv});
  });
  CLOZE.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'cloze', id:'C:'+key(c.s), d:c, lv:c.lv}));
  PROOF.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'proof', id:'F:'+key(c.s), d:c, lv:c.lv}));
  GRAMMAR.filter(g=>g.lv<=lv).forEach(g=>p.push({t:'rule', id:'G:'+key(g.ti), d:g, lv:g.lv}));
  TALK.filter(t=>t.lv<=lv).forEach(t=>p.push({t:'talk', id:'T:'+key(t.q), d:t, lv:t.lv}));
  MINPAIRS.filter(m=>m.lv<=lv).forEach(m=>{
    p.push({t:'mp-hear', id:'M:'+m.a+'-'+m.b+'#h', d:m, lv:m.lv});
    if(lv>=3) p.push({t:'mp-say', id:'M:'+m.a+'-'+m.b+'#s', d:m, lv:m.lv});
  });
  CONTRACT.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'contract', id:'K:'+key(c.full), d:c, lv:c.lv}));
  SPOKEN.filter(s=>s.lv<=lv).forEach(s=>p.push({t:'spoken', id:'R:'+s.sp, d:s, lv:s.lv}));
  return p;
}

/* יעד זמן שליפה לפי סוג התרגיל (מילישניות) */
const TARGET = {letter:2500,phonics:3500,'w-recog':3000,'w-recall':5000,'w-listen':6000,
                'w-speak':6000,build:15000,dictate:14000,cloze:6000,proof:9000,rule:8000,talk:20000,
                'mp-hear':4000,'mp-say':7000,contract:5000,spoken:6000};

/* --- בניית סשן: חזרות שנדרשות קודם, ואז חומר חדש, בשילוב מסוגים שונים --- */
function buildSession(u, size, mode){
  const pool = poolFor(u.lv);
  const d = dayNum();
  let due=[], fresh=[], weak=[];
  pool.forEach(it=>{
    const c=u.srs[it.id];
    if(!c) fresh.push(it);
    else if(c.due<=d) (strength(c)<.35?weak:due).push(it);
  });
  // מילוי: אם אין מספיק פריטים שהגיע זמנם, מקדימים את החלשים ביותר
  const fill = (list, sub) => {
    if(list.length>=size) return list.slice(0,size);
    const extra = shuffle(sub.filter(x=>!list.includes(x)))
      .sort((a,b)=>strength(u.srs[a.id])-strength(u.srs[b.id]));
    return [...list, ...extra].slice(0,size);
  };

  if(mode==='weak'){
    const s=[...weak,...due].sort((a,b)=>strength(u.srs[a.id])-strength(u.srs[b.id]));
    return interleave(fill(s, pool));
  }
  if(mode==='sound'){
    const s=pool.filter(x=>['mp-hear','mp-say','spoken','phonics','w-listen','w-speak','dictate'].includes(x.t));
    return s.length? interleave(capTypes(shuffle(s),size)) : buildSession(u,size,'mix');
  }
  if(mode==='talk'){
    const t=pool.filter(x=>x.t==='talk');
    return t.length? shuffle(t).slice(0,size) : buildSession(u,size,'mix');
  }
  if(mode==='rules'){
    const g=pool.filter(x=>['rule','cloze','proof','build','contract'].includes(x.t));
    return g.length? interleave(capTypes(shuffle(g),size)) : buildSession(u,size,'mix');
  }

  shuffle(due); shuffle(fresh); shuffle(weak);
  // מיקס: ~40% חלשים, ~40% לחזרה, ~30% חדש — ומה שחסר מושלם מהמאגר
  const want = [...weak.slice(0,Math.ceil(size*.4)), ...due.slice(0,Math.ceil(size*.4)), ...fresh.slice(0,Math.ceil(size*.3))];
  const rest = shuffle([...fresh, ...due, ...weak]).filter(x=>!want.includes(x));
  return interleave(capTypes([...want, ...rest, ...shuffle(pool)], size));

/* אף סוג תרגיל לא תופס יותר מ־35% מהסשן — כדי שלא ייצא סשן של מילים בלבד */
}
function capTypes(cands, size){
  const cap=Math.max(2,Math.ceil(size*.35)), cnt={}, out=[], seen=new Set();
  for(const x of cands){
    if(out.length>=size) break;
    if(seen.has(x.id)) continue;
    if((cnt[x.t]||0)>=cap) continue;
    cnt[x.t]=(cnt[x.t]||0)+1; seen.add(x.id); out.push(x);
  }
  for(const x of cands){ if(out.length>=size) break; if(seen.has(x.id)) continue; seen.add(x.id); out.push(x); }
  return out;
}

/* שזירה — לא שני תרגילים מאותו סוג ברצף (Interleaving) */
function interleave(arr){
  const out=[]; const rem=[...arr];
  while(rem.length){
    let i = rem.findIndex(x=>!out.length || x.t!==out[out.length-1].t);
    if(i<0) i=0;
    out.push(rem.splice(i,1)[0]);
  }
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n,not){ return shuffle(arr.filter(x=>x!==not)).slice(0,n); }

/* --- שליטה ברמה --- */
function levelPct(u, lv){
  const all = poolFor(lv);
  const own = all.filter(x=>x.lv===lv);
  const set = own.length?own:all;
  if(!set.length) return 0;
  const s = set.reduce((a,x)=>a+strength(u.srs[x.id]),0);
  return Math.round(100*s/set.length);
}
function checkPromote(u){
  const pct = levelPct(u, u.lv);
  u.mastered[u.lv]=pct;
  if(pct>=LEVELS[u.lv].need && u.lv<LEVELS.length-1){ u.lv++; return true; }
  return false;
}

/* --- רצף ימים ולוג --- */
function touchDay(u, correct, ms){
  const t=today();
  if(u.lastDay!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    u.streak = (u.lastDay===y)?u.streak+1:1;
    u.lastDay=t;
  }
  let e = u.log.find(x=>x.d===t);
  if(!e){ e={d:t,n:0,ok:0,ms:0}; u.log.push(e); if(u.log.length>400) u.log.shift(); }
  e.n++; if(correct) e.ok++; e.ms = Math.round((e.ms*(e.n-1)+ms)/e.n);
}

/* --- ניתוח לדשבורד --- */
function analyse(u){
  const items = Object.entries(u.srs);
  const known = items.filter(([,c])=>strength(c)>=.7).length;
  const learning = items.filter(([,c])=>strength(c)>0 && strength(c)<.7).length;
  const accAll = items.reduce((a,[,c])=>a+c.ok,0) / Math.max(1, items.reduce((a,[,c])=>a+c.seen,0));
  const msArr = items.filter(([,c])=>c.ms).map(([,c])=>c.ms);
  const avgMs = msArr.length? Math.round(msArr.reduce((a,b)=>a+b,0)/msArr.length) : 0;
  const wordCards = items.filter(([k])=>k.startsWith('w:'));
  const vocab = new Set(wordCards.filter(([,c])=>strength(c)>=.7).map(([k])=>k.split('#')[0])).size;
  // נקודות חולשה לפי סוג תרגיל
  const byType={};
  poolFor(u.lv).forEach(it=>{ const c=u.srs[it.id]; if(!c)return;
    byType[it.t]=byType[it.t]||{ok:0,n:0}; byType[it.t].ok+=c.ok; byType[it.t].n+=c.seen; });
  const weakTypes = Object.entries(byType).filter(([,v])=>v.n>=4)
      .map(([t,v])=>({t, acc:v.ok/v.n})).sort((a,b)=>a.acc-b.acc).slice(0,3);
  // מילים בעייתיות
  const weakWords = items.filter(([k,c])=>k.startsWith('w:') && c.seen>=2 && strength(c)<.45)
      .map(([k,c])=>({w:k.split(':')[1].split('#')[0], c}))
      .sort((a,b)=>strength(a.c)-strength(b.c)).slice(0,12);
  const dueNow = poolFor(u.lv).filter(it=>{const c=u.srs[it.id];return c&&c.due<=dayNum()}).length;
  return {known, learning, accAll, avgMs, vocab, weakTypes, weakWords, dueNow, total:items.length};
}

/* דירוג קולות: הדפדפן מחזיר גם קולות דחוסים ("compact") שנשמעים מתכתיים.
   אנחנו מדרגים ובוחרים את הטבעי ביותר שזמין במכשיר.                      */
let VOICES=[], WARM=false;

function voiceScore(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase();
  let s=0;
  if(/premium|enhanced|neural|natural/.test(n)) s+=60;   // הקולות האיכותיים באמת
  if(/siri/.test(n))                            s+=45;
  if(/google/.test(n))                          s+=35;
  if(/\b(ava|allison|samantha|zoe|evan|nathan|joelle|susan|karen|aria|jenny|guy|sonia|libby|emma)\b/.test(n)) s+=20;
  if(/compact|eloquence|espeak|pico|novelty|whisper|zarvox|albert|bad news|bells/.test(n)) s-=80;
  if(l.startsWith('en-us')) s+=12; else if(l.startsWith('en-gb')) s+=8;
  if(v.localService===false) s+=10;                       // קולות רשת בדרך כלל טובים יותר
  if(v.default) s+=3;
  return s;
}
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
}
function pickVoice(){
  const want = me()?.settings?.voice;
  return VOICES.find(v=>v.name===want) || VOICES[0] || null;
}
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }

function warmUp(){
  if(WARM || !window.speechSynthesis) return;
  WARM=true;
  try{ const w=new SpeechSynthesisUtterance(' '); w.volume=0; speechSynthesis.speak(w); }catch(e){}
  if(!VOICES.length) loadVoices();
}
addEventListener('touchstart', warmUp, {once:true, passive:true});
addEventListener('mousedown',  warmUp, {once:true});

function say(text, rate){
  if(!window.speechSynthesis || !text) return false;
  try{
    warmUp();
    speechSynthesis.cancel();
    const s=me()?.settings||{};
    const u2=new SpeechSynthesisUtterance(String(text));
    const v=pickVoice();
    if(v){ u2.voice=v; u2.lang=v.lang; } else u2.lang='en-US';
    u2.rate  = rate || s.speed || .95;
    u2.pitch = s.pitch != null ? s.pitch : 1;
    u2.volume= 1;
    speechSynthesis.speak(u2);
    return true;
  }catch(e){ return false; }
}

/* --- השוואת טקסט סלחנית --- */
const norm = s => (s||'').toLowerCase().replace(/[.,!?;:'"()\-]/g,'').replace(/\s+/g,' ').trim();
function near(a,b){
  a=norm(a); b=norm(b);
  if(a===b) return true;
  if(!a) return false;
  // מרחק לוינשטיין קטן — סובלנות לשגיאת הקלדה אחת במילים ארוכות
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return false;
  const dp=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n] <= (m>6?2:1);
}

function startSession(mode, size, lv){
  const u=me();
  const oldLv=u.lv; if(lv!=null) u.lv=lv;
  const items=buildSession(u,size,mode);
  u.lv=oldLv;
  if(!items.length){ toast('אין פריטים זמינים'); return; }
  S={items, i:0, ok:0, msSum:0, mode, answered:false, t0:0, promoted:false, hardIds:[]};
  TAB='practice'; render();
}

function drawQ(s){
  const u=me(), it=S.items[S.i];
  if(!it) return drawDone(s);
  const target=TARGET[it.t]||6000;
  s.innerHTML=`<div class="stage">
    <div class="progline"><i style="width:${(S.i/S.items.length)*100}%"></i></div>
    <div class="qbar"><span>${S.i+1} / ${S.items.length}</span>
      <span class="badge">${TYPE_HE[it.t]||it.t}</span><span class="spacer" style="flex:1"></span>
      <span class="flow" id="flow"><span class="track"><i id="ft"></i></span><span id="fv">0.0s</span></span>
      <button class="btn ghost sm" style="padding:4px 10px" onclick="S=null;render()">יציאה</button></div>
    <div id="q"></div></div>`;
  S.t0=performance.now(); S.answered=false;
  clearInterval(TICK);
  TICK=setInterval(()=>{
    if(!S||S.answered) return;
    const ms=performance.now()-S.t0, r=ms/target;
    const f=$('#flow'); if(!f) return clearInterval(TICK);
    $('#ft').style.width=Math.max(0,100-r*100)+'%';
    $('#fv').textContent=(ms/1000).toFixed(1)+'s';
    f.className='flow '+(r<1?'':r<1.8?'mid':'slow');
  },100);
  RENDER[it.t](document.getElementById('q'), it, u, target);
}

/* סיום שאלה */
function answer(it, correct, target, extraHtml){
  if(S.answered) return; S.answered=true; clearInterval(TICK);
  const u=me(), ms=Math.round(performance.now()-S.t0);
  const {q}=review(u,it.id,correct,ms,target);
  touchDay(u,correct,ms); u.xp += correct?(q>=5?12:q>=4?9:6):2;
  if(correct) S.ok++; else S.hardIds.push(it.id);
  S.msSum+=ms; saveUsers();
  const fast = correct && ms<=target*.6;
  const box=el(`<div class="fb ${correct?'ok':'no'}">
    <div class="hd">${correct?(fast?'⚡ שליפה מיידית':'✓ נכון'):'✗ לא מדויק'}<span class="badge">${(ms/1000).toFixed(1)}s</span></div>
    <div class="bd">${extraHtml||''}</div></div>`);
  $('#q').appendChild(box);
  const nx=el(`<button class="btn" style="margin-top:10px">${S.i+1<S.items.length?'הבא':'סיום'}</button>`);
  nx.onclick=()=>{ S.i++; render(); };
  $('#q').appendChild(nx); nx.focus();
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

    listen(a=>{ m.classList.remove('rec'); finish(a[0]||''); },
           ()=>{ m.classList.remove('rec'); if(!S.answered)$('#st').textContent='לא נקלט. נסו שוב או כתבו.'; });

/* ---------------- סיום סשן ---------------- */
function drawDone(s){
  const u=me(), n=S.items.length, acc=Math.round(S.ok/n*100), avg=(S.msSum/n/1000).toFixed(1);
  const promoted=checkPromote(u); saveUsers();
  const flowNote = avg<3.5?'שליפה מהירה — זה בדיוק מה שמונע גמגום בדיבור.'
    : avg<6?'קצב סביר. המשיכו לחתור לשליפה מתחת ל־3 שניות.'
    : 'השליפה עדיין איטית. עדיף סשנים קצרים ותכופים מאשר ארוכים ונדירים.';
  s.innerHTML=`<h1>${acc>=80?'סשן מצוין':'סיימתם'}</h1>
    <p class="sub">${flowNote}</p>
    <div class="grid3" style="margin-top:14px">
      <div class="stat"><div class="n">${acc}%</div><div class="l">דיוק</div></div>
      <div class="stat"><div class="n">${avg}s</div><div class="l">זמן ממוצע</div></div>
      <div class="stat"><div class="n">${S.ok}/${n}</div><div class="l">נכונות</div></div>
    </div>
    ${promoted?`<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)">
      <b>עליתם לרמה ${u.lv} · ${LEVELS[u.lv].nm}</b><div class="sub">${LEVELS[u.lv].dsc}</div></div>`:''}
    ${S.hardIds.length?`<div class="sec-title">לחזרה קרובה</div><div class="card">${
      S.items.filter(x=>S.hardIds.includes(x.id)).map(x=>{
        const lbl = x.t.startsWith('w-')?`${x.d.en} — ${x.d.he}` : x.t==='rule'?x.d.ti : (x.d.en||x.d.s||x.d.q||x.d.w||x.d.u||x.d.full||x.d.sp||(x.d.a?x.d.a+' / '+x.d.b:'')||'');
        return `<div class="wordrow"><span class="dot" style="background:var(--bad)"></span><span class="w">${esc(lbl)}</span><span class="badge">${TYPE_HE[x.t]}</span></div>`;
      }).join('')}</div>`:''}
    <button class="btn" style="margin-top:14px" onclick="startSession('${S.mode}',${n})">עוד סשן</button>
    <button class="btn ghost" style="margin-top:8px" onclick="S=null;go('home')">חזרה לבית</button>`;
  S.finished=true;
}
/* ---------------- זוגות מינימליים: שמיעה ---------------- */
RENDER['mp-hear']=(q,it,u,tg)=>{
  const d=it.d, target = Math.random()<.5 ? d.a : d.b;
  const other = target===d.a ? d.b : d.a;
  q.innerHTML=`<div class="prompt"><div class="kicker">אבחנה בין צלילים</div>
    <button class="speakbtn" onclick="say('${jq(target)}',.85)">${svg('sound')}</button>
    <div class="small">איזו מהשתיים נאמרה?</div>
    <button class="btn ghost sm" style="margin:0 auto" onclick="say('${jq(target)}',.6)">האטה</button></div>
    <div class="opts" id="o"></div>`;
  say(target,.85);
  shuffle([d.a,d.b]).forEach(w=>{
    const isA = w===d.a;
    const b=el(`<button class="opt" style="text-align:center">
      <span class="en" style="font-size:19px">${w}</span>
      <span class="hint"><span class="ipa">/${isA?d.ipaA:d.ipaB}/</span> · ${isA?d.heA:d.heB}</span></button>`);
    b.onclick=()=>{ const ok=w===target; b.classList.add(ok?'ok':'no');
      say(d.a+' … '+d.b,.7);
      answer(it,ok,tg,`נאמר <b class="en">${target}</b> <span class="ipa">/${target===d.a?d.ipaA:d.ipaB}/</span> — ${target===d.a?d.heA:d.heB}.<br>
        לא <b class="en">${other}</b> <span class="ipa">/${other===d.a?d.ipaA:d.ipaB}/</span>.<br>
        <b>${esc(d.contrast)}</b> — ${esc(d.tip)}`); };
    $('#o').appendChild(b);
  });
};

/* ---------------- זוגות מינימליים: הגייה ---------------- */
RENDER['mp-say']=(q,it,u,tg)=>{
  const d=it.d, tgt = Math.random()<.5 ? d.a : d.b;
  const twin = tgt===d.a ? d.b : d.a;
  const ipaT = tgt===d.a ? d.ipaA : d.ipaB, heT = tgt===d.a ? d.heA : d.heB;
  q.innerHTML=`<div class="prompt"><div class="kicker">הגייה מדויקת</div>
    <div class="med">${tgt}</div><div class="ipa">/${ipaT}/</div><div class="small">${heT}</div>
    <div class="muted" style="font-size:12.5px">ולא <span class="en">${twin}</span></div>
    <button class="btn ghost sm" style="margin:0 auto" onclick="say('${jq(tgt)}',.7)">שמיעת דוגמה</button></div>
    <div class="ruleblk" style="margin-top:12px"><b>${esc(d.contrast)}</b><br>${esc(d.tip)}</div>
    <div style="text-align:center;margin-top:14px"><button class="speakbtn" id="mic">${svg('mic')}</button>
      <p class="muted" id="st" style="margin-top:8px">${SR?'לחצו והגו את המילה':'זיהוי דיבור לא נתמך כאן'}</p></div>
    <button class="btn ghost" style="margin-top:10px" id="skip">שמעתי ותרגלתי</button>`;
  say(tgt,.75);
  $('#skip').onclick=()=>answer(it,true,tg,`<b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span><br>${esc(d.tip)}`);
  $('#mic').onclick=()=>{
    if(!SR) return toast('אין תמיכה בזיהוי דיבור');
    const m=$('#mic'); m.classList.add('rec'); $('#st').textContent='מקשיב…';
    listen(alts=>{
      m.classList.remove('rec');
      const hitT = alts.some(a=>near(a,tgt));
      const hitW = !hitT && alts.some(a=>near(a,twin));
      answer(it,hitT,tg, hitT
        ? `מדויק: <b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span>`
        : hitW
          ? `נשמע כמו <b class="en">${twin}</b>, לא <b class="en">${tgt}</b>.<br><b>${esc(d.contrast)}</b> — ${esc(d.tip)}`
          : `שמעתי: <b class="en">${esc(alts[0]||'—')}</b><br>המטרה: <b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span><br>${esc(d.tip)}`);
    },()=>{ m.classList.remove('rec'); if(!S.answered)$('#st').textContent='לא נקלט. נסו שוב או המשיכו.'; });
  };
};

/* ---------------- קיצורים ---------------- */
RENDER.contract=(q,it,u,tg)=>{
  const d=it.d;
  const wrong = shuffle(CONTRACT.filter(x=>x!==d)).slice(0,3).map(x=>x.short);
  const opts = shuffle([d.short,...wrong]);
  q.innerHTML=`<div class="prompt"><div class="kicker">קיצור — איך זה נשמע בדיבור</div>
    <div class="med" style="font-size:21px">${esc(d.full)}</div><div class="small">${esc(d.he)}</div></div>
    <p class="muted" style="text-align:center;margin:12px 0 0">מה הצורה המקוצרת?</p><div class="opts" id="o"></div>`;
  if(u.settings.autoSpeak) say(d.full,.85);
  opts.forEach(o=>{
    const b=el(`<button class="opt en" style="text-align:center">${esc(o)}</button>`);
    b.onclick=()=>{ const ok=o===d.short; b.classList.add(ok?'ok':'no'); say(d.short,.95);
      answer(it,ok,tg,`<span style="opacity:.6" class="en">${esc(d.full)}</span> → <b class="en">${esc(d.short)}</b><br>${esc(d.he)}
        <br><span class="muted">בדיבור טבעי כמעט תמיד משתמשים בצורה המקוצרת. הצורה המלאה נשמעת רשמית או מודגשת.</span>`); };
    $('#o').appendChild(b);
  });
};

/* ---------------- אנגלית מדוברת מהירה ---------------- */
RENDER.spoken=(q,it,u,tg)=>{
  const d=it.d;
  const wrong = shuffle(SPOKEN.filter(x=>x!==d)).slice(0,3).map(x=>x.full);
  const opts = shuffle([d.full,...wrong]);
  q.innerHTML=`<div class="prompt"><div class="kicker">דיבור מהיר — מה נאמר באמת</div>
    <button class="speakbtn" onclick="say('${jq(d.ex)}',1.05)">${svg('sound')}</button>
    <div class="med" style="font-size:20px">${esc(d.ex)}</div>
    <button class="btn ghost sm" style="margin:0 auto" onclick="say('${jq(d.ex)}',.6)">האטה</button></div>
    <p class="muted" style="text-align:center;margin:12px 0 0">מה הצורה התקנית של <span class="en">${esc(d.sp)}</span>?</p>
    <div class="opts" id="o"></div>`;
  say(d.ex,1.05);
  opts.forEach(o=>{
    const b=el(`<button class="opt en" style="text-align:center">${esc(o)}</button>`);
    b.onclick=()=>{ const ok=o===d.full; b.classList.add(ok?'ok':'no');
      answer(it,ok,tg,`<b class="en">${esc(d.sp)}</b> = <b class="en">${esc(d.full)}</b> — ${esc(d.he)}<br>
        <span class="en">${esc(d.ex)}</span><br><span class="muted">${esc(d.note)}</span>`); };
    $('#o').appendChild(b);

};

   <div class="card"><div class="bars">${days.map(d=>
      `<div class="${d.n?'hot':''}" style="height:${Math.max(3,d.n/mx*100)}%" title="${d.d}: ${d.n}"></div>`).join('')}</div>
     <div class="legend"><span>${days[0].d.slice(5)}</span><span>${days[13].d.slice(5)}</span></div>
     <p class="muted" style="margin:10px 0 0">סה"כ ${days.reduce((x,d)=>x+d.n,0)} תרגילים בשבועיים · רצף ${u.streak} ימים</p></div>
   ${a.weakTypes.length?`<div class="sec-title">איפה כדאי להתמקד</div><div class="card">${

       <span style="flex:1">${TYPE_HE[w.t]||w.t}</span><span class="badge">${Math.round(w.acc*100)}%</span></div>`).join('')}
     <button class="btn sm" style="margin-top:12px;width:100%" onclick="startSession('weak',12)">תרגול ממוקד חולשות</button></div>`:''}
   ${a.weakWords.length?`<div class="sec-title">מילים שעדיין לא יושבות</div><div class="card">${

function exportData(){
  const blob=new Blob([JSON.stringify({v:1,users:USERS},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='ladder-backup-'+today()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.users) throw 0;
      if(!confirm('הייבוא יחליף את כל הנתונים הקיימים. להמשיך?')) return;
      USERS=d.users; USERS.forEach(normalise); CUR=USERS[0]?.id||null; saveUsers(); Store.set(K_CUR,CUR); toast('יובא'); render();
    }catch(e){ toast('הקובץ לא תקין'); } };
    r.readAsText(f); };
  i.click();
}

/* ---------------- גיליון תחתון ---------------- */
function sheet(html, after){
  closeSheet();
  const bg=el(`<div class="sheet-bg"><div class="sheet"><div class="grab"></div>${html}</div></div>`);
  bg.onclick=e=>{ if(e.target===bg) closeSheet(); };
  document.body.appendChild(bg);
  if(after) after(bg.querySelector('.sheet'));
}
