<title>BeEnglish · לימוד אנגלית למשפחה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Ladder — מערכת עיצוב
   הרעיון: מכשיר מדידה. האפליקציה מודדת את הפער בין "לדעת" ל"לשלוף",
   ולכן הנתונים מוצגים בדיוק של ציוד בדיקה — והתוכן עצמו גדול וחם.
   שתי מערכות כתב, שני כיווני קריאה, שלוש משפחות גופנים.
   ============================================================ */
:root{
  color-scheme: light;
  /* גופן אחד לעברית ולטינית כאחד — Rubik נבחר כי יש לו תמיכה עברית
     מלאה וגם צורה מעוגלת וחמימה, קרוב ברוחו לגופן המותאם-אישית של
     Duolingo בלי להעתיק אותו. משתמשים באותו משתנה בכל מקום כדי
     שהמעבר בין עברית לאנגלית בתוך משפט לא יקפוץ בין סגנונות.     */
  --he:'Rubik',system-ui,sans-serif;
  --en:'Rubik',system-ui,sans-serif;
  --mono:'Rubik',system-ui,sans-serif;

  --ink:#3c3c3c; --ink2:#5c6066; --ink3:#8a8f96; --ink4:#c2c7cd;
  --paper:#ffffff; --card:#ffffff; --line:#e5e5e5; --line2:#f2f2f2;

  /* הפלטה הרוויה של Duolingo — ירוק כפעולה עיקרית, כחול למידע,
     אדום לשגיאה, זהב לרצף/ניקוד, סגול לרגעים חגיגיים.            */
  --brand:#58cc02; --brand2:#4caf00; --brand-soft:#d7ffb8;
  --blue:#1cb0f6; --blue2:#1899d6; --blue-soft:#ddf4ff;
  --live:#ff4b4b; --live-soft:#ffdfe0;
  --good:#58cc02; --good-soft:#d7ffb8;
  --bad:#ff4b4b; --bad-soft:#ffdfe0;
  --gold:#ffc800; --gold2:#e5b400; --gold-soft:#fff3c4;
  --purple:#ce82ff; --purple2:#a568c9; --purple-soft:#f3e3ff;

  /* צלליות ה"מדף" התלת-ממדי של הכפתורים — צבע מוצק בלי טשטוש,
     לא blur כמו קודם. הגובה שלהן הוא חלק מהאפקט, לא רק הצבע.     */
  --r:16px; --r-lg:20px; --r-xl:26px;
  --sh:0 2px 0 rgba(0,0,0,.04);
  --sh-lift:0 10px 24px rgba(0,0,0,.12);
  --press:4px;
  --bar:82px;
  --fs:16px;

  --shell:600px;
  --side:0px;
}
[data-theme="dark"]{
  /* גם במצב כהה נשארים בשפה של Duolingo — אותם צבעי מותג רוויים,
     רק על רקע כהה. לא חוזרים לאסתטיקת "מכשיר המדידה" הקודמת.    */
  color-scheme: dark;
  --ink:#f3f3f3; --ink2:#c2c6cc; --ink3:#8e939a; --ink4:#5a5f66;
  --paper:#131313; --card:#1e1e1e; --line:#3a3a3a; --line2:#2a2a2a;
  --brand:#58cc02; --brand2:#4caf00; --brand-soft:#243d0a;
  --blue:#1cb0f6; --blue2:#1899d6; --blue-soft:#0d2c38;
  --live:#ff4b4b; --live-soft:#3d1414;
  --good:#58cc02; --good-soft:#243d0a;
  --bad:#ff4b4b; --bad-soft:#3d1414;
  --gold:#ffc800; --gold2:#e5b400; --gold-soft:#3d3007;
  --purple:#ce82ff; --purple2:#a568c9; --purple-soft:#331a42;
  --sh:0 2px 0 rgba(0,0,0,.3);
  --sh-lift:0 10px 24px rgba(0,0,0,.5);
}
[data-theme="light"]{ color-scheme: light; }
@media (prefers-color-scheme:dark){
  [data-theme="auto"]{
    color-scheme: dark;
    --ink:#f3f3f3; --ink2:#c2c6cc; --ink3:#8e939a; --ink4:#5a5f66;
    --paper:#131313; --card:#1e1e1e; --line:#3a3a3a; --line2:#2a2a2a;
    --brand:#58cc02; --brand2:#4caf00; --brand-soft:#243d0a;
    --blue:#1cb0f6; --blue2:#1899d6; --blue-soft:#0d2c38;
    --live:#ff4b4b; --live-soft:#3d1414;
    --good:#58cc02; --good-soft:#243d0a;
    --bad:#ff4b4b; --bad-soft:#3d1414;
    --gold:#ffc800; --gold2:#e5b400; --gold-soft:#3d3007;
    --purple:#ce82ff; --purple2:#a568c9; --purple-soft:#331a42;
    --sh:0 2px 0 rgba(0,0,0,.3);
    --sh-lift:0 10px 24px rgba(0,0,0,.5);
  }
}
[data-size="l"]{--fs:18.5px}
[data-size="xl"]{--fs:21px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--he);background:var(--paper);color:var(--ink);
  font-size:var(--fs);line-height:1.5;overscroll-behavior-y:none;
  transition:background .25s, color .25s;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-variation-settings:'opsz' 20}
.ipa{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;color:var(--ink3);font-size:.8em;letter-spacing:-.03em;font-weight:400}
.hide{display:none !important}
.spacer{flex:1}

/* ---------- shell ---------- */
#app{max-width:var(--shell);margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;padding:0 18px calc(var(--bar) + env(safe-area-inset-bottom) + 26px)}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
  display:flex;align-items:center;gap:9px;
  border-bottom:1px solid transparent;transition:border-color .2s
}
.topbar.scrolled{border-bottom-color:var(--line)}
.wordmark{
  font-family:var(--en);font-weight:800;letter-spacing:-.045em;font-size:21px;
  direction:ltr;font-variation-settings:'opsz' 40;line-height:1;
  /* "BeEnglish" ארוך מהשם הקודם — מונעים שבירת שורה ודחיקה של
     תגי הרצף והרמה שלצידו במסכים צרים.                          */
  white-space:nowrap;flex:none
}
@media (max-width:360px){ .wordmark{font-size:18px} }
.wordmark i{font-style:normal;color:var(--brand)}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 10px;
  font-size:12.5px;font-weight:700;white-space:nowrap;font-family:var(--mono)
}
.chip.flame{color:var(--live);border-color:var(--live);background:var(--live-soft)}
.avatar{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  flex:none;overflow:hidden
}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);padding:5px 8px calc(env(safe-area-inset-bottom) + 5px);
  transition:transform .15s ease-out
}
.nav button span{white-space:nowrap}
.nav-in{max-width:var(--shell);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.nav button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;
  border-radius:11px;font-size:11px;font-weight:700;color:var(--ink3);transition:.15s
}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--brand)}
.nav button.on svg{stroke-width:2.2}

/* ---------- typography ---------- */
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;margin:6px 0 3px;line-height:1.15}
h2{font-size:1.18rem;font-weight:700;margin:0 0 5px;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:.87rem;margin:0;line-height:1.55}
.muted{color:var(--ink3);font-size:.8rem;line-height:1.5}
.sec-title{
  font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink3);
  margin:26px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:9px
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:10px}

/* ---------- buttons ---------- */
/* ============================================================
   הכפתור התלת-ממדי — הסימן ההיכר הכי מזוהה של Duolingo.
   העיקרון: "מדף" צבעוני מתחת לכפתור, בגובה --press. לחיצה מורידה
   את הכפתור לתוך המדף (translateY) ומאפסת את הגובה שלו — מדמה
   כפתור פיזי שנלחץ פנימה. אין blur, אין מעברי צבע עדינים; הכול
   שטוח, מוצק וברור.                                              */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--brand);color:#fff;border-radius:var(--r);padding:15px 18px;
  font-weight:800;font-size:1.02rem;width:100%;letter-spacing:0;
  border:none;box-shadow:0 var(--press) 0 var(--brand2);
  transform:translateY(0);
  transition:transform .06s ease-out, box-shadow .06s ease-out, filter .1s
}
.btn:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--brand2)}
.btn.ghost{
  background:var(--card);color:var(--brand);border:2px solid var(--line);
  box-shadow:0 var(--press) 0 var(--line)
}
.btn.ghost:active{transform:translateY(var(--press));box-shadow:0 0 0 var(--line)}
.btn.live{background:var(--live);box-shadow:0 var(--press) 0 #d63c3c}
.btn.live.ghost{background:var(--card);color:var(--live);border-color:var(--live-soft);box-shadow:0 var(--press) 0 var(--live-soft)}
.btn.sm{padding:11px 16px;font-size:.9rem;width:auto;border-radius:var(--r)}
.btn[disabled]{opacity:.4;pointer-events:none;box-shadow:none;transform:none}
.row{display:flex;gap:8px}.row>*{flex:1}

/* ============================================================
   הסולם — עמוד השדרה
   ============================================================ */
/* ============================================================
   מסלול המשחק — שביל מתפתל של תחנות עגולות, בהשראת הפריסה
   המוכרת ממשחקי לוח: לא רשימה, מסלול שמתקדמים לאורכו.
   כל תחנה מוסטת שמאלה/ימינה לסירוגין (nth-child), עם קו מקווקו
   שמחבר ביניהן. שם הרמה מופיע כתווית קטנה מתחת לתחנה בלבד —
   התיאור המלא נשאר בגיליון שנפתח בהקשה, בדיוק כמו קודם.        */
.ladder{
  position:relative;display:flex;flex-direction:column;align-items:center;
  gap:6px;padding-block:10px 4px
}
.rung{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  width:104px;background:none;border:none;padding:6px 0;
  transition:transform .12s ease-out
}
.rung:nth-child(6n+2){transform:translateX(38%)}
.rung:nth-child(6n+3){transform:translateX(58%)}
.rung:nth-child(6n+4){transform:translateX(38%)}
.rung:nth-child(6n+5){transform:translateX(-38%)}
.rung:nth-child(6n+6){transform:translateX(-58%)}
.rung:nth-child(6n+7){transform:translateX(-38%)}
.rung:not(.locked):active{transform:scale(.94) var(--tx,translateX(0))}
.rung::before{
  content:'';position:absolute;top:-16px;left:50%;width:5px;height:20px;
  background:repeating-linear-gradient(var(--line) 0 4px, transparent 4px 8px);
  transform:translateX(-50%);z-index:0
}
.rung:first-child::before{display:none}
.rung.locked{opacity:.5}
.rung .lv{
  position:relative;z-index:1;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:22px;background:var(--card);
  border:none;color:var(--ink3);box-shadow:0 5px 0 var(--line), inset 0 0 0 2px var(--line)
}
.rung.done .lv{background:var(--brand);color:#fff;box-shadow:0 5px 0 var(--brand2)}
.rung.done .lv::after{content:'✓';position:absolute;font-size:26px}
.rung.done .lv{font-size:0}
.rung.cur .lv{
  background:var(--gold);color:#fff;box-shadow:0 5px 0 var(--gold2);
  animation:pulse-node 1.8s ease-in-out infinite
}
@keyframes pulse-node{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rung.locked .lv{box-shadow:0 5px 0 var(--line)}
.rung .nm{
  font-weight:800;font-size:.78rem;line-height:1.2;text-align:center;max-width:100px;
  color:var(--ink2)
}
.rung .badge{display:none}
.rung .dsc,.rung .pct,.rung .fillbar{display:none}

/* ============================================================
   הסיגנצ'ר: פס הקריאה — מד זמן שליפה עם רצועת סובלנות
   ============================================================ */
.readout{
  scroll-margin-top:calc(env(safe-area-inset-top) + 14px);
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px 12px;margin-bottom:14px;box-shadow:var(--sh);
  /* נדבק לראש המסך ולא נגלל החוצה כשהמקלדת נפתחת. עדיף על
     position:fixed כאן — sticky מחושב מחדש באותו מעבר גלילה/פריסה
     שמטפל בכיווץ ה-visual viewport, ולכן פחות רגיש לחוסר-העקביות
     שבה ספארי ב-iOS מזיז אלמנטים קבועים ביחס למקלדת פתוחה.
     בטאב הזה (תרגול פעיל) שורת הניווט העליונה תמיד מוסתרת, אז אין
     שום דבר שהקריאה הזו צריכה "להתחבא מתחת" אליו.                */
  position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:30
}
.readout .hdr{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:500}
.readout .hdr b{color:var(--ink);font-weight:700}
.readout .tag{
  font-family:var(--he);font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;
  background:var(--paper);color:var(--ink2);letter-spacing:0
}
.readout .tag.new{background:var(--brand-soft);color:var(--brand)}
.readout .live{font-family:var(--mono);font-weight:700;color:var(--ink);font-size:12px;min-width:44px;text-align:end}
.band{
  position:relative;height:9px;margin-top:9px;border-radius:3px;direction:ltr;
  background:linear-gradient(90deg,
    var(--good-soft) 0%, var(--good-soft) 45%,
    var(--gold-soft) 45%, var(--gold-soft) 82%,
    var(--bad-soft)  82%, var(--bad-soft) 100%)
}
.needle{
  position:absolute;top:-3px;bottom:-3px;width:2.5px;border-radius:2px;background:var(--good);
  left:0;transition:left .1s linear
}
.needle.mid{background:var(--gold)} .needle.slow{background:var(--bad)}
.readout .ticks{
  display:flex;justify-content:space-between;direction:ltr;font-family:var(--mono);
  font-size:9.5px;color:var(--ink4);margin-top:4px;letter-spacing:-.02em
}

/* ---------- stage ---------- */
.prompt{
  background:var(--card);border:2px solid var(--line);border-radius:var(--r-xl);
  padding:30px 20px;text-align:center;box-shadow:var(--sh);min-height:158px;
  display:flex;flex-direction:column;justify-content:center;gap:9px
}
.prompt .kicker{
  font-size:10.5px;font-weight:800;letter-spacing:.13em;color:var(--blue);
  text-transform:uppercase;margin-bottom:2px
}
.prompt .big{
  font-family:var(--en);font-size:3.1rem;font-weight:700;letter-spacing:-.035em;
  line-height:1.02;direction:ltr;font-variation-settings:'opsz' 72
}
.prompt .big.he{font-family:var(--he);font-size:2rem;direction:rtl;letter-spacing:-.02em;font-weight:700}
.prompt .med{font-family:var(--en);font-size:1.42rem;font-weight:600;direction:ltr;line-height:1.35;font-variation-settings:'opsz' 32}
.prompt .med.he{font-family:var(--he);direction:rtl;font-weight:700}
.prompt .small{font-size:.85rem;color:var(--ink2)}
.prompt .letterpair{display:flex;gap:16px;justify-content:center;align-items:baseline;font-family:var(--en);direction:ltr}
.prompt .letterpair b{font-size:4.4rem;font-weight:800;line-height:.95;font-variation-settings:'opsz' 96;letter-spacing:-.04em}
.prompt .letterpair span{font-size:2.7rem;font-weight:500;color:var(--ink3);line-height:.95}

.opts{display:grid;gap:8px;margin-top:12px}
/* אפשרות בחירה — אותה שפה של "מדף" תלת-ממדי כמו הכפתורים, אבל
   נמוכה ורגועה יותר (--press קטן משלה) כי יש כמה מהן זו לצד זו,
   ורק אחרי שנבחרות הן מקבלות את הצבע המלא (ירוק/אדום) עם ה"מדף". */
.opt{
  background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:15px 16px;text-align:start;font-weight:700;font-size:1.03rem;width:100%;
  box-shadow:0 3px 0 var(--line);transform:translateY(0);
  transition:transform .06s ease-out, box-shadow .06s ease-out, border-color .1s, background .1s
}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--brand2);box-shadow:0 3px 0 var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:#d63c3c;box-shadow:0 3px 0 var(--bad)}
.opt .hint{display:block;font-size:.76rem;font-weight:500;color:var(--ink3);margin-top:3px}

.answerbox{display:flex;gap:10px;margin-top:12px;scroll-margin-top:calc(env(safe-area-inset-top) + 70px);scroll-margin-bottom:16px}
.answerbox+.btn.ghost{margin-top:8px;width:100%}
.answerbox input{
  flex:1;padding:16px 15px;border:2px solid var(--line);border-radius:var(--r);
  background:var(--card);font-family:var(--en);direction:ltr;text-align:left;
  font-size:1.15rem;font-weight:700;outline:none;min-width:0
}
.answerbox input::placeholder{color:var(--ink4);font-weight:400}
.answerbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.answerbox input.ok{border-color:var(--good);background:var(--good-soft)}
.answerbox input.no{border-color:var(--bad);background:var(--bad-soft)}
.answerbox .btn{width:auto;flex:none;padding:0 20px;border-radius:var(--r);white-space:nowrap}

.tiles{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center}
.tile{
  font-family:var(--en);direction:ltr;background:var(--card);border:1.5px solid var(--line);
  border-radius:10px;padding:10px 13px;font-size:1.05rem;font-weight:600;transition:.11s
}
.tile:active{transform:scale(.93)}
.tile.used{opacity:.22;pointer-events:none}
.slot{
  min-height:60px;background:var(--brand-soft);border:1.5px dashed var(--brand);border-radius:12px;
  padding:9px;display:flex;flex-wrap:wrap;gap:7px;direction:ltr;align-items:center;margin-top:12px
}
.slot .tile{background:var(--card);border-color:var(--brand)}
.slot.ok{background:var(--good-soft);border-color:var(--good);border-style:solid}
.slot.no{background:var(--bad-soft);border-color:var(--bad);border-style:solid}
.slot:empty::after{content:'סדרו כאן את המילים';direction:rtl;font-family:var(--he);color:var(--brand);font-size:.83rem;padding:6px;opacity:.75}

.cloze{font-family:var(--en);direction:ltr;font-size:1.4rem;font-weight:600;line-height:1.65}
.cloze u{color:var(--brand);text-decoration:none;border-bottom:2.5px solid var(--brand);padding:0 24px}
.proof{font-family:var(--en);direction:ltr;font-size:1.3rem;font-weight:600;line-height:1.8;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.pw{padding:3px 6px;border-radius:7px;border:1.5px solid transparent;transition:.11s}
.pw.ok{border-color:var(--good);background:var(--good-soft)}
.pw.no{border-color:var(--bad);background:var(--bad-soft)}

.fb{border-radius:var(--r);padding:15px;margin-top:12px;border:1px solid;animation:pop .22s ease-out;scroll-margin-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 20px)}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .hd{font-weight:800;font-size:.93rem;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb.ok .hd{color:var(--good)} .fb.no .hd{color:var(--bad)}
.fb .bd{font-size:.87rem;color:var(--ink2);line-height:1.6}
.fb .bd b{color:var(--ink)}

.speakbtn{
  width:60px;height:60px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;margin:0 auto;border:1.5px solid var(--brand);flex:none;transition:.12s
}
.speakbtn:active{transform:scale(.92)}
.speakbtn svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.speakbtn.rec{background:var(--live);color:#fff;border-color:var(--live);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,54,.5)}70%{box-shadow:0 0 0 16px rgba(255,90,54,0)}}

/* ============================================================
   סרגל הפעולה — הפעולה הראשית תמיד מתחת לאגודל
   ============================================================ */
.actionbar{
  position:fixed;bottom:0;inset-inline-start:var(--side);inset-inline-end:0;z-index:60;background:var(--card);
  border-top:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 10px);
  transition:transform .15s ease-out
}
.actionbar-in{max-width:var(--shell);margin:0 auto;display:flex;gap:9px;align-items:center}
.actionbar-in>.btn{
  /* חשוב: .btn כולל width:100%. עם flex-basis:auto זה נהיה 100% מרוחב הסרגל
     והכפתור השני נדחף אל מחוץ למסך. אפס בסיס + אפשרות לכיווץ פותר את זה. */
  flex:1 1 0; width:auto; min-width:0; white-space:nowrap;
  padding-inline:12px; font-size:.95rem
}

/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:13px;text-align:center}
.stat .n{font-family:var(--mono);font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--brand2)}
.stat .l{font-size:.72rem;color:var(--ink3);margin-top:4px;font-weight:700;line-height:1.3}
.bars{display:flex;align-items:flex-end;gap:3px;height:76px;margin-top:8px}
.bars>div{flex:1;background:var(--line);border-radius:3px 3px 0 0;min-height:3px}
.bars>div.hot{background:var(--brand)}
.legend{display:flex;justify-content:space-between;font-size:10px;color:var(--ink4);margin-top:6px;font-family:var(--mono)}
.wordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.wordrow:last-child{border-bottom:0}
.wordrow .w{font-family:var(--en);direction:ltr;font-weight:600;flex:1;min-width:0;font-size:.95rem}
.wordrow .h{color:var(--ink3);font-size:.83rem;flex:1;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.badge{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:5px;background:var(--paper);color:var(--ink2);flex:none;font-weight:500}
.progline{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.progline>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}

/* ---------- users ---------- */
.userpick{display:grid;gap:9px}
.usercard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;text-align:start;width:100%;transition:.14s}
.usercard:active{transform:scale(.985)}
.usercard.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.usercard .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden}
.avpickgrid{display:flex;flex-wrap:wrap;gap:9px}
.avpick{width:52px;height:52px;border-radius:50%;padding:0;background:none;border:3px solid transparent;
  transition:transform .1s,border-color .1s}
.avpick.on{border-color:var(--ink)}
.avpick:active{transform:scale(.92)}
/* תג עריכה קטן שמסמן שהאווטאר בגיליון הפרופיל ניתן ללחיצה לשינוי */
.avedit{
  position:absolute;bottom:-2px;inset-inline-end:-2px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center;
  border:2px solid var(--card)
}
.field{margin-bottom:13px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);outline:none}
.field input:focus,.field select:focus{border-color:var(--brand)}
.seg{display:flex;gap:4px;background:var(--paper);border-radius:11px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:.83rem;font-weight:700;color:var(--ink3);transition:.13s}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--sh)}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(6,14,17,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;backdrop-filter:blur(3px);transition:transform .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);width:100%;max-width:var(--shell);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:90dvh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--brand-soft);color:var(--brand)}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.ruleblk{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px;font-size:.87rem;line-height:1.65}
.ruleblk .ex{font-family:var(--en);direction:ltr;font-weight:600;margin-top:7px;display:block;font-size:.97rem}
.toast{position:fixed;bottom:calc(var(--bar) + 22px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:11px;font-size:.87rem;font-weight:700;z-index:200;animation:pop .2s;box-shadow:var(--sh-lift)}

.confetti-host{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti-piece{position:absolute;top:-20px;width:9px;height:14px;animation:confetti-fall linear forwards}
@keyframes confetti-fall{
  0%{transform:translate(0,0) rotate(0deg);opacity:1}
  100%{transform:translate(var(--x), 112vh) rotate(var(--rot));opacity:.9}
}

/* ---------- מסך נעילה ומקלדת קוד ---------- */
.lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 24px calc(env(safe-area-inset-bottom) + 30px);max-width:var(--shell);margin:0 auto}
.lock .who{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  overflow:hidden;margin-bottom:14px}
.dots{display:flex;gap:13px;justify-content:center;margin:20px 0 26px;direction:ltr}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--line);transition:.15s}
.dots i.on{background:var(--brand);transform:scale(1.15)}
.dots.err i{background:var(--bad)}
.dots.err{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
/* מקלדת המספרים תמיד LTR — כמו כל מקלדת חיוג, גם בתוך ממשק עברי.
   ב-RTL כללי, גריד ממלא מימין לשמאל וההגרלה 1-2-3 הייתה יוצאת הפוכה. */
.keypad{display:grid;direction:ltr;grid-template-columns:repeat(3,1fr);gap:11px;width:100%;max-width:270px}
.keypad button{aspect-ratio:1;border-radius:50%;background:var(--card);border:1px solid var(--line);
  font-family:var(--mono);font-size:1.45rem;font-weight:700;transition:.1s;display:grid;place-items:center}
.keypad button:active{background:var(--brand-soft);transform:scale(.93)}
.keypad button.blank{background:none;border:0;pointer-events:none}
.keypad button.act{font-family:var(--he);font-size:.85rem;font-weight:700;color:var(--ink3);border:0;background:none}

/* ---------- מתגים ורשימות בקרה ---------- */
.ctrl{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.ctrl:last-of-type{border-bottom:0}
.ctrl .tx{flex:1;min-width:0}
.ctrl .tx b{display:block;font-size:.92rem;font-weight:700}
.ctrl .tx span{font-size:.76rem;color:var(--ink3);line-height:1.45;display:block;margin-top:2px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.18s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--brand)}
.sw.on::after{inset-inline-start:23px}
.stepper{display:flex;align-items:center;gap:9px;flex:none}
.stepper button{width:34px;height:34px;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-size:1.1rem;font-weight:700;display:grid;place-items:center}
.stepper span{font-family:var(--mono);font-weight:700;min-width:34px;text-align:center;font-size:.95rem}
.task{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r);padding:15px}
.task .lbl{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--brand);text-transform:uppercase}
.goalring{display:flex;align-items:center;gap:12px}
.goalring .ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.goalring circle{fill:none;stroke-width:5;stroke-linecap:round}

/* ---------- אותיות ענק לרמה 0 ----------
   כפתור בלי טקסט קריא — רק הצורה, גדולה מספיק לילד בן 4.  */
.optletters{grid-template-columns:1fr 1fr;gap:10px}
.opt.letteropt{
  padding:22px 10px;text-align:center;
  display:grid;place-items:center;min-height:96px
}
.opt.letteropt .en{
  font-size:2.9rem;font-weight:700;line-height:1;
  font-variation-settings:'opsz' 72;letter-spacing:-.03em
}

/* ---------- אסוציאציה ---------- */
.mnem{
  margin-top:10px;padding:10px 12px;border-radius:10px;
  background:var(--gold-soft);border:1px solid var(--gold);
  font-size:.85rem;line-height:1.55;color:var(--ink)
}
.mnem b{color:var(--ink)}

/* ---------- הסבר על סוג תרגיל ---------- */
.intro{
  background:var(--card);border:1px solid var(--brand);border-radius:var(--r-lg);
  padding:24px 18px;text-align:center;box-shadow:var(--sh-lift)
}
.intro .ic{font-size:2.6rem;line-height:1;margin-bottom:12px}
.intro h2{color:var(--brand)}
.intro p{font-size:.9rem;color:var(--ink2);line-height:1.65;margin:0}

/* ---------- מסך פתיחה ---------- */
.welcome{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(env(safe-area-inset-bottom) + 32px);max-width:var(--shell);margin:0 auto}
.welcome .mark{font-family:var(--en);font-weight:800;font-size:clamp(2.3rem,11vw,3.2rem);letter-spacing:-.03em;direction:ltr;line-height:1;white-space:nowrap;margin-top:14px}
.welcome .mark i{font-style:normal;color:var(--brand)}
.welcome .tagline{font-size:1.05rem;color:var(--ink2);margin:14px 0 0;line-height:1.6;max-width:32ch}
.steps{margin:30px 0 0;display:grid}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:2px solid var(--line2)}
.step:last-child{border-bottom:0}
.step .k{
  font-size:20px;flex:none;width:40px;height:40px;border-radius:12px;
  background:var(--blue-soft);display:grid;place-items:center
}
.step b{display:block;font-size:.97rem;margin-bottom:3px;font-weight:800}
.step span{font-size:.83rem;color:var(--ink3);line-height:1.55}

/* ============================================================
   התאמה לגודל מסך
   ------------------------------------------------------------
   הבסיס הוא נייד. כל נקודת עצירה מרחיבה — לא מעצבת מחדש.
   העיקרון: עמודת התוכן גדלה במתינות (טקסט ארוך מדי בשורה קשה
   לקריאה), והמקום העודף במסך רחב הולך לניווט צדי ולפריסה
   דו-טורית — לא למתיחת הכרטיסים לרוחב כל המסך.
   ============================================================ */

/* --- מסכים קטנים מאוד (אייפון SE וכדומה) --- */
@media (max-width:360px){
  :root{--fs:15px}
  .screen{padding-inline:14px}
  .topbar{padding-inline:14px}
  .prompt{padding:22px 14px}
  .prompt .letterpair b{font-size:3.6rem}
  .nav button{font-size:10px}
}

/* --- נייד לרוחב: גובה מוגבל, מכווצים אנכית --- */
@media (max-height:520px) and (orientation:landscape){
  .prompt{min-height:0;padding:16px 18px;gap:5px}
  .prompt .big{font-size:2.2rem}
  .prompt .letterpair b{font-size:2.8rem}
  .prompt .letterpair span{font-size:1.8rem}
  .readout{padding:8px 12px 9px;margin-bottom:9px}
  .welcome{justify-content:flex-start;padding-top:22px}
  .lock{padding-top:16px;justify-content:flex-start}
}

/* --- טאבלט --- */
@media (min-width:700px){
  :root{--shell:660px;--fs:17px}
  .screen{padding-inline:24px}
  .topbar{padding-inline:24px}
  .grid3{gap:10px}
  .prompt{padding:36px 26px;min-height:186px}
}

/* --- שולחן עבודה: הניווט עובר לצד --- */
@media (min-width:1024px){
  :root{--shell:720px;--side:236px;--bar:82px}

  /* הניווט התחתון הופך לסרגל צד מלא-גובה בצד ההתחלה (ימין ב-RTL) */
  .nav{
    inset-block:0;inset-inline-start:0;inset-inline-end:auto;
    width:var(--side);
    border-top:0;border-inline-end:1px solid var(--line);
    padding:26px 14px;display:flex;align-items:center
  }
  .nav-in{grid-template-columns:1fr;gap:5px;width:100%;max-width:none}
  .nav button{
    flex-direction:row;justify-content:flex-start;gap:13px;
    padding:13px 15px;font-size:.92rem;border-radius:12px
  }
  .nav button svg{width:21px;height:21px}
  .nav button.on{background:var(--brand-soft)}
  .nav button:hover:not(.on){background:var(--line2)}

  /* התוכן מפנה מקום לסרגל הצד ונשאר ממורכז בשארית.
     #app מוותר כאן על ה-max-width שלו — אחרת הריפוד לסרגל הצד היה
     נחתך בתוך 720px במקום להסיט את התוכן ממנו.                     */
  #app{max-width:none;padding-inline-start:var(--side)}
  .topbar,.screen{max-width:calc(var(--shell) + 48px);margin-inline:auto;width:100%}

  /* רב-ברירה בשתי עמודות — מנצל את הרוחב בלי למתוח כפתור בודד */
  .opts{grid-template-columns:1fr 1fr}
  .opts .opt{text-align:center}

  /* אזורים שמרוויחים משתי עמודות */
  .ladder{columns:1}
  .userpick{grid-template-columns:1fr 1fr}

  /* מצבי תרגול: רשת במקום ערימה */
  .modegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  .modegrid .card+.card{margin-top:0}

  /* גיליון תחתון הופך לחלון ממורכז */
  .sheet-bg{align-items:center}
  .sheet{
    border-radius:var(--r-xl);max-height:84dvh;
    padding:22px 24px 26px;max-width:640px;
    animation:popIn .24s cubic-bezier(.2,.9,.3,1)
  }
  .sheet .grab{display:none}
  @keyframes popIn{from{opacity:0;transform:scale(.97) translateY(10px)}to{opacity:1;transform:none}}

  /* עכבר: משוב ריחוף שלא קיים במגע */
  .rung:not(.locked):hover{border-color:var(--brand)}
  .opt:hover{border-color:var(--brand)}
  .usercard:hover{border-color:var(--brand)}
  .btn:hover{filter:brightness(1.06)}
  .tile:hover{border-color:var(--brand)}
}

/* --- מסך רחב --- */
@media (min-width:1440px){
  :root{--shell:800px;--fs:18px}
  .grid2{gap:12px}
}

/* --- מסך רחב מאוד: מגבילים כדי שהשורה לא תתארך מדי --- */
@media (min-width:1800px){
  :root{--shell:840px}
}

/* תוכן עברי בתוך ממשק אנגלי: מבודדים כיוון כדי שפיסוק וסוגריים
   לא יקפצו לצד הלא נכון. תרגומי המילים נשארים עבריים תמיד, ולכן
   הם מופיעים גם כשהממשק LTR.                                     */
[dir="ltr"] .hetext,
[dir="ltr"] .h{ direction:rtl; unicode-bidi:isolate; display:inline-block }
/* ל-.hint אסור לקבל display כאן: הוא כבר block בתוך כפתור אפשרות
   (השורה השנייה, מתחת למילה האנגלית). הכלל הזה מופיע מאוחר יותר
   בקובץ ובאותה ספציפיות, ולכן inline-block היה גובר וגורם לתרגום
   העברי להידבק לצד המילה במקום לרדת שורה — רק במצב ממשק אנגלי.
   כאן מבודדים כיוון בלבד, בלי לגעת בפריסה.                      */
[dir="ltr"] .hint{ direction:rtl; unicode-bidi:isolate }
[dir="ltr"] .prompt .big.he,
[dir="ltr"] .prompt .med.he{ direction:rtl; unicode-bidi:isolate }
[dir="ltr"] .ruleblk{ direction:rtl; unicode-bidi:isolate; text-align:right }
[dir="ltr"] .ruleblk .ex{ direction:ltr; text-align:left }
[dir="ltr"] .mnem{ direction:rtl; unicode-bidi:isolate; text-align:right }

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
</style>
</head>

   ------------------------------------------------------------
   העיקרון: העברית היא שפת המקור בקוד, והמפתח במילון הוא המחרוזת

     • אין צורך להמציא מפתחות ולתחזק אותם
     • תרגום חסר נופל אוטומטית לעברית במקום להציג מפתח שבור

   חשוב: רק טקסט *ממשק* עטוף ב-T(). התוכן הלימודי — תרגומי מילים,
   משפטי דוגמה, הסברי דקדוק — לעולם לא מתורגם, כי הוא הנלמד עצמו.
   ============================================================ */

const K_LANG='ladder.lang';
let UI_LANG = 'he';   /* נקבע מחדש מהמשתמש הפעיל בכל render */

function T(s){
  if(UI_LANG!=='en') return s;
  const v = EN_UI[s];
  return v===undefined ? s : v;
}

/* החלת השפה על המסמך: כיוון, שפה, ומחלקה שמאפשרת כללי CSS ייעודיים.
   כל ה-CSS כבר כתוב בתכונות לוגיות (inset-inline-start וכו'), ולכן
   היפוך הכיוון עובד בלי כללים כפולים.                              */
function applyLang(){
  const u = (typeof me==='function') ? me() : null;
  UI_LANG = (u && u.settings && u.settings.lang)
            ? u.settings.lang
            : (typeof Store!=='undefined' ? Store.get(K_LANG,'he') : 'he');
  const html=document.documentElement;
  html.setAttribute('lang', UI_LANG==='en' ? 'en' : 'he');
  html.setAttribute('dir',  UI_LANG==='en' ? 'ltr' : 'rtl');
  html.dataset.uilang = UI_LANG;
}

(function realignPhonicsOverlap(){
  const already = new Set([...PHONICS.map(p=>p.w), ...LETTERS.map(l=>l.ex)].map(w=>w.toLowerCase()));

})();

function normalise(u){
  u.srs=u.srs||{}; u.log=u.log||[]; u.mastered=u.mastered||{}; u.seenTypes=u.seenTypes||{};
  u.code = u.code||null; u.role = u.role||'learner'; u.task = u.task||null;
  u.ctrl = Object.assign({daily:0,cap:0,lockLevel:false,lockData:false,mic:true,modes:null}, u.ctrl||{});
  u.lv=u.lv||0; u.xp=u.xp||0; u.streak=u.streak||0;
  u.settings=Object.assign({tts:true,autoSpeak:true,speed:.95,pitch:1,voice:null,theme:'auto',size:'m',lang:'he'}, u.settings||{});
  /* מיגרציה חד-פעמית מהאימוג'י הישן לסמל החדש. לא מייבאים כאן את
     AVATARS המלא (מוגדר מאוחר יותר בקובץ, ולוקח id+bg+svg) — רק
     רשימת המזהים, כדי ש-normalise יעבוד גם כשהוא רץ ראשון באתחול,
     לפני שהקבוע ההוא בכלל אותחל. הבחירה יציבה לכל משתמש (מבוססת
     על ה-id שלו), כדי שלא "תקפוץ" בכל רענון — רק פעם אחת, ואפשר
     לשנות אותה בכל רגע דרך הפרופיל.                              */
  if(!u.avatar){
    const ids=['star','rocket','bolt','book','music','controller','trophy','gem','crown','heart','paw','planet','compass','flag','headphones','target'];
    let hh=0; for(const c of u.id||'x') hh=(hh*31+c.charCodeAt(0))|0;
    u.avatar = ids[Math.abs(hh)%ids.length];
  }
  return u;
}

/* --- SM-2 עם משקל שטף --- */
/* q: 0-5. אנחנו מחשבים אותו משילוב של נכונות + זמן תגובה. */
function grade(correct, ms, target){
  if(!correct) return ms<1500?2:1;          // טעות מהירה = כמעט ידע, טעות איטית = לא יודע
  const r = ms/target;
  if(r<=.6) return 5;                        // שליפה מיידית
  if(r<=1)  return 4;                        // בטווח היעד
  if(r<=1.8)return 3;                        // נכון אבל עם היסוס
  return 3;
}

function review(u, itemId, correct, ms, target){
  const q = grade(correct, ms, target);
  let c = u.srs[itemId] || {ef:2.5, iv:0, rep:0, due:dayNum(), seen:0, ok:0, ms:0};
  c.seen++; if(correct) c.ok++;
  c.ms = c.ms ? Math.round(c.ms*.65 + ms*.35) : ms;   // ממוצע נע של זמן שליפה
  if(q<3){ c.rep=0; c.iv=0; }                        // נפילה — חוזרים לאותו יום
  else{
    c.rep++;
    c.iv = c.rep===1?1 : c.rep===2?3 : Math.round(c.iv*c.ef);
    c.ef = Math.max(1.3, c.ef + (0.1 - (5-q)*(0.08+(5-q)*0.02)));
  }
  c.due = dayNum() + c.iv;
  c.last = dayNum();
  u.srs[itemId] = c;
  return {q, card:c};
}

/* מיומנות פריט: 0-1 */
const strength = c => !c ? 0 : Math.min(1, Math.min(1,c.rep/3)*.55 + (c.ok/Math.max(1,c.seen))*.45);

/* --- מאגר פריטים לפי רמה --- */
function poolFor(lv){
  const p = [];
  /* רמה 0 — זיהוי צורה וצליל בלבד. אין קריאת מילים: ילד בן 4-5
     לא יכול לזהות "איזו מילה מתחילה באות" לפני שהוא קורא בכלל. */
  if(lv<=1) LETTERS.forEach(x=>{
    p.push({t:'letter-hear', id:'L:'+x.u+'#h', d:x, lv:0});
    p.push({t:'letter-case', id:'L:'+x.u+'#c', d:x, lv:0});
    p.push({t:'letter-name', id:'L:'+x.u+'#n', d:x, lv:0});
  });
  /* שיוך אות למילה דורש קריאה — ולכן שייך לרמה 1, לא ל-0.
     חייב גם גבול עליון: זו מיומנות הקריאה הבסיסית ביותר, ואין
     סיבה שלומד שכבר בונה משפטים (רמה 3+) יתרגל "איזו מילה
     מתחילה ב-W". שאר תרגילי היסוד כבר נגמרים מעצמם — letter-hear
     ו-letter-case ב-lv<=1, phonics ב-lv<=3 — וזה היה היחיד בלי
     תקרה, ולכן המשיך להופיע גם ברמה 4 ומעלה.                    */
  if(lv>=1 && lv<=2) LETTERS.forEach(x=>p.push({t:'letter', id:'L:'+x.u, d:x, lv:1}));
  if(lv>=1 && lv<=3) PHONICS.forEach(x=>p.push({t:'phonics',id:'P:'+x.w, d:x, lv:1}));
  WORDS.filter(w=>w.lv<=lv).forEach(w=>{
    p.push({t:'w-recog', id:w.id+'#r', d:w, lv:w.lv});
    p.push({t:'w-recall',id:w.id+'#p', d:w, lv:w.lv});
    if(w.core){ if(w.lv<=5) p.push({t:'w-listen',id:w.id+'#l', d:w, lv:w.lv}); return; }
    if(w.lv>=2) p.push({t:'w-listen',id:w.id+'#l', d:w, lv:w.lv});
    if(w.lv>=3) p.push({t:'w-speak', id:w.id+'#s', d:w, lv:w.lv});
  });
  CONJUG.filter(c=>c.lv<=lv).forEach(c=>
    p.push({t:'conjug', id:'J:'+c.base+'#'+c.tense+'#'+c.subj, d:c, lv:c.lv}));
  IRREG.filter(v=>v.lv<=lv).forEach(v=>{
    p.push({t:'irr-past', id:'V:'+v.base+'#p', d:v, lv:v.lv});
    p.push({t:'irr-pp',   id:'V:'+v.base+'#3', d:v, lv:v.lv});
  });
  const key = s => s.slice(0,28);
  SENTS.filter(s=>s.lv<=lv).forEach(s=>{
    p.push({t:'build',  id:'S:'+key(s.en)+'#b', d:s, lv:s.lv});
    p.push({t:'dictate',id:'S:'+key(s.en)+'#d', d:s, lv:s.lv});
  });
  CLOZE.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'cloze', id:'C:'+key(c.s), d:c, lv:c.lv}));
  PROOF.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'proof', id:'F:'+key(c.s), d:c, lv:c.lv}));
  GRAMMAR.filter(g=>g.lv<=lv).forEach(g=>p.push({t:'rule', id:'G:'+key(g.ti), d:g, lv:g.lv}));
  TALK.filter(t=>t.lv<=lv).forEach(t=>p.push({t:'talk', id:'T:'+key(t.q), d:t, lv:t.lv}));
  MINPAIRS.filter(m=>m.lv<=lv).forEach(m=>{
    p.push({t:'mp-hear', id:'M:'+m.a+'-'+m.b+'#h', d:m, lv:m.lv});
    if(lv>=3) p.push({t:'mp-say', id:'M:'+m.a+'-'+m.b+'#s', d:m, lv:m.lv});
  });
  CONTRACT.filter(c=>c.lv<=lv).forEach(c=>p.push({t:'contract', id:'K:'+key(c.full), d:c, lv:c.lv}));
  SPOKEN.filter(s=>s.lv<=lv).forEach(s=>p.push({t:'spoken', id:'R:'+s.sp, d:s, lv:s.lv}));
  return p;
}

/* יעד זמן שליפה לפי סוג התרגיל (מילישניות) */
const TARGET = {'letter-hear':6000,'letter-case':6000,'letter-name':8000,letter:2500,phonics:3500,'w-recog':3000,'w-recall':5000,'w-listen':6000,
                'w-speak':6000,build:15000,dictate:14000,cloze:6000,proof:9000,rule:8000,talk:20000,
                'mp-hear':4000,'mp-say':7000,contract:5000,spoken:6000,'irr-past':5000,'irr-pp':5000,conjug:6000};

/* --- בניית סשן: חזרות שנדרשות קודם, ואז חומר חדש, בשילוב מסוגים שונים --- */
function buildSession(u, size, mode){
  const pool = poolFor(u.lv);
  const d = dayNum();
  let due=[], fresh=[], weak=[];
  pool.forEach(it=>{
    const c=u.srs[it.id];
    if(!c) fresh.push(it);
    else if(c.due<=d) (strength(c)<.35?weak:due).push(it);
  });
  // מילוי: אם אין מספיק פריטים שהגיע זמנם, מקדימים את החלשים ביותר
  const fill = (list, sub) => {
    if(list.length>=size) return list.slice(0,size);
    const extra = shuffle(sub.filter(x=>!list.includes(x)))
      .sort((a,b)=>strength(u.srs[a.id])-strength(u.srs[b.id]));
    return [...list, ...extra].slice(0,size);
  };

  if(mode==='weak'){
    const s=[...weak,...due].sort((a,b)=>strength(u.srs[a.id])-strength(u.srs[b.id]));
    return interleave(fill(s, pool));
  }
  if(mode==='letters'){
    const L=pool.filter(x=>x.t.startsWith('letter'));
    return L.length? interleave(capTypes(shuffle(L),size)) : buildSession(u,size,'mix');
  }
  if(mode==='tenses'){
    const t=pool.filter(x=>x.t==='conjug');
    return t.length? interleave(capTypes(shuffle(t),size)) : buildSession(u,size,'mix');
  }
  if(mode==='irregular'){
    const v=pool.filter(x=>x.t==='irr-past'||x.t==='irr-pp');
    return v.length? interleave(shuffle(v).slice(0,size)) : buildSession(u,size,'mix');
  }
  if(mode==='sound'){
    const s=pool.filter(x=>['mp-hear','mp-say','spoken','phonics','w-listen','w-speak','dictate'].includes(x.t));
    return s.length? interleave(capTypes(shuffle(s),size)) : buildSession(u,size,'mix');
  }
  if(mode==='talk'){
    const t=pool.filter(x=>x.t==='talk');
    return t.length? shuffle(t).slice(0,size) : buildSession(u,size,'mix');
  }
  if(mode==='rules'){
    const g=pool.filter(x=>['rule','cloze','proof','build','contract'].includes(x.t));
    return g.length? interleave(capTypes(shuffle(g),size)) : buildSession(u,size,'mix');
  }

  shuffle(due); shuffle(fresh); shuffle(weak);
  // מיקס: ~40% חלשים, ~40% לחזרה, ~30% חדש — ומה שחסר מושלם מהמאגר
  const want = [...weak.slice(0,Math.ceil(size*.4)), ...due.slice(0,Math.ceil(size*.4)), ...fresh.slice(0,Math.ceil(size*.3))];
  const rest = shuffle([...fresh, ...due, ...weak]).filter(x=>!want.includes(x));
  return interleave(capTypes([...want, ...rest, ...shuffle(pool)], size));

/* אף סוג תרגיל לא תופס יותר מ־35% מהסשן — כדי שלא ייצא סשן של מילים בלבד */
}
function capTypes(cands, size){
  const cap=Math.max(2,Math.ceil(size*.35)), cnt={}, out=[], seen=new Set();
  for(const x of cands){
    if(out.length>=size) break;
    if(seen.has(x.id)) continue;
    if((cnt[x.t]||0)>=cap) continue;
    cnt[x.t]=(cnt[x.t]||0)+1; seen.add(x.id); out.push(x);
  }
  for(const x of cands){ if(out.length>=size) break; if(seen.has(x.id)) continue; seen.add(x.id); out.push(x); }
  return out;
}

/* שזירה — לא שני תרגילים מאותו סוג ברצף (Interleaving) */
function interleave(arr){
  const out=[]; const rem=[...arr];
  while(rem.length){
    let i = rem.findIndex(x=>!out.length || x.t!==out[out.length-1].t);
    if(i<0) i=0;
    out.push(rem.splice(i,1)[0]);
  }
  return out;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n,not){ return shuffle(arr.filter(x=>x!==not)).slice(0,n); }

/* מסיחים ייחודיים: אף אפשרות לא תוצג עם אותו טקסט כמו התשובה הנכונה,
   ואף שתי אפשרויות לא יהיו זהות זו לזו. בלי זה, שתי מילים שחולקות תרגום
   (boy/child = "ילד") יוצרות שאלה שאי אפשר לענות עליה נכון.            */
function distractors(pool, correct, textOf, n){
  const seen=new Set([textOf(correct)]), out=[];
  for(const x of shuffle([...pool])){
    if(x===correct) continue;
    const t=textOf(x);
    if(!t || seen.has(t)) continue;
    seen.add(t); out.push(x);
    if(out.length>=n) break;
  }
  return out;
}

/* --- שליטה ברמה --- */
function levelPct(u, lv){
  const all = poolFor(lv);
  const own = all.filter(x=>x.lv===lv);
  const set = own.length?own:all;
  if(!set.length) return 0;
  const s = set.reduce((a,x)=>a+strength(u.srs[x.id]),0);
  return Math.round(100*s/set.length);
}
function checkPromote(u){
  const pct = levelPct(u, u.lv);
  u.mastered[u.lv]=pct;
  if(pct>=LEVELS[u.lv].need && u.lv<LEVELS.length-1){ u.lv++; return true; }
  return false;
}

/* --- רצף ימים ולוג --- */
function touchDay(u, correct, ms){
  const t=today();
  if(u.lastDay!==t){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    u.streak = (u.lastDay===y)?u.streak+1:1;
    u.lastDay=t;
  }
  let e = u.log.find(x=>x.d===t);
  if(!e){ e={d:t,n:0,ok:0,ms:0}; u.log.push(e); if(u.log.length>400) u.log.shift(); }
  e.n++; if(correct) e.ok++; e.ms = Math.round((e.ms*(e.n-1)+ms)/e.n);
}

/* --- ניתוח לדשבורד --- */
function analyse(u){
  const items = Object.entries(u.srs);
  const known = items.filter(([,c])=>strength(c)>=.7).length;
  const learning = items.filter(([,c])=>strength(c)>0 && strength(c)<.7).length;
  const accAll = items.reduce((a,[,c])=>a+c.ok,0) / Math.max(1, items.reduce((a,[,c])=>a+c.seen,0));
  const msArr = items.filter(([,c])=>c.ms).map(([,c])=>c.ms);
  const avgMs = msArr.length? Math.round(msArr.reduce((a,b)=>a+b,0)/msArr.length) : 0;
  const wordCards = items.filter(([k])=>k.startsWith('w:'));
  const vocab = new Set(wordCards.filter(([,c])=>strength(c)>=.7).map(([k])=>k.split('#')[0])).size;
  // נקודות חולשה לפי סוג תרגיל
  const byType={};
  poolFor(u.lv).forEach(it=>{ const c=u.srs[it.id]; if(!c)return;
    byType[it.t]=byType[it.t]||{ok:0,n:0}; byType[it.t].ok+=c.ok; byType[it.t].n+=c.seen; });
  const weakTypes = Object.entries(byType).filter(([,v])=>v.n>=4)
      .map(([t,v])=>({t, acc:v.ok/v.n})).sort((a,b)=>a.acc-b.acc).slice(0,3);
  // מילים בעייתיות
  const weakWords = items.filter(([k,c])=>k.startsWith('w:') && c.seen>=2 && strength(c)<.45)
      .map(([k,c])=>({w:k.split(':')[1].split('#')[0], c}))
      .sort((a,b)=>strength(a.c)-strength(b.c)).slice(0,12);
  const dueNow = poolFor(u.lv).filter(it=>{const c=u.srs[it.id];return c&&c.due<=dayNum()}).length;
  return {known, learning, accAll, avgMs, vocab, weakTypes, weakWords, dueNow, total:items.length};
}

const TYPE_HE = {'letter-hear':'זיהוי אות בשמיעה','letter-case':'גדולה וקטנה','letter-name':'שם האות',letter:'אות ומילה',phonics:'פונטיקה','w-recog':'זיהוי מילים','w-recall':'שליפת מילים',
 'w-listen':'הבנת הנשמע','w-speak':'הגייה',build:'בניית משפט',dictate:'הכתבה',cloze:'השלמה',
 proof:'הגהה',rule:'חוקי דקדוק',talk:'שיחה','mp-hear':'אבחנת צלילים','mp-say':'הגייה מדויקת',
 contract:'קיצורים',spoken:'דיבור מהיר','irr-past':'פועל חריג · עבר','irr-pp':'פועל חריג · שלישית',conjug:'הטיית זמן'};

/* --- דיבור --- */
/* דירוג קולות: הדפדפן מחזיר גם קולות דחוסים ("compact") שנשמעים מתכתיים.
   אנחנו מדרגים ובוחרים את הטבעי ביותר שזמין במכשיר.                      */
let VOICES=[], WARM=false;

/* סדר העדפה שמי. Ava היא הקול הטבעי ביותר של Apple לאנגלית אמריקאית,
   ולכן היא ראשונה. iOS לא תמיד מוסיף את הסיומת (Premium) לשם, ולכן
   ההתאמה נעשית לפי השם עצמו ולא רק לפי המילה "premium".               */
const PREF_NAMES = ['ava','allison','samantha','zoe','susan','evan','nathan',
                    'joelle','tom','aria','jenny','sonia','libby','emma'];
const JUNK = /compact|eloquence|espeak|pico|novelty|whisper|zarvox|albert|bad news|bells|organ|cellos|trinoids|boing|bubbles|jester|superstar|wobble|bahh/;

function voiceScore(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase();
  let s=0;
  if(/premium/.test(n))                 s+=70;
  if(/enhanced|neural|natural/.test(n)) s+=55;
  if(/siri/.test(n))                    s+=45;
  if(/google/.test(n))                  s+=35;
  const pi = PREF_NAMES.findIndex(p=>new RegExp('\\b'+p+'\\b').test(n));
  if(pi>=0) s += 60 - pi*4;
  if(JUNK.test(n))                      s-=90;
  if(l.startsWith('en-us')) s+=12; else if(l.startsWith('en-gb')) s+=8;
  if(v.localService===false) s+=6;
  if(v.default)              s+=3;
  return s;
}
const voiceTier = v => { const s=voiceScore(v); return s>=110?'premium' : s>=55?'good' : s<0?'junk' : 'plain'; };

/* iOS לפעמים מחזיר רשימה ריקה או חלקית עד שהקולות נטענים. מנסים שוב. */
let voiceTries=0;
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  VOICES = all.filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  if(!VOICES.length && voiceTries++ < 14) setTimeout(loadVoices, 400);
}
function pickVoice(){
  const want = me()&&me().settings ? me().settings.voice : null;
  if(want){
    const exact = VOICES.find(v=>v.name===want);
    if(exact) return exact;
    /* אם המערכת שינתה את שם הקול (למשל Ava (Premium) → Ava), מתאימים לפי השם הפרטי */
    const tok = want.toLowerCase().split(/[\s(]/)[0];
    const nearby = VOICES.find(v=>v.name.toLowerCase().startsWith(tok));
    if(nearby) return nearby;
  }
  return VOICES[0] || null;
}
const findAva = () => VOICES.find(v=>/\bava\b/i.test(v.name));

if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }

/* iOS/Safari חוסמים דיבור עד למגע ראשון. משחררים בשקט. */
function warmUp(){
  if(WARM || !window.speechSynthesis) return;
  WARM=true;
  try{ const w=new SpeechSynthesisUtterance(' '); w.volume=0; speechSynthesis.speak(w); }catch(e){}
  if(!VOICES.length) loadVoices();
}
addEventListener('touchstart', warmUp, {once:true, passive:true});
addEventListener('mousedown',  warmUp, {once:true});

/* קול המכשיר — נשאר כברירת מחדל וכגיבוי לקול הענן */
function sayDevice(text, rate){
  if(!window.speechSynthesis || !text) return false;
  try{
    warmUp();
    speechSynthesis.cancel();
    const s=me()?.settings||{};
    const u2=new SpeechSynthesisUtterance(String(text));
    const v=pickVoice();
    if(v){ u2.voice=v; u2.lang=v.lang; } else u2.lang='en-US';
    u2.rate  = rate || s.speed || .95;
    u2.pitch = s.pitch != null ? s.pitch : 1;
    u2.volume= 1;
    speechSynthesis.speak(u2);
    return true;
  }catch(e){ return false; }
}

/* נקודת הכניסה היחידה לכל הקוד. אם קול הענן מוגדר ופעיל — משתמשים בו,
   ואם הוא נכשל מכל סיבה (אין רשת, API כבוי, מפתח מוגבל) נופלים מיד
   לקול המכשיר, כדי שתרגיל האזנה לעולם לא יישאר שקט.                 */
function say(text, rate){
  if(!text) return false;
  /* כל בקשה חדשה מבטלת את הקודמת — גם בקול המכשיר וגם בענן */
  const tok = (typeof sayToken==='function') ? sayToken() : 0;
  if(typeof ttsReady==='function' && ttsReady()){
    if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
    sayCloud(text, rate, tok).catch(()=>{
      /* נופלים לקול המכשיר רק אם זו עדיין השאלה הנוכחית */
      if(typeof sayCurrent!=='function' || sayCurrent(tok)) sayDevice(text, rate);
    });
    return true;
  }
  if(typeof stopAudio==='function') stopAudio();
  return sayDevice(text, rate);
}

/* עצירה מוחלטת של כל אודיו: מבטלת גם בקשות ענן שעדיין בדרך,
   כי הטוקן שלהן כבר לא יהיה העדכני.                            */
function stopAllAudio(){
  if(typeof sayToken==='function') sayToken();
  if(typeof stopAudio==='function') stopAudio();
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
}

/* --- קודי כניסה ובקרת הורים --- */
/* חשוב: זה שער, לא מנעול. הכול רץ בדפדפן, ומי שיודע לפתוח כלי מפתחים
   יעקוף את זה. המטרה היא למנוע מאח קטן להיכנס לפרופיל של אחיו או לקפוץ רמה,
   לא להגן מפני תוקף.                                                        */
const hashCode = s => { let h=5381; for(const c of String(s)) h=(((h*33)^c.charCodeAt(0))>>>0); return h.toString(36); };
const codeOk   = (u,c) => !!u.code && u.code===hashCode(c);
const parents  = () => USERS.filter(u=>u.role==='parent' && u.code);

/* ספירת פריטים שנעשו היום — לצורך יעד ומגבלה */
function doneToday(u){ const e=u.log.find(x=>x.d===today()); return e?e.n:0; }
function capLeft(u){ return u.ctrl.cap ? Math.max(0, u.ctrl.cap - doneToday(u)) : Infinity; }
function modeAllowed(u,m){ return !u.ctrl.modes || u.ctrl.modes.includes(m); }

/* --- זיהוי דיבור --- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* מעקב אחרי הפעלת ההאזנה הפעילה. בלי זה, מעבר לשאלה הבאה — גם אחת
   שלא נוגעת במיקרופון בכלל — לא היה מפסיק סשן זיהוי דיבור שנשאר תלוי
   מהשאלה הקודמת, וה-iOS ממשיך להראות את המיקרופון כפעיל.            */
let ACTIVE_REC = null;
function stopListening(){
  if(ACTIVE_REC){ try{ ACTIVE_REC.abort(); }catch(e){} ACTIVE_REC=null; }
}
function listen(onResult, onEnd){
  if(!SR) return null;
  stopListening();  // ליתר ביטחון — לא אמור להיות סשן קודם, אבל לא מזיקה
  const r=new SR();
  r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
  r.onresult=e=>{ onResult([...e.results[0]].map(a=>a.transcript)); };
  r.onerror=()=>{ if(ACTIVE_REC===r) ACTIVE_REC=null; onEnd&&onEnd(); };
  r.onend =()=>{ if(ACTIVE_REC===r) ACTIVE_REC=null; onEnd&&onEnd(); };
  try{ r.start(); }catch(e){ return null; }
  ACTIVE_REC=r;
  return r;
}

/* --- השוואת טקסט סלחנית --- */
/* iOS ממיר גרש ישר לגרש מסולסל, מקף למקף ארוך ורווח לרווח לא שובר.
   בלי הנרמול הזה תשובה שנראית זהה לחלוטין נדחית.                      */
const norm = s => (s||'')
  /* תווי בקרה בלתי נראים לגמרי — LRM/RLM/ALM ודומיהם. ה-iOS מכניס אותם
     לפעמים אוטומטית בשדה אנגלי (dir=ltr) שיושב בתוך עמוד עברי (dir=rtl),
     בעיקר סביב סימני פיסוק או בסוף המילה. בלי זה, "yes" תקין חזותית
     יכול להיכשל מול "yes" בגלל תו שאף אחד לא רואה.                    */
  .replace(/[\u200B-\u200F\u2060\uFEFF\u061C]/g,'')
  .replace(/[\u2018\u2019\u02BC\u00B4]/g,"'")
  .replace(/[\u201C\u201D]/g,'"')
  .replace(/[\u2010-\u2015]/g,'-')
  .replace(/[\u00A0\u202F\u2007]/g,' ')
  .toLowerCase()
  .replace(/[.,!?;:'"()\-]/g,'')
  .replace(/\s+/g,' ').trim();
function near(a,b){
  /* בלי שום סובלנות לטעויות — התאמה מדויקת בלבד, אחרי נורמליזציה.
     norm() רק מנטרל הבדלים טכניים שהם לא באמת טעות: אותיות גדולות/קטנות,
     גרשיים חכמים של iOS, מקף ארוך, רווח לא שובר, רווחים כפולים, וסימני
     פיסוק בסוף. כל הבדל אחר במילה — נדחה.                              */
  return norm(a)===norm(b) && !!norm(a);
}

/* ---------- ערכת נושא וגודל טקסט ----------
   שני חלקים: (1) data-theme על ה-html, שה-CSS מגיב אליו — כולל
   [data-theme="auto"] שמאזין ל-prefers-color-scheme של עצמו.
   (2) meta[theme-color], שצובעת את שורת הסטטוס/הכרום של הדפדפן.
   הדפדפן לא מעדכן את השורה הזו לבד — היא נשארת קבועה עד שמישהו
   כותב לה ערך חדש, ולכן צריך לחשב את הצבע הנכון בכל קריאה.        */
const PAPER = { light:'#eceeed', dark:'#0c1418' };
const sysDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

function applyTheme(){
  const s = me()?.settings || {};
  const mode = s.theme || 'auto';
  document.documentElement.dataset.theme = mode;
  document.documentElement.dataset.size  = s.size || 'm';
  const effective = mode==='dark' ? 'dark' : mode==='light' ? 'light' : (sysDark()?'dark':'light');
  const meta=document.querySelector('#themeColorMeta');
  if(meta) meta.setAttribute('content', PAPER[effective]);
}

   מגיב לבד, אבל שורת הסטטוס לא; מאזין הזה מסנכרן אותה. */

/* ============================================================
   הקוף — הדמות המקורית של האפליקציה. תוכנן במיוחד לכאן ולא
   מבוסס על שום דמות קיימת: תוכי כחול, לא ינשוף — גם מבחינת
   הצבע וגם מבחינת הצורה. תוכי נבחר כי חיקוי הוא בדיוק המיומנות
   שהאפליקציה מתרגלת.                                          */
function mascotSVG(w){ w=w||120; return `<svg viewBox="0 0 220 260" width="{w}" height="{w}" style="display:block;margin:0 auto"><path d="M92 210 Q78 234 66 246 Q90 240 104 220 Z" fill="#159ce0"/><path d="M110 214 Q104 238 96 250 Q118 242 126 220 Z" fill="#1cb0f6"/><ellipse cx="46" cy="130" rx="17" ry="30" fill="#159ce0" transform="rotate(-28 46 130)"/><ellipse cx="110" cy="155" rx="58" ry="62" fill="#1cb0f6"/><ellipse cx="156" cy="155" rx="20" ry="38" fill="#159ce0"/><ellipse cx="106" cy="169" rx="36" ry="40" fill="#fff8e1"/><path d="M92 216 L88 236 M92 216 L98 234" stroke="#ff9500" stroke-width="6" stroke-linecap="round"/><path d="M124 216 L120 236 M124 216 L130 234" stroke="#ff9500" stroke-width="6" stroke-linecap="round"/><circle cx="108" cy="82" r="52" fill="#1cb0f6"/><path d="M86 34 Q90 12 104 20 Q100 34 90 40 Z" fill="#58cc02"/><path d="M104 26 Q116 6 130 16 Q120 32 108 36 Z" fill="#ffc800"/><circle cx="70" cy="96" r="10" fill="#ffb3b3"/><circle cx="146" cy="96" r="10" fill="#ffb3b3"/><circle cx="88" cy="80" r="19" fill="#fff"/><circle cx="128" cy="80" r="19" fill="#fff"/><circle cx="93" cy="83" r="9" fill="#3c3c3c"/><circle cx="133" cy="83" r="9" fill="#3c3c3c"/><circle cx="97" cy="78" r="3" fill="#fff"/><circle cx="137" cy="78" r="3" fill="#fff"/><path d="M102 96 Q108 118 96 122 Q110 130 122 118 Q126 100 114 92 Z" fill="#ff9500"/></svg>`.replace(/\{w\}/g, w); }

function setAction(html){

}

/* שדה קלט: פוקוס + גלילה כך שהמקלדת לא תסתיר אותו */
function focusInput(inp){
  if(!inp) return;
  /* block:'center' היה גורם לגלילת יתר במסכים נמוכים עם מקלדת פתוחה —
     דוחף את כותרת השאלה שלמעלה החוצה מהתצוגה. 'nearest' גולל את
     המינימום הדרוש כדי להראות את השדה, בלי לגעת במה שכבר גלוי. */
  const bring=()=>setTimeout(()=>inp.scrollIntoView({block:'nearest',behavior:'smooth'}),280);
  inp.addEventListener('focus',bring);
  inp.focus(); bring();
}

/* ---------- תיקון מקלדת ל-iOS: position:fixed מול המקלדת ----------
   ספארי ב-iOS ממקם position:fixed:bottom ביחס לגובה המלא של הדף,
   כאילו אין מקלדת פתוחה — כך שסרגל תחתון קבוע עלול להיעלם מתחתיה,
   באופן לא עקבי (תלוי גלילה, תלוי מסך). VisualViewport מדווח את
   הגובה שבאמת נראה למשתמש; מזיזים את האלמנטים הקבועים בדיוק בכמות
   שהמקלדת מכסה, כדי שיישארו צמודים מעל המקלדת תמיד.                */
/* ---------- תיקון מקלדת ל-iOS: position:fixed מול המקלדת ----------
   ספארי ב-iOS ממקם position:fixed:bottom ביחס לגובה המלא של הדף,
   כאילו אין מקלדת פתוחה — כך שסרגל תחתון קבוע עלול להיעלם מתחתיה,
   באופן לא עקבי (תלוי גלילה, תלוי מסך). VisualViewport מדווח את
   הגובה שבאמת נראה למשתמש; מזיזים את האלמנטים הקבועים בדיוק בכמות
   שהמקלדת מכסה, כדי שיישארו צמודים מעל המקלדת תמיד.

   הבעיה שתוקנה כאן: resize/scroll של VisualViewport לא תמיד נורה
   באופן אמין ב-iOS ברגע שהמקלדת נסגרת. אם מסתמכים רק על האירוע,
   ה-transform יכול "להיתקע" על הזזה ישנה — והתוכן החדש שמוצג
   (למשל "הבא" אחרי מענה) נולד כבר מוזז שלא לצורך, ולפעמים יוצא
   מחוץ לתצוגה. הפתרון: חישוב מחדש קורה גם ישירות בכל פעם שמשנים
   את תוכן הסרגל — לא רק כשהאירוע האסינכררוני נורה.                */
function repositionBars(){
  if(!window.visualViewport) return;
  const vv=window.visualViewport;
  const sideNav = () => window.matchMedia('(min-width:1024px)').matches;
  const covered=Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  const shift=covered>1 ? `translateY(-${covered}px)` : '';
  const ab=document.querySelector('#actionbar'); if(ab) ab.style.transform=shift;
  const nv=document.querySelector('#nav'); if(nv) nv.style.transform = sideNav() ? '' : shift;
  const sb=document.querySelector('.sheet-bg'); if(sb) sb.style.transform=shift;
}
function pinFixedBars(){
  if(!window.visualViewport) return;
  const vv=window.visualViewport;
  vv.addEventListener('resize', repositionBars);
  vv.addEventListener('scroll', repositionBars);
  repositionBars();
}

  $('#nav').classList.toggle('hide', !me() || inPractice);

  window.scrollTo(0,0);

];
const AVATAR_BY_ID = {};
AVATARS.forEach(a=>AVATAR_BY_ID[a.id]=a);
const DEFAULT_AVATAR = 'star';

/* ה-id ניתן ל-avatarHTML כדי לצייר עיגול צבעוני עם הסמל בפנים.
   %BG% בתוך ה-svg מציין חלקים שצריכים "לחתוך חור" בצבע הרקע —
   למשל חלון הרקטה — כדי שייראו כמו שכבה שקופה בלי SVG mask.       */
function avatarHTML(id, size){
  size = size || 44;
  const a = AVATAR_BY_ID[id] || AVATAR_BY_ID[DEFAULT_AVATAR];
  const svg = a.svg.split('%BG%').join(a.bg);
  const isz = Math.round(size*0.56);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="border-radius:50%;flex:none">
    <circle cx="${size/2}" cy="${size/2}" r="${size/2}" fill="${a.bg}"/>
    <g transform="translate(${(size-isz)/2},${(size-isz)/2}) scale(${isz/24})" fill="#fff">${svg}</g>
  </svg>`;
}

/* גיליון בחירת סמל — משמש גם ביצירת פרופיל וגם לשינוי מאוחר יותר.

   יחליט (ביצירה ממשיכים לשלב הבא, בשינוי סוגרים מיד).            */
function avatarPicker(host, current, onPick){
  host.innerHTML = AVATARS.map(a=>`<button data-id="${a.id}" class="avpick ${a.id===current?'on':''}">${avatarHTML(a.id,52)}</button>`).join('');
  host.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{
      host.querySelectorAll('button').forEach(x=>x.classList.remove('on'));

  });
}

    let size='m';
    sh.querySelectorAll('#sz button').forEach(b=>b.onclick=()=>{
      sh.querySelectorAll('#sz button').forEach(x=>x.classList.remove('on'));b.classList.add('on');size=b.dataset.v;
      document.documentElement.dataset.size=size; });
    sh.querySelector('#ok').onclick=()=>{
      const n=sh.querySelector('#nm').value.trim(); if(!n){toast(T('צריך שם'));return;}

/* ---------- הסשן ---------- */
function startSession(mode, size, lv, fromTask){
  const u=me(), oldLv=u.lv;
  if(!fromTask && !modeAllowed(u,mode)) return toast(T('המצב הזה נעול על ידי ההורה'));
  const left=capLeft(u);
  if(left<=0) return sheet(`<h2>${T('הגעת למגבלה היומית')}</h2>
    <p class="sub">${T('נקבעה מגבלה של')} ${u.ctrl.cap} ${T('פריטים ליום, וסיימת אותם. התרגול ייפתח שוב מחר.')}</p>
    <button class="btn" style="margin-top:16px" onclick="closeSheet()">${T('הבנתי')}</button>`);
  size=Math.min(size,left);
  if(lv!=null) u.lv=lv;
  const items=buildSession(u,size,mode);
  u.lv=oldLv;
  if(!items.length){ toast(T('אין פריטים זמינים')); return; }
  S={items,i:0,ok:0,msSum:0,mode,size,answered:false,t0:0,hardIds:[],finished:false};
  TAB='practice'; render();
}

function drawQ(s){
  const u=me(), it=S.items[S.i];
  if(!it) return drawDone(s);
  if(!u.seenTypes[it.t]) return showIntro(s, it);

  const target=TARGET[it.t]||6000;
  const card=u.srs[it.id];
  const isNew=!card;
  S.reveal=null; S.primary=null; S.revealInline=false; S.answered=false;

  s.innerHTML=`<div style="padding-top:calc(env(safe-area-inset-top) + 10px)">
    <div class="readout">
      <div class="hdr">
        <button id="quit" aria-label="${T('יציאה')}" style="color:var(--ink3);display:grid;place-items:center">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round">${ICONS.x}</svg></button>
        <b>${String(S.i+1).padStart(2,'0')}</b>/${String(S.items.length).padStart(2,'0')}
        <span class="tag ${isNew?'new':''}">${isNew?T('חדש'):T('חזרה')}</span>
        <span class="tag">${T(TYPE_HE[it.t]||it.t)}</span>
        <span class="spacer"></span><span class="live" id="fv">0.0s</span>
      </div>
      <div class="band"><div class="needle" id="ndl"></div></div>
      <div class="ticks"><span>0s</span><span>${(target/1000).toFixed(0)}s · ${T('יעד')}</span><span>${(target*2.2/1000).toFixed(0)}s</span></div>
    </div>
    <div id="q"></div></div>`;
  $('#quit').onclick=()=>askQuit(()=>{ S=null; TAB='home'; render(); });

  S.t0=performance.now();
  clearInterval(TICK);
  stopListening();
  /* מבטלים כל אודיו של השאלה הקודמת, כולל בקשות ענן שעדיין בדרך.
     בלי זה, קליפ איטי שחוזר מהשרת מתנגן על השאלה החדשה.        */
  stopAllAudio();
  TICK=setInterval(()=>{
    if(!S||S.answered) return;
    const ms=performance.now()-S.t0, r=ms/target;
    const n=$('#ndl'); if(!n) return clearInterval(TICK);
    n.style.left=Math.min(100, ms/(target*2.2)*100)+'%';
    n.className='needle '+(r<1?'':r<1.8?'mid':'slow');
    $('#fv').textContent=(ms/1000).toFixed(1)+'s';
  },100);

  RENDER[it.t]($('#q'), it, u, target);
  buildBar();
}

function buildBar(){
  /* בתרגילי הקלדה שני הכפתורים כבר מוטבעים ליד השדה — אין צורך
     בסרגל קבוע בכלל, וזה גם מה שמסלק לגמרי את כל בעיית המקלדת. */
  if(S.revealInline){ hideAction(); return; }
  const p=S.primary;
  const dk = S.reveal ? `<button class="btn ghost" id="dk" ${p?'':'style="flex:1"'}>${T('לא יודע')}</button>` : '';
  setAction(dk + (p?`<button class="btn" id="pri">${esc(p.label)}</button>`:''));

/* סיום שאלה */
function answer(it, correct, target, extraHtml){
  if(S.answered) return; S.answered=true; clearInterval(TICK); stopListening();
  const u=me(), ms=Math.round(performance.now()-S.t0);
  const {q}=review(u,it.id,correct,ms,target);
  touchDay(u,correct,ms); u.xp += correct?(q>=5?12:q>=4?9:6):2;
  if(u.task && !u.task.done){ u.task.prog=(u.task.prog||0)+1;
    if(u.task.prog>=u.task.size) u.task.done=1; }
  if(correct) S.ok++; else S.hardIds.push(it.id);
  S.msSum+=ms; saveUsers();
  const n=$('#ndl'); if(n) n.style.left=Math.min(100, ms/(target*2.2)*100)+'%';
  const fast = correct && ms<=target*.6;
  $('#q').appendChild(el(`<div class="fb ${correct?'ok':'no'}">
    <div class="hd">${correct?(fast?T('שליפה מיידית'):T('נכון')):T('לא מדויק')}<span class="spacer"></span><span class="badge">${(ms/1000).toFixed(1)}s</span></div>
    <div class="bd">${extraHtml||''}</div></div>`));
  const last = S.i+1>=S.items.length;
  setAction(`<button class="btn" id="nx">${last?T('סיום הסשן'):T('הבא')}</button>`);
  $('#nx').onclick=next;
  $('#q').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){ S.i++; render(); }
addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!S||TAB!=='practice') return;
  if(S.answered){ e.preventDefault(); next(); }
});

/* ---------- סיום ---------- */
/* ============================================================
   קול עידוד — משפט קצר שנאמר בקול בסיום סשן, בנוסף לטקסט על המסך.
   שלוש דרגות, תואמות בדיוק לתנאי ה-celebrate/promoted שכבר קובע
   מה מוצג ויזואלית — כדי שהקול לעולם לא יסתור את מה שכתוב:
     promoted  — הכי נלהב, כי זה הישג מדיד (עליית רמה)
     celebrate — נלהב, לדיוק גבוה בלי עלייה
     רגיל      — חם ותומך, לא מוגזם, כי הביצוע לא היה יוצא דופן
   כמה משפטים בכל דרגה כדי שלא יישמע אותו דבר בכל סיום.
   באנגלית בכוונה — זו בדיוק החשיפה שהאפליקציה נועדה לתת, גם
   ברגע החגיגה.                                                  */
const ENCOURAGE = {
  promoted: ["Amazing! You leveled up!", "Fantastic work! New level!", "Wow, you did it! Level up!"],
  celebrate: ["Great job!", "You're on fire!", "Excellent work!", "Well done!"],
  plain: ["Nice work today.", "Good effort! Keep it up.", "Well done, see you next time."]
};
function sayEncouragement(promoted, celebrate){
  const u = me();
  if(!u || !u.settings.autoSpeak) return;
  const pool = promoted ? ENCOURAGE.promoted : celebrate ? ENCOURAGE.celebrate : ENCOURAGE.plain;
  const line = pool[Math.floor(Math.random()*pool.length)];
  stopAllAudio();
  say(line, 1);
}

function drawDone(s){
  const u=me(), n=S.items.length, acc=Math.round(S.ok/n*100), avg=(S.msSum/n/1000).toFixed(1);
  const promoted=checkPromote(u); saveUsers();
  const note = avg<3.5?T('שליפה מהירה. זה בדיוק מה שמונע גמגום בדיבור.')
    : avg<6?T('קצב סביר. כדאי לחתור לשליפה מתחת לשלוש שניות.')
    : T('השליפה עדיין איטית. סשנים קצרים ויומיים עובדים טוב יותר מארוכים ונדירים.');
  const celebrate = promoted || acc>=80;
  s.innerHTML=`<div style="padding-top:calc(env(safe-area-inset-top) + 18px)">
    ${celebrate?`<div style="margin-bottom:6px">${mascotSVG(104)}</div>`:''}
    <h1 style="text-align:${celebrate?'center':'start'}">${promoted?T('רמה חדשה!') : acc>=80?T('סשן מצוין'):T('סיימת')}</h1>
    <p class="sub" style="text-align:${celebrate?'center':'start'}">${note}</p>
    <div class="grid3" style="margin-top:16px">
      <div class="stat"><div class="n">${acc}<span style="font-size:.6em">%</span></div><div class="l">${T('דיוק')}</div></div>
      <div class="stat"><div class="n">${avg}<span style="font-size:.6em">s</span></div><div class="l">${T('זמן ממוצע')}</div></div>
      <div class="stat"><div class="n">${S.ok}/${n}</div><div class="l">${T('נכונות')}</div></div>
    </div>
    ${u.task&&u.task.done===1?`<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)">
      <b>${T('המשימה הושלמה')}</b><div class="sub" style="margin-top:3px">${esc(u.task.note||u.task.label)}</div></div>`:''}
    ${promoted?`<div class="card" style="margin-top:12px;border-color:var(--good);background:var(--good-soft)">
      <b>${T('עלית לרמה')} ${u.lv} · ${T(LEVELS[u.lv].nm)}</b> ${cefrPill(u.lv)}<div class="sub" style="margin-top:3px">${T(LEVELS[u.lv].dsc)}</div></div>`:''}
    ${S.hardIds.length?`<div class="sec-title">${T('לחזרה קרובה')}</div><div class="card">${
      S.items.filter(x=>S.hardIds.includes(x.id)).map(x=>{
        const lbl = x.t.startsWith('w-')?`${x.d.en} — ${x.d.he}` : x.t==='rule'?x.d.ti
          : (x.d.en||x.d.s||x.d.q||x.d.w||x.d.u||x.d.full||x.d.sp||(x.d.a?x.d.a+' / '+x.d.b:'')||'');
        return `<div class="wordrow"><span class="dot" style="background:var(--bad)"></span>
          <span class="w">${esc(lbl)}</span><span class="badge">${T(TYPE_HE[x.t])}</span></div>`;
      }).join('')}</div>`:''}</div>`;
  if(u.task && u.task.done===1){ u.task.done=2; saveUsers(); }
  cloudSoon();
  S.finished=true;
  if(celebrate) confetti(promoted?60:42);
  sayEncouragement(promoted, celebrate);
  const m=S.mode, sz=S.size;
  setAction(`<button class="btn ghost" id="hm">${T('בית')}</button><button class="btn" id="ag">${T('עוד סשן')}</button>`);
  $('#hm').onclick=()=>{ S=null; go('home'); };
  $('#ag').onclick=()=>{ S=null; startSession(m,sz); };
}
/* אם למילה יש אסוציאציית מילת-מפתח, מציגים אותה במשוב — שם היא
   הכי מועילה, כי הלומד בדיוק גילה שהוא לא זכר.

   העזר הזה מוגן בכוונה: הוא רץ בתוך בניית המשוב, ולכן כל שגיאה
   כאן הייתה מפילה את answer() כולו — כלומר גם את כפתור "הבא".
   פונקציית תצוגה לעולם לא צריכה להיות מסוגלת לתקוע את התרגול.  */
/* ============================================================
   קונפטי — פרץ צבעוני קצר לרגעי חגיגה: סיום סשן טוב, עלייה ברמה.
   אלמנטים גולמיים שנופלים ומסתובבים ב-CSS, לא ספרייה חיצונית.
   מוסרים את עצמם מה-DOM בתום האנימציה כדי לא להצטבר.          */
function confetti(n){
  n = n || 46;
  const host = document.createElement('div');
  host.className='confetti-host';
  const colors=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = (Math.random()*100)+'%';
    p.style.background = colors[i%colors.length];
    p.style.animationDelay = (Math.random()*.35)+'s';
    p.style.animationDuration = (2+Math.random()*1.1)+'s';
    p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    p.style.setProperty('--x', (Math.random()*200-100)+'px');
    if(Math.random()<.5) p.style.borderRadius='50%';
    host.appendChild(p);
  }
  document.body.appendChild(host);
  setTimeout(()=>host.remove(), 3600);
}

function mnemLine(en){
  try{
    if(typeof MNEM_BY_WORD==='undefined') return '';
    const m=MNEM_BY_WORD[en];
    return m ? `<div class="mnem"><b>💡 ${esc(m.key)}</b> — ${esc(m.img)}</div>` : '';
  }catch(e){ return ''; }
}

RENDER.proof=(q,it,u,tg)=>{

  S.reveal=()=>{ const fixed=d.s.replace(d.bad, d.fix==='--'?'':d.fix).replace(/\s+/g,' ').trim();

    `<span style="text-decoration:line-through;opacity:.6" class="en">${esc(d.s)}</span><br><b class="en">${esc(fixed)}</b><br>${esc(d.he)}`); };
  const badWords=d.bad.split(' ');

RENDER['mp-say']=(q,it,u,tg)=>{
  const d=it.d, tgt = Math.random()<.5 ? d.a : d.b;
  const twin = tgt===d.a ? d.b : d.a;
  const ipaT = tgt===d.a ? d.ipaA : d.ipaB, heT = tgt===d.a ? d.heA : d.heB;
  q.innerHTML=`<div class="prompt"><div class="kicker">${T('הגייה מדויקת')}</div>
    <div class="med">${tgt}</div><div class="ipa">/${ipaT}/</div><div class="small">${heT}</div>
    <div class="muted" style="font-size:12.5px">${T('ולא')} <span class="en">${twin}</span></div>
    <button class="btn ghost sm" style="margin:0 auto" onclick="say('${jq(tgt)}',.7)">${T('שמיעת דוגמה')}</button></div>
    <div class="ruleblk" style="margin-top:12px"><b>${esc(d.contrast)}</b><br>${esc(d.tip)}</div>
    <div style="text-align:center;margin-top:14px"><button class="speakbtn" id="mic">${svg('mic')}</button>
      <p class="muted" id="st" style="margin-top:8px">${(SR&&u.ctrl.mic)?T('לחצו והגו את המילה'):T('זיהוי דיבור לא נתמך כאן')}</p></div>
`;
  say(tgt,.75);
  S.primary={label:T('תרגלתי'),fn:()=>answer(it,true,tg,`<b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span><br>${esc(d.tip)}`)};
  S.reveal=()=>{ say(tgt,.65); answer(it,false,tg,
    `<b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span> — ${heT}<br><b>${esc(d.contrast)}</b> — ${esc(d.tip)}`); };
  $('#mic').onclick=()=>{
    if(!SR||!u.ctrl.mic) return toast(u.ctrl.mic?T('אין תמיכה בזיהוי דיבור'):T('המיקרופון כבוי בהגדרות ההורים'));
    const m=$('#mic'); m.classList.add('rec'); $('#st').textContent=T('מקשיב…');
    listen(alts=>{
      m.classList.remove('rec');
      const hitT = alts.some(a=>near(a,tgt));
      const hitW = !hitT && alts.some(a=>near(a,twin));
      answer(it,hitT,tg, hitT
        ? `${T('מדויק')}: <b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span>`
        : hitW
          ? `${T('נשמע כמו')} <b class="en">${twin}</b>, ${T('לא')} <b class="en">${tgt}</b>.<br><b>${esc(d.contrast)}</b> — ${esc(d.tip)}`
          : `${T('שמעתי')}: <b class="en">${esc(alts[0]||'—')}</b><br>${T('המטרה')}: <b class="en">${tgt}</b> <span class="ipa">/${ipaT}/</span><br>${esc(d.tip)}`);
    },()=>{ m.classList.remove('rec'); if(!S.answered)$('#st').textContent=T('לא נקלט. נסו שוב או המשיכו.'); });
  };
};

/* ---------------- פעלים חריגים ---------------- */
function irrRender(q,it,u,tg,which){
  const d=it.d;
  const want = which==='past' ? d.past : d.pp;
  const label= which==='past' ? T('צורת העבר') : T('הצורה השלישית');
  const help = which==='past' ? T('Past Simple — "אתמול הוא ___"') : T('Past Participle — הצורה שאחרי have / has / was');
  q.innerHTML=`<div class="prompt"><div class="kicker">${T('פועל חריג')} · ${label}</div>
    <div class="big">${d.base}</div><div class="ipa">/${d.ipa}/</div>
    <div class="small">${d.he}</div>
    <div class="muted" style="font-size:.78rem">${help}</div></div>
    <div class="answerbox"><input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${which==='past'?'past':'participle'}"><button class="btn" id="chk">${T('בדיקה')}</button></div>
    <button class="btn ghost" id="dk">${T('לא יודע')}</button>`;
  const inp=$('#in'); focusInput(inp);
  const table = `<b class="en">${d.base} · ${d.past} · ${d.pp}</b><br>${esc(d.he)}
    <br><span class="muted">${T('תבנית')}: ${esc(IRR_GROUPS[d.grp]||'')}</span>`;
  const done=ok=>{ inp.classList.add(ok?'ok':'no'); say(`${d.base}, ${d.past}, ${d.pp}`,.8);
    answer(it,ok,tg,table); };
  /* התאמה מדויקת בלבד — לא near(). זו בדיוק התכלית של התרגיל: להבחין
     בין spoke ל‑spoken, בין became ל‑become. סובלנות לטעות הקלדה הייתה
     סותרת את המטרה ומקבלת בטעות צורה לא נכונה של אותו פועל.            */
  const chk=()=>done(want.split(' / ').some(x=>norm(inp.value)===norm(x)));
  inp.onkeydown=e=>{if(e.key==='Enter')chk()};
  $('#chk').onclick=chk;
  S.primary=null; S.revealInline=true;
  S.reveal=()=>done(false);
  $('#dk').onclick=()=>S.reveal();
}
RENDER['irr-past']=(q,it,u,tg)=>irrRender(q,it,u,tg,'past');
RENDER['irr-pp']  =(q,it,u,tg)=>irrRender(q,it,u,tg,'pp');

/* גיליון טבלת הפעלים, מקובץ לפי תבנית */
function irregSheet(lv){
  const u=me();
  const vs = IRREG.filter(v=>v.lv<=lv);
  const byGrp={};
  vs.forEach(v=>(byGrp[v.grp]=byGrp[v.grp]||[]).push(v));
  const order=['same','aught','ent','ept','iau','ioi','eoo','ownew','aken','aten','ame','wild'];
  sheet(`<h2>${T('פעלים חריגים')} · ${vs.length}</h2>
    <p class="sub">${T('אל תשננו אחד אחד. הם מתחלקים ל')}‑12 ${T('תבניות — מי שקולט את התבנית מקבל עשרות פעלים במכה.')}</p>
    <button class="btn" style="margin-top:14px" onclick="closeSheet();startSession('irregular',12)">${T('תרגול פעלים חריגים')}</button>
    ${order.filter(g=>byGrp[g]).map(g=>`
      <div class="sec-title">${g==='wild'?T('ללא תבנית'):T('תבנית')}</div>
      <div class="card"><div class="sub" style="margin-bottom:8px">${esc(IRR_GROUPS[g])}</div>
      ${byGrp[g].map(v=>{
        const st=Math.max(strength(u.srs['V:'+v.base+'#p']), strength(u.srs['V:'+v.base+'#3']));
        const col=st>=.7?'var(--good)':st>0?'var(--gold)':'var(--line)';
        return `<div class="wordrow"><span class="dot" style="background:${col}"></span>
          <span class="w">${esc(v.base)} · ${esc(v.past)} · ${esc(v.pp)}</span>
          <span class="h">${esc(v.he)}</span></div>`}).join('')}</div>`).join('')}`);
}
/* ---------------- הטיית זמן ----------------

    <div class="answerbox"><input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${esc(d.subj)} ..."><button class="btn" id="chk">${T('בדיקה')}</button></div>

  const inp=$('#in'); focusInput(inp);
  const full = d.subj+' '+d.ans;
  const done=ok=>{ inp.classList.add(ok?'ok':'no'); say(full);
    answer(it,ok,tg,`<b class="en">${esc(full)}</b><br>${esc(d.hint)}
      <br><span class="muted">${esc(t.nm)} — ${esc(t.use)}</span>`); };
  /* מקבלים גם "he works" וגם "works" — הגוף כבר מוצג על המסך */
  const chk=()=>{ const v=norm(inp.value);
    done(v===norm(d.ans) || v===norm(full)); };
  inp.onkeydown=e=>{if(e.key==='Enter')chk()};
  $('#chk').onclick=chk;
  S.primary=null; S.revealInline=true;
  S.reveal=()=>done(false);
  $('#dk').onclick=()=>S.reveal();
};
