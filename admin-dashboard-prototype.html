<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>לוח בקרה להורה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@400;500;600;700&display=swap');

  :root{
    --bg:#F5F7FB;
    --card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#6B7688;
    --ink-faint:#9AA3B2;
    --line:#E7EAF1;
    --primary:#4F6BFF;
    --primary-soft:#EEF1FF;
    --success:#22B573;
    --success-soft:#E4F7EE;
    --warn:#FF9F1C;
    --warn-soft:#FFF3E0;
    --danger:#E5484D;
    --danger-soft:#FDEAEB;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Heebo', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.rubik{font-family:'Rubik', sans-serif;}

  .screen{max-width:520px; margin:0 auto; padding:18px 16px 60px; min-height:100vh;}
  .hidden{display:none !important;}

  /* ---- PIN LOCK ---- */
  #pinScreen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px;}
  .lock-icon{width:52px; height:52px; margin-bottom:18px; color:var(--primary);}
  .pin-title{font-weight:700; font-size:19px; margin-bottom:4px;}
  .pin-sub{color:var(--ink-soft); font-size:14px; margin-bottom:28px;}
  .pin-dots{display:flex; gap:14px; margin-bottom:24px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:transparent; transition:all .15s;}
  .pin-dot.filled{background:var(--primary); border-color:var(--primary);}
  .pin-dots.error .pin-dot{border-color:var(--danger);}
  .pin-pad{display:grid; grid-template-columns:repeat(3, 64px); gap:14px;}
  .pin-key{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--line);
    background:var(--card); font-family:'Rubik'; font-weight:600; font-size:20px; color:var(--ink);
    cursor:pointer;
  }
  .pin-key:active{background:var(--primary-soft); border-color:var(--primary);}
  .pin-key.wide{grid-column:span 1;}
  .pin-hint{margin-top:22px; font-size:12.5px; color:var(--ink-faint);}

  /* ---- HEADER ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .topbar h1{font-size:20px; font-weight:700; margin:0;}
  .topbar .fam{font-size:13px; color:var(--ink-soft); font-weight:500;}
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
  }
  .icon-btn svg{width:18px; height:18px;}

  /* ---- CHILD LIST ---- */
  .child-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:12px; cursor:pointer;
    transition:box-shadow .15s, transform .1s;
  }
  .child-card:active{transform:scale(.98);}
  .avatar{
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-family:'Rubik'; font-weight:700; font-size:18px; color:#fff; flex-shrink:0;
  }
  .child-info{flex:1; min-width:0;}
  .child-name-row{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
  .child-name{font-weight:700; font-size:16px;}
  .age-badge{font-size:11.5px; color:var(--ink-soft); background:var(--bg); border-radius:8px; padding:2px 7px; font-weight:600;}
  .child-meta{font-size:12.5px; color:var(--ink-soft); display:flex; gap:10px;}
  .streak{display:flex; align-items:center; gap:3px; color:var(--warn); font-weight:600;}
  .streak svg{width:13px; height:13px;}

  .ring-wrap{position:relative; width:50px; height:50px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Rubik'; font-weight:700; font-size:12px;
  }

  .chevron{color:var(--ink-faint); flex-shrink:0;}
  .chevron svg{width:16px; height:16px;}

  /* ---- DETAIL ---- */
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .back-btn{background:none; border:none; cursor:pointer; color:var(--ink-soft); display:flex; padding:4px;}
  .back-btn svg{width:22px; height:22px;}
  .detail-head{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
  .detail-head .avatar{width:60px; height:60px; font-size:21px; border-radius:18px;}
  .detail-name{font-size:21px; font-weight:800; margin:0 0 2px;}
  .detail-sub{font-size:13px; color:var(--ink-soft); font-weight:500;}
  .level-chip{
    display:inline-block; background:var(--primary-soft); color:var(--primary); font-weight:700; font-size:11.5px;
    padding:3px 9px; border-radius:8px; margin-inline-start:6px;
  }

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .stat-tile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .stat-num{font-family:'Rubik'; font-weight:800; font-size:23px; line-height:1;}
  .stat-label{font-size:12px; color:var(--ink-soft); margin-top:5px; font-weight:500;}

  .section-title{font-size:15px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:6px;}
  .section{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:16px;}

  /* chart */
  .chart-box{width:100%; height:120px;}

  /* category rows */
  .cat-row{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .cat-row:not(:last-child){border-bottom:1px solid var(--bg);}
  .cat-label{font-size:13.5px; font-weight:600; width:64px; flex-shrink:0;}
  .cat-bar-track{flex:1; height:9px; background:var(--bg); border-radius:6px; overflow:hidden;}
  .cat-bar-fill{height:100%; border-radius:6px;}
  .cat-pct{font-size:12.5px; font-weight:700; color:var(--ink-soft); width:34px; text-align:left;}

  /* hardest words */
  .word-row{display:flex; align-items:center; gap:10px; padding:9px 0;}
  .word-row:not(:last-child){border-bottom:1px solid var(--bg);}
  .word-en{font-family:'Rubik'; font-weight:700; font-size:14.5px; direction:ltr; width:78px; flex-shrink:0;}
  .word-he{font-size:13px; color:var(--ink-soft); width:54px; flex-shrink:0;}
  .word-bar-track{flex:1; height:7px; background:var(--bg); border-radius:5px; overflow:hidden;}
  .word-bar-fill{height:100%; border-radius:5px; background:var(--danger);}
  .word-pct{font-size:12px; font-weight:700; color:var(--danger); width:32px; text-align:left;}

  /* activity log */
  .log-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:13px;}
  .log-row:not(:last-child){border-bottom:1px solid var(--bg);}
  .log-date{color:var(--ink-soft); width:78px; flex-shrink:0;}
  .log-cat{font-weight:600; flex:1;}
  .log-score{font-family:'Rubik'; font-weight:700; font-size:12.5px; padding:2px 8px; border-radius:7px;}
  .log-score.good{background:var(--success-soft); color:var(--success);}
  .log-score.mid{background:var(--warn-soft); color:var(--warn);}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen">
  <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  <div class="pin-title rubik">אזור הורים</div>
  <div class="pin-sub">הזן/י קוד PIN לצפייה בהתקדמות</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="pin-pad" id="pinPad"></div>
  <div class="pin-hint">קוד לדוגמה: 1234</div>
</div>

<!-- LIST SCREEN -->
<div class="screen hidden" id="listScreen">
  <div class="topbar">
    <div>
      <h1 class="rubik">לוח בקרה</h1>
      <div class="fam" id="famLabel">משפחת ארגאו</div>
    </div>
    <button class="icon-btn" id="lockBtn" aria-label="נעילה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </div>
  <div id="childList"></div>
</div>

<!-- DETAIL SCREEN -->
<div class="screen hidden" id="detailScreen">
  <div class="back-row">
    <button class="back-btn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
  </div>
  <div class="detail-head">
    <div class="avatar" id="dAvatar"></div>
    <div>
      <div class="detail-name rubik" id="dName"></div>
      <div class="detail-sub" id="dSub"></div>
    </div>
  </div>

  <div class="stat-grid" id="dStats"></div>

  <div class="section">
    <div class="section-title">📈 מילים שנשלטו - 14 ימים אחרונים</div>
    <div class="chart-box" id="chartBox"></div>
  </div>

  <div class="section">
    <div class="section-title">📚 לפי קטגוריה</div>
    <div id="catList"></div>
  </div>

  <div class="section">
    <div class="section-title">🎯 מילים קשות - כדאי לתרגל</div>
    <div id="hardList"></div>
  </div>

  <div class="section">
    <div class="section-title">🕐 יומן פעילות</div>
    <div id="logList"></div>
  </div>
</div>

<script>
const familyParam = new URLSearchParams(location.search).get('family');
if(familyParam){ document.getElementById('famLabel').textContent = 'משפחת ' + familyParam; }

/* ---------- DEMO DATA ---------- */
const CHILDREN = [
  {
    id:'noa', name:'נועה', age:8, level:2, color:'#FF6B5B',
    mastered:64, total:120, accuracy:78, streak:6, lastActive:'היום',
    avgSession:'4 דק׳',
    trend:[10,14,18,22,25,29,33,38,41,45,50,55,60,64],
    categories:[
      {name:'חיות', pct:92, color:'#22B573'},
      {name:'צבעים', pct:81, color:'#22B573'},
      {name:'אוכל', pct:64, color:'#FF9F1C'},
      {name:'מספרים', pct:47, color:'#E5484D'},
      {name:'בית', pct:70, color:'#FF9F1C'},
    ],
    hardWords:[
      {en:'giraffe', he:'ג׳ירפה', pct:28},
      {en:'seven', he:'שבע', pct:33},
      {en:'kitchen', he:'מטבח', pct:40},
      {en:'purple', he:'סגול', pct:44},
      {en:'nine', he:'תשע', pct:46},
    ],
    log:[
      {date:'היום 17:20', cat:'מספרים', score:'4/8'},
      {date:'אתמול 18:05', cat:'חיות', score:'8/8'},
      {date:'אתמול 07:45', cat:'אוכל', score:'6/8'},
      {date:'לפני יומיים', cat:'צבעים', score:'7/8'},
    ]
  },
  {
    id:'eitan', name:'איתן', age:10, level:3, color:'#4F6BFF',
    mastered:112, total:150, accuracy:85, streak:12, lastActive:'היום',
    avgSession:'6 דק׳',
    trend:[40,45,52,58,63,70,76,82,88,93,98,103,108,112],
    categories:[
      {name:'חיות', pct:97, color:'#22B573'},
      {name:'ספורט', pct:88, color:'#22B573'},
      {name:'בית', pct:91, color:'#22B573'},
      {name:'אוכל', pct:76, color:'#FF9F1C'},
      {name:'משפחה', pct:82, color:'#22B573'},
    ],
    hardWords:[
      {en:'referee', he:'שופט', pct:38},
      {en:'spinach', he:'תרד', pct:42},
      {en:'neighbor', he:'שכן', pct:51},
    ],
    log:[
      {date:'היום 16:10', cat:'ספורט', score:'8/8'},
      {date:'אתמול 19:30', cat:'אוכל', score:'5/8'},
      {date:'לפני 3 ימים', cat:'משפחה', score:'7/8'},
    ]
  },
  {
    id:'maya', name:'מאיה', age:6, level:1, color:'#8B7FE8',
    mastered:22, total:80, accuracy:61, streak:2, lastActive:'לפני 2 ימים',
    avgSession:'3 דק׳',
    trend:[2,3,5,6,8,9,11,13,15,16,18,19,21,22],
    categories:[
      {name:'צבעים', pct:75, color:'#22B573'},
      {name:'חיות', pct:58, color:'#FF9F1C'},
      {name:'מספרים', pct:34, color:'#E5484D'},
    ],
    hardWords:[
      {en:'three', he:'שלוש', pct:22},
      {en:'bear', he:'דוב', pct:30},
      {en:'yellow', he:'צהוב', pct:35},
    ],
    log:[
      {date:'לפני יומיים', cat:'צבעים', score:'6/8'},
      {date:'לפני 4 ימים', cat:'חיות', score:'4/8'},
    ]
  }
];

/* ---------- PIN LOGIC ---------- */
const CORRECT_PIN = '1234';
let pinBuffer = '';
const pinDotsEl = document.getElementById('pinDots');
const pinPad = document.getElementById('pinPad');
const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
keys.forEach(k => {
  const btn = document.createElement('button');
  btn.className = 'pin-key rubik';
  btn.textContent = k;
  if(k === '') btn.style.visibility = 'hidden';
  btn.addEventListener('click', () => onKey(k));
  pinPad.appendChild(btn);
});

function renderPinDots(){
  const dots = pinDotsEl.querySelectorAll('.pin-dot');
  dots.forEach((d,i) => d.classList.toggle('filled', i < pinBuffer.length));
}

function onKey(k){
  if(k === '⌫'){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(k === '' ) return;
  if(pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderPinDots();
  if(pinBuffer.length === 4){
    if(pinBuffer === CORRECT_PIN){
      setTimeout(() => {
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('listScreen').classList.remove('hidden');
      }, 200);
    } else {
      pinDotsEl.classList.add('error');
      setTimeout(() => {
        pinDotsEl.classList.remove('error');
        pinBuffer = '';
        renderPinDots();
      }, 500);
    }
  }
}

document.getElementById('lockBtn').addEventListener('click', () => {
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('detailScreen').classList.add('hidden');
  document.getElementById('pinScreen').classList.remove('hidden');
  pinBuffer = ''; renderPinDots();
});

/* ---------- RING HELPER ---------- */
function ringSvg(pct, color, size=50, stroke=5){
  const r = (size - stroke)/2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#EEF0F5" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- LIST RENDER ---------- */
const childListEl = document.getElementById('childList');
CHILDREN.forEach(c => {
  const pct = Math.round((c.mastered/c.total)*100);
  const card = document.createElement('div');
  card.className = 'child-card';
  card.innerHTML = `
    <div class="avatar" style="background:${c.color}">${c.name[0]}</div>
    <div class="child-info">
      <div class="child-name-row">
        <span class="child-name">${c.name}</span>
        <span class="age-badge">גיל ${c.age}</span>
      </div>
      <div class="child-meta">
        <span>${c.mastered}/${c.total} מילים</span>
        <span class="streak"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-1 4-6 6-6 11a6 6 0 0 0 12 0c0-2-1-3-2-4 .5 2-1 3-1 3 .5-3-1-5-3-10z"/></svg>${c.streak}</span>
        <span>${c.lastActive}</span>
      </div>
    </div>
    <div class="ring-wrap">${ringSvg(pct, c.color, 50, 5)}<div class="ring-pct">${pct}%</div></div>
    <div class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
  `;
  card.addEventListener('click', () => openDetail(c));
  childListEl.appendChild(card);
});

/* ---------- LINE CHART ---------- */
function lineChartSvg(data, color){
  const w = 460, h = 110, pad = 8;
  const max = Math.max(...data), min = 0;
  const stepX = (w - pad*2) / (data.length - 1);
  const pts = data.map((v,i) => {
    const x = pad + i*stepX;
    const y = h - pad - ((v-min)/(max-min || 1)) * (h - pad*2);
    return [x,y];
  });
  const linePath = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <defs><linearGradient id="grad-${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#grad-${color.replace('#','')})"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="4.5" fill="${color}"/>
  </svg>`;
}

/* ---------- DETAIL RENDER ---------- */
function openDetail(c){
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('detailScreen').classList.remove('hidden');

  document.getElementById('dAvatar').textContent = c.name[0];
  document.getElementById('dAvatar').style.background = c.color;
  document.getElementById('dName').textContent = c.name;
  document.getElementById('dSub').innerHTML = `גיל ${c.age} <span class="level-chip">רמה ${c.level}</span>`;

  document.getElementById('dStats').innerHTML = `
    <div class="stat-tile"><div class="stat-num" style="color:${c.color}">${c.mastered}/${c.total}</div><div class="stat-label">מילים נשלטו</div></div>
    <div class="stat-tile"><div class="stat-num">${c.accuracy}%</div><div class="stat-label">אחוז הצלחה</div></div>
    <div class="stat-tile"><div class="stat-num">🔥 ${c.streak}</div><div class="stat-label">ימי רצף</div></div>
    <div class="stat-tile"><div class="stat-num">${c.avgSession}</div><div class="stat-label">ממוצע לסשן</div></div>
  `;

  document.getElementById('chartBox').innerHTML = lineChartSvg(c.trend, c.color);

  document.getElementById('catList').innerHTML = c.categories.map(cat => `
    <div class="cat-row">
      <div class="cat-label">${cat.name}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${cat.pct}%; background:${cat.color}"></div></div>
      <div class="cat-pct">${cat.pct}%</div>
    </div>
  `).join('');

  document.getElementById('hardList').innerHTML = c.hardWords.map(w => `
    <div class="word-row">
      <div class="word-en">${w.en}</div>
      <div class="word-he">${w.he}</div>
      <div class="word-bar-track"><div class="word-bar-fill" style="width:${w.pct}%"></div></div>
      <div class="word-pct">${w.pct}%</div>
    </div>
  `).join('');

  document.getElementById('logList').innerHTML = c.log.map(l => {
    const [correct,totalQ] = l.score.split('/').map(Number);
    const good = correct/totalQ >= 0.75;
    return `
    <div class="log-row">
      <div class="log-date">${l.date}</div>
      <div class="log-cat">${l.cat}</div>
      <div class="log-score ${good?'good':'mid'}">${l.score}</div>
    </div>`;
  }).join('');
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('detailScreen').classList.add('hidden');
  document.getElementById('listScreen').classList.remove('hidden');
});
</script>
</body>
</html>
