<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BeEnglish — למידת אנגלית חכמה</title>
  
  <!-- PWA & Apple Meta Tags -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0F3FA8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BeEnglish">
  <link rel="apple-touch-icon" href="./beenglish-192.png">

  <style>
    :root {
      --primary: #0F3FA8;
      --primary-light: #2563eb;
      --bg-paper: #f8fafc;
      --surface: #ffffff;
      --ink1: #0f172a;
      --ink2: #334155;
      --ink3: #64748b;
      --ink4: #94a3b8;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-paper: #0c1418;
      --surface: #172228;
      --ink1: #f1f5f9;
      --ink2: #cbd5e1;
      --ink3: #92a9b2;
      --ink4: #6c848e;
      --border: #26353d;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-paper); color: var(--ink1); min-height: 100vh; display: flex; flex-direction: column; }
    
    header.topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 1.25rem; font-weight: 800; color: var(--primary); }

    main.screen {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
    }

    .word-en { font-size: 2.2rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; }
    .word-phonetic { font-size: 1.1rem; color: var(--ink3); font-style: italic; margin-bottom: 1rem; }
    .word-he { font-size: 1.5rem; font-weight: 600; color: var(--ink2); margin-bottom: 1.5rem; }
    .word-example { font-size: 0.95rem; color: var(--ink3); background: var(--bg-paper); padding: 1rem; border-radius: 8px; }

    .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1rem; }
    .btn {
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink1); }

    .hetext { direction: rtl; unicode-bidi: embed; }
    .speech-status { font-size: 0.85rem; color: var(--ink3); margin-top: 0.5rem; }
  </style>
</head>
<body>

  <header class="topbar" id="topbar">
    <div class="logo">BeEnglish</div>
    <button class="btn btn-outline" id="theme-toggle" onclick="toggleTheme()" aria-label="שינוי ערכת נושא">🌓</button>
  </header>

  <main class="screen" id="screen">
    <div class="card" id="practice-card">
      <div id="card-content">טוען נתונים...</div>
    </div>
  </main>

  <script>
    // ==========================================
    // 5. SECURITY: Sanitization Helper (XSS Protection)
    // ==========================================
    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const heSpan = s => `<span class="hetext">${esc(s)}</span>`;

    // ==========================================
    // 4. DATA ARCHITECTURE: Modular Dataset
    // ==========================================
    const INITIAL_WORDS = [
      { id: '1', en: 'avoid', he: 'להימנע', ipa: 'əˈvɔɪd', pos: 'v', exEn: 'Avoid bad habits.', exHe: 'הימנע מהרגלים רעים.' },
      { id: '2', en: 'achieve', he: 'להשיג', ipa: 'əˈtʃiːv', pos: 'v', exEn: 'Achieve your goals.', exHe: 'השג את המטרות שלך.' },
      { id: '3', en: 'consider', he: 'לשקול / לקחת בחשבון', ipa: 'kənˈsɪdər', pos: 'v', exEn: 'Consider all options.', exHe: 'שקול את כל האפשרויות.' }
    ];

    // ==========================================
    // 1. STORAGE & SRS: IndexedDB Engine & SM-2/Leitner Logic
    // ==========================================
    class SRSStorage {
      constructor() { this.dbName = 'BeEnglishDB'; this.db = null; }

      async init() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('words')) {
              db.createObjectStore('words', { keyPath: 'id' });
            }
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
          req.onerror = (e) => reject(e);
        });
      }

      async getAllWords() {
        return new Promise((resolve) => {
          const tx = this.db.transaction('words', 'readonly');
          const store = tx.objectStore('words');
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result);
        });
      }

      async saveWord(word) {
        return new Promise((resolve) => {
          const tx = this.db.transaction('words', 'readwrite');
          const store = tx.objectStore('words');
          store.put(word);
          tx.oncomplete = () => resolve();
        });
      }

      async seedIfEmpty() {
        const words = await this.getAllWords();
        if (words.length === 0) {
          for (const w of INITIAL_WORDS) {
            await this.saveWord({ ...w, box: 1, nextReview: Date.now() });
          }
        }
      }
    }

    const srs = new SRSStorage();

    // ==========================================
    // 3. SPEECH ENGINE: Speech Synthesis & Recognition
    // ==========================================
    class SpeechEngine {
      constructor() {
        this.synth = window.speechSynthesis;
        this.englishVoice = null;
        this.initVoices();
      }

      initVoices() {
        const updateVoices = () => {
          const voices = this.synth.getVoices();
          this.englishVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en')) || voices[0];
        };
        updateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
          speechSynthesis.onvoiceschanged = updateVoices;
        }
      }

      speak(text) {
        if (!this.synth) return;
        this.synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        if (this.englishVoice) utter.voice = this.englishVoice;
        utter.rate = 0.9;
        this.synth.speak(utter);
      }

      listen(targetWord, onResult) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          alert('זיהוי קולי אינו נתמך בדפדפן זה');
          return;
        }
        const rec = new SpeechRec();
        rec.lang = 'en-US';
        rec.onresult = (e) => {
          const spoken = e.results[0][0].transcript.toLowerCase().trim();
          onResult(spoken === targetWord.toLowerCase().trim(), spoken);
        };
        rec.start();
      }
    }

    const speech = new SpeechEngine();

    // ==========================================
    // APP LOGIC & RENDER ENGINE
    // ==========================================
    let currentWord = null;

    async function loadNextCard() {
      const words = await srs.getAllWords();
      const now = Date.now();
      // סינון מילים שזמן החזרה שלהן הגיע
      let dueWords = words.filter(w => w.nextReview <= now);
      if (dueWords.length === 0) dueWords = words; // Fallback אם הכל נלמד

      currentWord = dueWords[Math.floor(Math.random() * dueWords.length)];
      renderCard(false);
    }

    function renderCard(showAnswer = false) {
      const container = document.getElementById('card-content');
      if (!currentWord) {
        container.innerHTML = '<p>אין מילים לתרגול כעת!</p>';
        return;
      }

      container.innerHTML = `
        <div class="word-en">${esc(currentWord.en)}</div>
        <div class="word-phonetic">/${esc(currentWord.ipa)}/</div>
        <button class="btn btn-outline" onclick="speech.speak('${esc(currentWord.en)}')">🔊 השמע</button>
        <button class="btn btn-outline" onclick="practiceSpeech()">🎙️ תרגל דיבור</button>
        <div class="speech-status" id="speech-status"></div>
        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">
        ${showAnswer ? `
          <div class="word-he">${heSpan(currentWord.he)}</div>
          <div class="word-example">
            <div>${esc(currentWord.exEn)}</div>
            <div style="margin-top:0.25rem;">${heSpan(currentWord.exHe)}</div>
          </div>
          <div class="actions">
            <button class="btn btn-danger" onclick="handleAnswer(false)">לא ידעתי</button>
            <button class="btn btn-success" onclick="handleAnswer(true)">ידעתי מצוין</button>
          </div>
        ` : `
          <button class="btn btn-primary" style="width:100%;" onclick="renderCard(true)">הצג תשובה</button>
        `}
      `;
    }

    async function handleAnswer(isCorrect) {
      const intervals = [0, 1, 3, 7, 14, 30]; // ימים לפי תיבות SRS
      let box = currentWord.box || 1;

      if (isCorrect) {
        box = Math.min(box + 1, 5);
      } else {
        box = 1; // חזרה למתחילים
      }

      const nextReview = Date.now() + (intervals[box] * 24 * 60 * 60 * 1000);
      await srs.saveWord({ ...currentWord, box, nextReview });
      loadNextCard();
    }

    function practiceSpeech() {
      const statusEl = document.getElementById('speech-status');
      statusEl.innerText = 'מקשיב... דבר עכשיו באנגלית';
      speech.listen(currentWord.en, (isMatch, spoken) => {
        if (isMatch) {
          statusEl.innerText = `מצוין! זיהיתי: "${spoken}"`;
          statusEl.style.color = 'var(--success)';
        } else {
          statusEl.innerText = `נסה שוב. שמעתי: "${spoken}"`;
          statusEl.style.color = 'var(--danger)';
        }
      });
    }

    function toggleTheme() {
      const doc = document.documentElement;
      const current = doc.getAttribute('data-theme');
      doc.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', async () => {
      await srs.init();
      await srs.seedIfEmpty();
      loadNextCard();

      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered:', reg.scope))
          .catch(err => console.error('SW Error:', err));
      }
    });
  </script>
</body>
</html>
